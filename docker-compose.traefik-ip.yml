services:
  traefik:
    image: traefik:v3.7.5
    restart: unless-stopped
    command:
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - frontend_net
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

  web:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${DOCKER_FRONTEND_NETWORK:-o-okul_frontend_net}"
      - "traefik.http.routers.web-ip.rule=Host(`${SERVER_DOMAIN:-127.0.0.1}`)"
      - "traefik.http.routers.web-ip.entrypoints=websecure"
      - "traefik.http.routers.web-ip.priority=10"
      - "traefik.http.routers.web-ip.service=web-ip"
      - "traefik.http.routers.web-ip.tls=true"
      - "traefik.http.routers.web-ip.middlewares=web-ip-security-headers"
      - "traefik.http.middlewares.web-ip-security-headers.headers.stsseconds=15552000"
      - "traefik.http.middlewares.web-ip-security-headers.headers.stsincludesubdomains=false"
      - "traefik.http.middlewares.web-ip-security-headers.headers.contenttypenosniff=true"
      - "traefik.http.middlewares.web-ip-security-headers.headers.framedeny=true"
      - "traefik.http.middlewares.web-ip-security-headers.headers.referrerpolicy=no-referrer"
      - "traefik.http.middlewares.web-ip-security-headers.headers.permissionspolicy=camera=(), microphone=(), geolocation=()"
      - "traefik.http.middlewares.web-ip-security-headers.headers.contentsecuritypolicy=default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' wss:; worker-src 'self' blob:; manifest-src 'self'; media-src 'self' blob:"
      - "traefik.http.services.web-ip.loadbalancer.server.port=3001"

  api:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${DOCKER_FRONTEND_NETWORK:-o-okul_frontend_net}"
      - "traefik.http.routers.api-ip.rule=Host(`${SERVER_DOMAIN:-127.0.0.1}`) && (PathPrefix(`/api`) || PathPrefix(`/health`))"
      - "traefik.http.routers.api-ip.entrypoints=websecure"
      - "traefik.http.routers.api-ip.priority=100"
      - "traefik.http.routers.api-ip.service=api-ip"
      - "traefik.http.routers.api-ip.tls=true"
      - "traefik.http.routers.api-ip.middlewares=api-ip-security-headers"
      - "traefik.http.middlewares.api-ip-security-headers.headers.stsseconds=15552000"
      - "traefik.http.middlewares.api-ip-security-headers.headers.stsincludesubdomains=false"
      - "traefik.http.middlewares.api-ip-security-headers.headers.contenttypenosniff=true"
      - "traefik.http.middlewares.api-ip-security-headers.headers.framedeny=true"
      - "traefik.http.middlewares.api-ip-security-headers.headers.referrerpolicy=no-referrer"
      - "traefik.http.middlewares.api-ip-security-headers.headers.permissionspolicy=camera=(), microphone=(), geolocation=()"
      - "traefik.http.middlewares.api-ip-security-headers.headers.contentsecuritypolicy=default-src 'none'; frame-ancestors 'none'; base-uri 'none'"
      - "traefik.http.services.api-ip.loadbalancer.server.port=3100"

  evidence:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${DOCKER_FRONTEND_NETWORK:-o-okul_frontend_net}"
      - "traefik.http.routers.evidence-ip.rule=Host(`${SERVER_DOMAIN:-127.0.0.1}`) && PathPrefix(`/evidence`)"
      - "traefik.http.routers.evidence-ip.entrypoints=websecure"
      - "traefik.http.routers.evidence-ip.priority=110"
      - "traefik.http.routers.evidence-ip.service=evidence-ip"
      - "traefik.http.routers.evidence-ip.tls=true"
      - "traefik.http.routers.evidence-ip.middlewares=evidence-ip-strip,evidence-ip-security-headers"
      - "traefik.http.middlewares.evidence-ip-strip.stripprefix.prefixes=/evidence"
      - "traefik.http.middlewares.evidence-ip-security-headers.headers.stsseconds=15552000"
      - "traefik.http.middlewares.evidence-ip-security-headers.headers.stsincludesubdomains=false"
      - "traefik.http.middlewares.evidence-ip-security-headers.headers.contenttypenosniff=true"
      - "traefik.http.middlewares.evidence-ip-security-headers.headers.framedeny=true"
      - "traefik.http.middlewares.evidence-ip-security-headers.headers.referrerpolicy=no-referrer"
      - "traefik.http.middlewares.evidence-ip-security-headers.headers.contentsecuritypolicy=default-src 'none'; frame-ancestors 'none'; base-uri 'none'"
      - "traefik.http.services.evidence-ip.loadbalancer.server.port=8080"
