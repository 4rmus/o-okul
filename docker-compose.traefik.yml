services:
  traefik:
    image: traefik:v3.7.5
    command:
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - frontend_net
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

  web:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${DOCKER_FRONTEND_NETWORK:-o-okul_frontend_net}"
      - "traefik.http.routers.web.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.priority=10"
      - "traefik.http.routers.web.service=web"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.web.middlewares=web-security-headers"
      - "traefik.http.middlewares.web-security-headers.headers.stsseconds=15552000"
      - "traefik.http.middlewares.web-security-headers.headers.stsincludesubdomains=true"
      - "traefik.http.middlewares.web-security-headers.headers.contenttypenosniff=true"
      - "traefik.http.middlewares.web-security-headers.headers.framedeny=true"
      - "traefik.http.middlewares.web-security-headers.headers.referrerpolicy=no-referrer"
      - "traefik.http.middlewares.web-security-headers.headers.permissionspolicy=camera=(), microphone=(), geolocation=()"
      - "traefik.http.middlewares.web-security-headers.headers.contentsecuritypolicy=default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' wss:; worker-src 'self' blob:; manifest-src 'self'; media-src 'self' blob:"
      - "traefik.http.services.web.loadbalancer.server.port=3001"

  api:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${DOCKER_FRONTEND_NETWORK:-o-okul_frontend_net}"
      - "traefik.http.routers.api.rule=Host(`${DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/health`))"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.priority=100"
      - "traefik.http.routers.api.service=api"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api.middlewares=api-security-headers"
      - "traefik.http.middlewares.api-security-headers.headers.stsseconds=15552000"
      - "traefik.http.middlewares.api-security-headers.headers.stsincludesubdomains=true"
      - "traefik.http.middlewares.api-security-headers.headers.contenttypenosniff=true"
      - "traefik.http.middlewares.api-security-headers.headers.framedeny=true"
      - "traefik.http.middlewares.api-security-headers.headers.referrerpolicy=no-referrer"
      - "traefik.http.middlewares.api-security-headers.headers.permissionspolicy=camera=(), microphone=(), geolocation=()"
      - "traefik.http.middlewares.api-security-headers.headers.contentsecuritypolicy=default-src 'none'; frame-ancestors 'none'; base-uri 'none'"
      - "traefik.http.services.api.loadbalancer.server.port=3100"

volumes:
  traefik_letsencrypt:
