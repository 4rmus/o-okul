name: uzman-hocam

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    restart: unless-stopped
    logging: *default-logging
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WEB_PUSH_PUBLIC_KEY: ${NEXT_PUBLIC_WEB_PUSH_PUBLIC_KEY:-}
    ports:
      - "${WEB_HOST_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - frontend_net
    depends_on:
      api:
        condition: service_healthy

  api:
    restart: unless-stopped
    logging: *default-logging
    build:
      context: .
      target: api
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_ENABLED: ${LOG_ENABLED:-true}
      OPENAPI_UI_ENABLED: ${OPENAPI_UI_ENABLED:-false}
      API_RATE_LIMIT_ENABLED: ${API_RATE_LIMIT_ENABLED:-true}
      API_RATE_LIMIT_STORE: ${API_RATE_LIMIT_STORE:-redis}
      API_RATE_LIMIT_WINDOW_MS: ${API_RATE_LIMIT_WINDOW_MS:-60000}
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-300}
      IDEMPOTENCY_STORE: ${IDEMPOTENCY_STORE:-postgres}
      PORT: 3100
      APP_URL: ${APP_URL}
      API_URL: ${API_URL}
      WEB_URL: ${WEB_URL}
      PERSISTENCE_DRIVER: ${PERSISTENCE_DRIVER:-postgres}
      STUDENT_QUOTA: ${STUDENT_QUOTA:-200}
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_DATABASE_URL: ${DIRECT_DATABASE_URL}
      AUTH_USER_STORE: ${AUTH_USER_STORE:-postgres}
      AUTH_SESSION_STORE: ${AUTH_SESSION_STORE:-postgres}
      USER_MANAGEMENT_STORE: ${USER_MANAGEMENT_STORE:-postgres}
      IDENTITY_INVITATION_STORE: ${IDENTITY_INVITATION_STORE:-postgres}
      PASSWORD_RESET_STORE: ${PASSWORD_RESET_STORE:-postgres}
      REDIS_URL: ${REDIS_URL}
      QUEUE_PREFIX: ${QUEUE_PREFIX}
      QUEUE_METRICS_ENABLED: ${QUEUE_METRICS_ENABLED:-true}
      REPORT_PDF_RENDERER: ${REPORT_PDF_RENDERER:-worker}
      REPORT_PDF_RENDER_TIMEOUT_MS: ${REPORT_PDF_RENDER_TIMEOUT_MS:-30000}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-30d}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      STUDENT_PII_ENCRYPTION_KEY: ${STUDENT_PII_ENCRYPTION_KEY}
      STUDENT_PII_HASH_KEY: ${STUDENT_PII_HASH_KEY}
      ADMIN_MFA_MODE: ${ADMIN_MFA_MODE:-off}
      ADMIN_MFA_SECRET_ENCRYPTION_KEY: ${ADMIN_MFA_SECRET_ENCRYPTION_KEY}
      ADMIN_MFA_RECOVERY_HASH_KEY: ${ADMIN_MFA_RECOVERY_HASH_KEY}
      ADMIN_MFA_CHALLENGE_SECRET: ${ADMIN_MFA_CHALLENGE_SECRET}
      ADMIN_MFA_ISSUER: ${ADMIN_MFA_ISSUER:-Uzman Hocam}
      AI_REPORT_SUMMARY_PROVIDER: ${AI_REPORT_SUMMARY_PROVIDER:-disabled}
      COOKIE_SECURE: ${COOKIE_SECURE}
      SUPPORT_ATTACHMENT_STORAGE: ${SUPPORT_ATTACHMENT_STORAGE:-s3}
      HOMEWORK_MATERIAL_FILE_STORAGE: ${HOMEWORK_MATERIAL_FILE_STORAGE:-s3}
      UPLOAD_AV_SCANNER: ${UPLOAD_AV_SCANNER:-disabled}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_TIMEOUT_MS: ${CLAMAV_TIMEOUT_MS:-5000}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE}
      NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER:-noop}
      NOTIFICATION_ALLOW_NOOP_IN_PRODUCTION: ${NOTIFICATION_ALLOW_NOOP_IN_PRODUCTION:-false}
      NOTIFICATION_HTTP_ENDPOINT: ${NOTIFICATION_HTTP_ENDPOINT:-}
      NOTIFICATION_HTTP_BEARER_TOKEN: ${NOTIFICATION_HTTP_BEARER_TOKEN:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_SEND_DEFAULT_PII: ${SENTRY_SEND_DEFAULT_PII:-false}
    ports:
      - "${API_HOST_PORT:-3100}:3100"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - frontend_net
      - backend_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy

  worker:
    restart: unless-stopped
    logging: *default-logging
    build:
      context: .
      target: worker
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_ENABLED: ${LOG_ENABLED:-true}
      PERSISTENCE_DRIVER: ${PERSISTENCE_DRIVER:-postgres}
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_DATABASE_URL: ${DIRECT_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      QUEUE_PREFIX: ${QUEUE_PREFIX}
      STUDENT_PII_HASH_KEY: ${STUDENT_PII_HASH_KEY}
      AI_REPORT_SUMMARY_PROVIDER: ${AI_REPORT_SUMMARY_PROVIDER:-disabled}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE}
      SMS_PROVIDER: ${SMS_PROVIDER:-noop}
      SMS_ALLOW_NOOP_IN_PRODUCTION: ${SMS_ALLOW_NOOP_IN_PRODUCTION:-false}
      NETGSM_ENDPOINT: ${NETGSM_ENDPOINT:-https://api.netgsm.com.tr/sms/rest/v2/send}
      NETGSM_USERCODE: ${NETGSM_USERCODE:-}
      NETGSM_PASSWORD: ${NETGSM_PASSWORD:-}
      NETGSM_MSG_HEADER: ${NETGSM_MSG_HEADER:-}
      NETGSM_IYS_FILTER: ${NETGSM_IYS_FILTER:-0}
      NETGSM_APP_NAME: ${NETGSM_APP_NAME:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_SEND_DEFAULT_PII: ${SENTRY_SEND_DEFAULT_PII:-false}
    networks:
      - backend_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  queue-board:
    restart: unless-stopped
    logging: *default-logging
    build:
      context: .
      target: queue-board
    environment:
      NODE_ENV: production
      PORT: 3200
      REDIS_URL: ${REDIS_URL}
      QUEUE_PREFIX: ${QUEUE_PREFIX}
      QUEUE_BOARD_BASE_PATH: ${QUEUE_BOARD_BASE_PATH:-/admin/queues}
      QUEUE_BOARD_BASIC_AUTH_USER: ${QUEUE_BOARD_BASIC_AUTH_USER}
      QUEUE_BOARD_BASIC_AUTH_PASSWORD: ${QUEUE_BOARD_BASIC_AUTH_PASSWORD}
    ports:
      - "127.0.0.1:${QUEUE_BOARD_HOST_PORT:-3200}:3200"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3200/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_net
    depends_on:
      redis:
        condition: service_healthy

  postgres:
    restart: unless-stopped
    logging: *default-logging
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      MIGRATION_DB_USER: ${MIGRATION_DB_USER}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend_net

  redis:
    restart: unless-stopped
    logging: *default-logging
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend_net

  clamav:
    restart: unless-stopped
    logging: *default-logging
    image: clamav/clamav:stable
    environment:
      CLAMD_STARTUP_TIMEOUT: ${CLAMD_STARTUP_TIMEOUT:-1800}
    expose:
      - "3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --version >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 2m
    networks:
      - backend_net

  minio:
    restart: unless-stopped
    logging: *default-logging
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend_net

  minio-setup:
    image: minio/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID} ${S3_SECRET_ACCESS_KEY} &&
      mc mb -p local/${S3_BUCKET} &&
      mc ls local"
    restart: "no"
    networks:
      - backend_net

networks:
  frontend_net:
  backend_net:

volumes:
  postgres_data:
  redis_data:
  clamav_data:
  minio_data:
