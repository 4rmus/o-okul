name: o-okul

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    cpus: ${WEB_CPUS:-0.75}
    mem_limit: ${WEB_MEM_LIMIT:-768m}
    restart: unless-stopped
    logging: *default-logging
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SMS_ENABLED: ${NEXT_PUBLIC_SMS_ENABLED:-false}
    environment:
      NODE_ENV: production
      NODE_OPTIONS: ${WEB_NODE_OPTIONS:---max-old-space-size=512}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_SMS_ENABLED: ${NEXT_PUBLIC_SMS_ENABLED:-false}
      NEXT_PUBLIC_WEB_PUSH_PUBLIC_KEY: ${NEXT_PUBLIC_WEB_PUSH_PUBLIC_KEY:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_SEND_DEFAULT_PII: ${SENTRY_SEND_DEFAULT_PII:-false}
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - frontend_net
    depends_on:
      api:
        condition: service_healthy

  api:
    cpus: ${API_CPUS:-1.00}
    mem_limit: ${API_MEM_LIMIT:-1g}
    restart: unless-stopped
    logging: *default-logging
    build:
      context: .
      target: api
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    environment:
      NODE_ENV: ${API_NODE_ENV:-production}
      NODE_OPTIONS: ${API_NODE_OPTIONS:---max-old-space-size=768}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_ENABLED: ${LOG_ENABLED:-true}
      OPENAPI_UI_ENABLED: ${OPENAPI_UI_ENABLED:-false}
      API_RATE_LIMIT_ENABLED: ${API_RATE_LIMIT_ENABLED:-true}
      API_RATE_LIMIT_STORE: ${API_RATE_LIMIT_STORE:-redis}
      API_RATE_LIMIT_WINDOW_MS: ${API_RATE_LIMIT_WINDOW_MS:-60000}
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-300}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-${TRAEFIK_PROXY_IP:-172.31.255.2}/32}
      IDEMPOTENCY_STORE: ${IDEMPOTENCY_STORE:-postgres}
      LOGIN_ATTEMPT_LIMITER_STORE: ${LOGIN_ATTEMPT_LIMITER_STORE:-redis}
      PORT: 3100
      APP_URL: ${APP_URL}
      API_URL: ${API_URL}
      WEB_URL: ${WEB_URL}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      PERSISTENCE_DRIVER: ${PERSISTENCE_DRIVER:-postgres}
      STUDENT_QUOTA: ${STUDENT_QUOTA:-200}
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://app:app@postgres:5432/o_okul}
      DIRECT_DATABASE_URL: ${DOCKER_DIRECT_DATABASE_URL:-postgresql://migration:migration@postgres:5432/o_okul}
      AUTH_USER_STORE: ${AUTH_USER_STORE:-postgres}
      AUTH_SESSION_STORE: ${AUTH_SESSION_STORE:-postgres}
      USER_MANAGEMENT_STORE: ${USER_MANAGEMENT_STORE:-postgres}
      IDENTITY_INVITATION_STORE: ${IDENTITY_INVITATION_STORE:-postgres}
      PASSWORD_RESET_STORE: ${PASSWORD_RESET_STORE:-postgres}
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://redis:6379}
      QUEUE_PREFIX: ${QUEUE_PREFIX}
      QUEUE_METRICS_ENABLED: ${QUEUE_METRICS_ENABLED:-true}
      REPORT_PDF_RENDERER: ${REPORT_PDF_RENDERER:-worker}
      REPORT_PDF_RENDER_TIMEOUT_MS: ${REPORT_PDF_RENDER_TIMEOUT_MS:-30000}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-30d}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      STUDENT_PII_ENCRYPTION_KEY: ${STUDENT_PII_ENCRYPTION_KEY}
      STUDENT_PII_HASH_KEY: ${STUDENT_PII_HASH_KEY}
      ADMIN_MFA_MODE: ${ADMIN_MFA_MODE:-off}
      ADMIN_MFA_SECRET_ENCRYPTION_KEY: ${ADMIN_MFA_SECRET_ENCRYPTION_KEY:-}
      SECRET_DELIVERY_ENCRYPTION_KEY: ${SECRET_DELIVERY_ENCRYPTION_KEY:-}
      ADMIN_MFA_RECOVERY_HASH_KEY: ${ADMIN_MFA_RECOVERY_HASH_KEY:-}
      ADMIN_MFA_CHALLENGE_SECRET: ${ADMIN_MFA_CHALLENGE_SECRET:-}
      ADMIN_MFA_ISSUER: ${ADMIN_MFA_ISSUER:-o-okul}
      COOKIE_SECURE: ${COOKIE_SECURE}
      SUPPORT_ATTACHMENT_STORAGE: ${SUPPORT_ATTACHMENT_STORAGE:-s3}
      HOMEWORK_MATERIAL_FILE_STORAGE: ${HOMEWORK_MATERIAL_FILE_STORAGE:-s3}
      UPLOAD_AV_SCANNER: ${UPLOAD_AV_SCANNER:-disabled}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_TIMEOUT_MS: ${CLAMAV_TIMEOUT_MS:-5000}
      S3_ENDPOINT: ${DOCKER_S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE}
      NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER:-noop}
      NOTIFICATION_ALLOW_NOOP_IN_PRODUCTION: ${NOTIFICATION_ALLOW_NOOP_IN_PRODUCTION:-false}
      NOTIFICATION_HTTP_ENDPOINT: ${NOTIFICATION_HTTP_ENDPOINT:-}
      NOTIFICATION_HTTP_BEARER_TOKEN: ${NOTIFICATION_HTTP_BEARER_TOKEN:-}
      SMS_ENABLED: ${SMS_ENABLED:-false}
      SMS_PROVIDER: ${SMS_PROVIDER:-noop}
      SMS_ALLOW_NOOP_IN_PRODUCTION: ${SMS_ALLOW_NOOP_IN_PRODUCTION:-false}
      NETGSM_ENDPOINT: ${NETGSM_ENDPOINT:-https://api.netgsm.com.tr/sms/rest/v2/send}
      NETGSM_USERCODE: ${NETGSM_USERCODE:-}
      NETGSM_PASSWORD: ${NETGSM_PASSWORD:-}
      NETGSM_MSG_HEADER: ${NETGSM_MSG_HEADER:-}
      NETGSM_IYS_FILTER: ${NETGSM_IYS_FILTER:-0}
      NETGSM_APP_NAME: ${NETGSM_APP_NAME:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_SEND_DEFAULT_PII: ${SENTRY_SEND_DEFAULT_PII:-false}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3100}:3100"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      frontend_net:
      backend_net:
      proxy_net:
        ipv4_address: ${API_PROXY_IP:-172.31.255.3}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    cpus: ${WORKER_CPUS:-1.50}
    mem_limit: ${WORKER_MEM_LIMIT:-2g}
    restart: unless-stopped
    logging: *default-logging
    build:
      context: .
      target: worker
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    environment:
      NODE_ENV: ${WORKER_NODE_ENV:-production}
      NODE_OPTIONS: ${WORKER_NODE_OPTIONS:---max-old-space-size=1536}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_ENABLED: ${LOG_ENABLED:-true}
      PERSISTENCE_DRIVER: ${PERSISTENCE_DRIVER:-postgres}
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://app:app@postgres:5432/o_okul}
      DIRECT_DATABASE_URL: ${DOCKER_DIRECT_DATABASE_URL:-postgresql://migration:migration@postgres:5432/o_okul}
      SECRET_DELIVERY_OUTBOX_DATABASE_URL: ${DOCKER_SECRET_DELIVERY_OUTBOX_DATABASE_URL:-}
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://redis:6379}
      QUEUE_PREFIX: ${QUEUE_PREFIX}
      STUDENT_PII_HASH_KEY: ${STUDENT_PII_HASH_KEY}
      SECRET_DELIVERY_ENCRYPTION_KEY: ${SECRET_DELIVERY_ENCRYPTION_KEY:-}
      NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER:-noop}
      NOTIFICATION_ALLOW_NOOP_IN_PRODUCTION: ${NOTIFICATION_ALLOW_NOOP_IN_PRODUCTION:-false}
      NOTIFICATION_HTTP_ENDPOINT: ${NOTIFICATION_HTTP_ENDPOINT:-}
      NOTIFICATION_HTTP_BEARER_TOKEN: ${NOTIFICATION_HTTP_BEARER_TOKEN:-}
      S3_ENDPOINT: ${DOCKER_S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE}
      SMS_ENABLED: ${SMS_ENABLED:-false}
      SMS_PROVIDER: ${SMS_PROVIDER:-noop}
      SMS_ALLOW_NOOP_IN_PRODUCTION: ${SMS_ALLOW_NOOP_IN_PRODUCTION:-false}
      NETGSM_ENDPOINT: ${NETGSM_ENDPOINT:-https://api.netgsm.com.tr/sms/rest/v2/send}
      NETGSM_USERCODE: ${NETGSM_USERCODE:-}
      NETGSM_PASSWORD: ${NETGSM_PASSWORD:-}
      NETGSM_MSG_HEADER: ${NETGSM_MSG_HEADER:-}
      NETGSM_IYS_FILTER: ${NETGSM_IYS_FILTER:-0}
      NETGSM_APP_NAME: ${NETGSM_APP_NAME:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_SEND_DEFAULT_PII: ${SENTRY_SEND_DEFAULT_PII:-false}
    networks:
      - backend_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  queue-board:
    cpus: ${QUEUE_BOARD_CPUS:-0.25}
    mem_limit: ${QUEUE_BOARD_MEM_LIMIT:-256m}
    restart: unless-stopped
    logging: *default-logging
    build:
      context: .
      target: queue-board
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    environment:
      NODE_ENV: ${QUEUE_BOARD_NODE_ENV:-production}
      NODE_OPTIONS: ${QUEUE_BOARD_NODE_OPTIONS:---max-old-space-size=256}
      PORT: 3200
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://redis:6379}
      QUEUE_PREFIX: ${QUEUE_PREFIX}
      QUEUE_BOARD_BASE_PATH: ${QUEUE_BOARD_BASE_PATH:-/admin/queues}
      QUEUE_BOARD_BASIC_AUTH_USER: ${QUEUE_BOARD_BASIC_AUTH_USER}
      QUEUE_BOARD_BASIC_AUTH_PASSWORD: ${QUEUE_BOARD_BASIC_AUTH_PASSWORD}
    ports:
      - "127.0.0.1:${QUEUE_BOARD_HOST_PORT:-3200}:3200"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3200/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_net
    depends_on:
      redis:
        condition: service_healthy

  evidence:
    cpus: ${EVIDENCE_CPUS:-0.10}
    mem_limit: ${EVIDENCE_MEM_LIMIT:-64m}
    restart: unless-stopped
    logging: *default-logging
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${EVIDENCE_HOST_PORT:-3300}:8080"
    volumes:
      - ./artifacts/staging/reports:/usr/share/nginx/html:ro
      - ./docker/evidence/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - frontend_net

  postgres:
    cpus: ${POSTGRES_CPUS:-1.00}
    mem_limit: ${POSTGRES_MEM_LIMIT:-1536m}
    restart: unless-stopped
    logging: *default-logging
    image: postgres:16-alpine
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}"
      - "-c"
      - "effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-2GB}"
      - "-c"
      - "work_mem=${POSTGRES_WORK_MEM:-8MB}"
      - "-c"
      - "maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-128MB}"
      - "-c"
      - "max_connections=${POSTGRES_MAX_CONNECTIONS:-80}"
      - "-c"
      - "wal_level=${POSTGRES_WAL_LEVEL:-replica}"
      - "-c"
      - "archive_mode=${POSTGRES_ARCHIVE_MODE:-on}"
      - "-c"
      - "archive_command=${POSTGRES_ARCHIVE_COMMAND:-test ! -f /var/lib/postgresql/wal-archive/%f && cp %p /var/lib/postgresql/wal-archive/%f}"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      MIGRATION_DB_USER: ${MIGRATION_DB_USER}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD}
      SECRET_DELIVERY_WORKER_DB_PASSWORD: ${SECRET_DELIVERY_WORKER_DB_PASSWORD:-}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_wal_archive:/var/lib/postgresql/wal-archive
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend_net

  redis:
    cpus: ${REDIS_CPUS:-0.50}
    mem_limit: ${REDIS_MEM_LIMIT:-512m}
    restart: unless-stopped
    logging: *default-logging
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "${REDIS_MAXMEMORY:-384mb}", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend_net

  clamav:
    profiles: ["av"]
    cpus: ${CLAMAV_CPUS:-0.75}
    mem_limit: ${CLAMAV_MEM_LIMIT:-1536m}
    restart: unless-stopped
    logging: *default-logging
    image: clamav/clamav:stable
    environment:
      CLAMD_STARTUP_TIMEOUT: ${CLAMD_STARTUP_TIMEOUT:-1800}
    expose:
      - "3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --version >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 2m
    networks:
      - backend_net

  minio:
    cpus: ${MINIO_CPUS:-0.50}
    mem_limit: ${MINIO_MEM_LIMIT:-768m}
    restart: unless-stopped
    logging: *default-logging
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend_net

  minio-setup:
    cpus: ${MINIO_SETUP_CPUS:-0.25}
    mem_limit: ${MINIO_SETUP_MEM_LIMIT:-256m}
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID} ${S3_SECRET_ACCESS_KEY} &&
      mc mb -p local/${S3_BUCKET} &&
      mc ls local"
    restart: "no"
    networks:
      - backend_net

networks:
  frontend_net:
  proxy_net:
    internal: true
    ipam:
      config:
        - subnet: ${DOCKER_PROXY_SUBNET:-172.31.255.0/29}
  backend_net:

volumes:
  postgres_data:
  postgres_wal_archive:
  redis_data:
  clamav_data:
  minio_data:
