# Project-scoped Codex configuration for o-okul.
# Reference: Codex config reference (learn.chatgpt.com/docs/config-file/config-reference), checked 2026-10-10.
# Governance contract: AGENTS.md "Subagent Orchestration" and docs/codex-agent-architecture.md.

approval_policy = "on-request"
sandbox_mode = "workspace-write"

[agents]
# Canonical concurrency key. `max_threads` is the legacy alias and is rejected by `pnpm agents:check`.
# Caps open spawned-agent threads; the primary (main) thread is excluded.
max_concurrent_threads_per_session = 3
# Governance declarations retained from the 0.142.x-era config. They are not listed in the current
# config reference; AGENTS.md enforces depth 1 and bounded runtimes procedurally (UNPROVEN on the client).
max_depth = 1
job_max_runtime_seconds = 1800

[sandbox_workspace_write]
network_access = false

# Streamable HTTP MCP server for OpenAI/Codex documentation lookups (used by docs_researcher).
# Endpoint verified 2026-10-10: POST initialize returns 200 text/event-stream.
[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 60
