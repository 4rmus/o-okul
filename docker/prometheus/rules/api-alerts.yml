groups:
  - name: uzman-hocam-api
    rules:
      - alert: UzmanHocamApiDown
        expr: up{job="uzman-hocam-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: API metrics endpoint unreachable
          description: Prometheus cannot scrape the API /metrics endpoint.

      - alert: UzmanHocamApiHighErrorRate
        expr: sum(rate(uzman_hocam_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(uzman_hocam_http_requests_total[5m])), 1) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: API 5xx rate is high
          description: More than 5% of API requests returned 5xx for 10 minutes.

      - alert: UzmanHocamApiSlowRequests
        expr: sum(rate(uzman_hocam_http_request_duration_seconds_sum[5m])) / clamp_min(sum(rate(uzman_hocam_http_requests_total[5m])), 1) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: API average request duration is high
          description: Average API request duration stayed above 1 second for 10 minutes.

      - alert: UzmanHocamReadinessFailing
        expr: increase(uzman_hocam_http_requests_total{path="/health/ready",status!~"2.."}[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: API readiness check is failing
          description: /health/ready returned a non-2xx response in the last 5 minutes.
