groups:
  - name: o-okul-api
    rules:
      - alert: OOkulApiDown
        expr: up{job="o-okul-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: API metrics endpoint unreachable
          description: Prometheus cannot scrape the API /api/v1/metrics endpoint.

      - alert: OOkulApiHighErrorRate
        expr: sum(rate(o_okul_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(o_okul_http_requests_total[5m])), 1) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: API 5xx rate is high
          description: More than 5% of API requests returned 5xx for 10 minutes.

      - alert: OOkulApiSlowRequests
        expr: sum(rate(o_okul_http_request_duration_seconds_sum[5m])) / clamp_min(sum(rate(o_okul_http_requests_total[5m])), 1) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: API average request duration is high
          description: Average API request duration stayed above 1 second for 10 minutes.

      - alert: OOkulReadinessFailing
        expr: increase(o_okul_http_requests_total{path="/health/ready",status!~"2.."}[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: API readiness check is failing
          description: /health/ready returned a non-2xx response in the last 5 minutes.

      - alert: OOkulQueueFailedJobs
        expr: sum(o_okul_queue_jobs{status="failed"}) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: BullMQ failed jobs are present
          description: At least one BullMQ queue has failed jobs for more than 5 minutes.

      - alert: OOkulQueueMetricsScrapeFailing
        expr: o_okul_queue_metrics_scrape_error == 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Queue metrics scrape is failing
          description: The API /api/v1/metrics endpoint is reachable but cannot collect BullMQ queue counts.

      - alert: OOkulAuthSecuritySideEffectFailed
        expr: sum by (event) (increase(o_okul_auth_security_side_effect_failures_total{job="o-okul-api"}[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "Security side effect failed after MFA reset ({{ $labels.event }})"
          description: "A SYSTEM_ADMIN MFA reset committed but its follow-up ({{ $labels.event }}: mfa_reset_audit = audit row not written, mfa_notice_enqueue = security notice e-mail not queued) failed in the last 15 minutes. Find the API warn/error log line for the ids and complete the step by hand."
          runbook: "docs/phase-6-ops-runbook.md - Kurum sahibi/yöneticisi MFA sıfırlama"
