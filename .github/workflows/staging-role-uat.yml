name: Staging Role UAT

on:
  workflow_dispatch:
    inputs:
      deploy_run_id:
        description: "Successful Staging Deploy run whose exact-SHA UAT inputs will be verified."
        required: true
        type: string

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    concurrency:
      group: staging-role-uat-${{ inputs.deploy_run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate selected deployment run metadata
        shell: bash
        env:
          DEPLOY_RUN_ID: ${{ inputs.deploy_run_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_RUN_ID" =~ ^[0-9]+$ ]]
          run_file="$RUNNER_TEMP/staging-deploy-run.json"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$DEPLOY_RUN_ID" > "$run_file"
          node --input-type=module - "$run_file" "$GITHUB_REPOSITORY" <<'NODE'
          import { readFileSync } from "node:fs";
          const [file, repository] = process.argv.slice(2);
          const run = JSON.parse(readFileSync(file, "utf8"));
          if (
            run?.repository?.full_name !== repository ||
            run?.path !== ".github/workflows/staging-deploy.yml" ||
            run?.status !== "completed" ||
            run?.conclusion !== "success"
          ) {
            process.exit(1);
          }
          NODE

      - uses: actions/download-artifact@v4
        with:
          name: staging-deployment-cutover-${{ inputs.deploy_run_id }}
          run-id: ${{ inputs.deploy_run_id }}
          github-token: ${{ github.token }}
          path: artifacts/cutover

      - name: Validate selected deployment cutover
        shell: bash
        env:
          DEPLOY_RUN_ID: ${{ inputs.deploy_run_id }}
        run: |
          DEPLOYMENT_CUTOVER_EVIDENCE_TARGET="file://$PWD/artifacts/cutover/deployment-cutover.json" \
          DEPLOYMENT_CUTOVER_EXPECTED_RUN_ID="$DEPLOY_RUN_ID" \
          DEPLOYMENT_CUTOVER_EXPECTED_REPOSITORY="$GITHUB_REPOSITORY" \
            node scripts/check-deployment-cutover-evidence.mjs

      - name: Bind selected deployment run to current main
        shell: bash
        run: |
          set -euo pipefail
          cutover_file="artifacts/cutover/deployment-cutover.json"
          echo "CUTOVER_SOURCE_SHA=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).sourceSha' "$cutover_file")" >> "$GITHUB_ENV"
          echo "CUTOVER_RELEASE_IMAGE_TAG=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).releaseImageTag' "$cutover_file")" >> "$GITHUB_ENV"
          echo "CUTOVER_AT=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).cutoverAt' "$cutover_file")" >> "$GITHUB_ENV"
          echo "CUTOVER_REPOSITORY=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).repository' "$cutover_file")" >> "$GITHUB_ENV"
          node --input-type=module - "$RUNNER_TEMP/staging-deploy-run.json" "$cutover_file" <<'NODE'
          import { readFileSync } from "node:fs";
          const [runFile, cutoverFile] = process.argv.slice(2);
          const run = JSON.parse(readFileSync(runFile, "utf8"));
          const cutover = JSON.parse(readFileSync(cutoverFile, "utf8"));
          if (run?.head_sha?.toLowerCase() !== cutover?.sourceSha?.toLowerCase()) process.exit(1);
          NODE
          cutover_sha="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).sourceSha' "$cutover_file")"
          git merge-base --is-ancestor "$cutover_sha" "$GITHUB_SHA"
          changed_files="$RUNNER_TEMP/staging-role-uat-changed-files.txt"
          git diff --name-only "$cutover_sha" "$GITHUB_SHA" > "$changed_files"
          if grep -Eq '^(apps/|packages/|docker/|infra/|scripts/|docs/evidence-manifests/|Dockerfile$|docker-compose[^/]*\.yml$|\.dockerignore$|\.github/workflows/staging-deploy\.yml$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|turbo\.json$|\.node-version$|tokens\.css$)' "$changed_files"; then
            echo "runtime-affecting files changed since selected deployment cutover" >&2
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: staging-github-ci-evidence-${{ env.CUTOVER_SOURCE_SHA }}
          run-id: ${{ inputs.deploy_run_id }}
          github-token: ${{ github.token }}
          path: artifacts/staging/reports

      - name: Validate exact GitHub CI evidence
        shell: bash
        run: |
          GITHUB_CI_EVIDENCE_TARGET="file://$PWD/artifacts/staging/reports/github-ci.json" pnpm github-ci:check
          node --input-type=module - artifacts/staging/reports/github-ci.json "$CUTOVER_SOURCE_SHA" <<'NODE'
          import { readFileSync } from "node:fs";
          const [file, expectedSha] = process.argv.slice(2);
          const report = JSON.parse(readFileSync(file, "utf8"));
          if (report?.commitSha?.toLowerCase() !== expectedSha.toLowerCase()) process.exit(1);
          NODE
          echo "GITHUB_CI_RUN_URL=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).workflow.runUrl' artifacts/staging/reports/github-ci.json)" >> "$GITHUB_ENV"

      - name: Validate full staging evidence environment
        shell: bash
        env:
          STAGING_EVIDENCE_ENV_B64: ${{ secrets.STAGING_EVIDENCE_ENV_B64 }}
        run: |
          set -euo pipefail
          trap 'rm -f -- .staging-evidence.env' EXIT
          printf '%s' "$STAGING_EVIDENCE_ENV_B64" | base64 -d > .staging-evidence.env
          chmod 600 .staging-evidence.env
          sed -i 's/^ADMIN_MFA_MODE=.*/ADMIN_MFA_MODE=required/' .staging-evidence.env
          grep -Fxq 'ADMIN_MFA_MODE=required' .staging-evidence.env
          pnpm staging:evidence-env:check -- --mode full --env-file .staging-evidence.env

      - name: Configure staging SSH
        shell: bash
        env:
          STAGING_DEPLOY_DIR: ${{ vars.STAGING_DEPLOY_DIR }}
          STAGING_EDGE_MODE: ${{ vars.STAGING_EDGE_MODE }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [ "$STAGING_DEPLOY_DIR" = "/root/o-okul" ]
          case "${STAGING_EDGE_MODE:-domain}" in
            domain|ip) echo "STAGING_EDGE_MODE=${STAGING_EDGE_MODE:-domain}" >> "$GITHUB_ENV" ;;
            *) exit 1 ;;
          esac
          echo "STAGING_SSH_KEY_PATH=$RUNNER_TEMP/staging_role_uat_key" >> "$GITHUB_ENV"
          echo "STAGING_KNOWN_HOSTS_PATH=$RUNNER_TEMP/staging_role_uat_known_hosts" >> "$GITHUB_ENV"
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/staging_role_uat_key"
          chmod 600 "$RUNNER_TEMP/staging_role_uat_key"
          : > "$RUNNER_TEMP/staging_role_uat_known_hosts"
          chmod 600 "$RUNNER_TEMP/staging_role_uat_known_hosts"

      - name: Preflight exact images and release-scoped UAT inputs
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          set -euo pipefail
          rollback_tag="$(
            ssh -i "$STAGING_SSH_KEY_PATH" -o UserKnownHostsFile="$STAGING_KNOWN_HOSTS_PATH" -o StrictHostKeyChecking=accept-new "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
              "STAGING_EDGE_MODE='$STAGING_EDGE_MODE' RELEASE_IMAGE_TAG='$CUTOVER_RELEASE_IMAGE_TAG' REPOSITORY='$CUTOVER_REPOSITORY' bash -se" <<'REMOTE'
          set -euo pipefail
          cd /root/o-okul
          case "$STAGING_EDGE_MODE" in
            domain) edge_file="docker-compose.traefik.yml" ;;
            ip) edge_file="docker-compose.traefik-ip.yml" ;;
            *) exit 1 ;;
          esac
          expected_prefix="ghcr.io/$REPOSITORY"
          for service in web api worker queue-board; do
            id="$(docker compose --env-file .env --env-file .env.release -f docker-compose.yml -f docker-compose.release.yml -f "$edge_file" ps -q "$service")"
            [ -n "$id" ]
            image="$(docker inspect -f '{{.Config.Image}}' "$id")"
            state="$(docker inspect -f '{{.State.Status}}' "$id")"
            health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$id")"
            [ "$image" = "$expected_prefix/$service:$RELEASE_IMAGE_TAG" ]
            [ "$state" = running ]
            [ -z "$health" ] || [ "$health" = healthy ]
          done
          grep -Fxq 'ADMIN_MFA_MODE=required' .env
          private_root=/root/o-okul-private/uat
          [ -d "$private_root" ] && [ ! -L "$private_root" ]
          [ "$(stat -c %a "$private_root")" = 700 ]
          [ "$(stat -c %u "$private_root")" = "$(id -u)" ]
          input_root="$private_root/$RELEASE_IMAGE_TAG"
          [ -d "$input_root" ] && [ ! -L "$input_root" ]
          [ "$(stat -c %a "$input_root")" = 700 ]
          [ "$(stat -c %u "$input_root")" = "$(id -u)" ]
          for name in metadata.json commands.json scenarios.json; do
            file="$input_root/$name"
            [ -f "$file" ] && [ ! -L "$file" ]
            [ "$(stat -c %a "$file")" = 600 ]
            [ "$(stat -c %u "$file")" = "$(id -u)" ]
          done
          rollback_tag="$(sed -n 's/^ROLLBACK_IMAGE_TAG=//p' .env.release)"
          [[ "$rollback_tag" =~ ^[a-f0-9]{40}$ ]]
          [ "$rollback_tag" != "$RELEASE_IMAGE_TAG" ]
          printf '%s' "$rollback_tag"
          REMOTE
          )"
          [[ "$rollback_tag" =~ ^[a-f0-9]{40}$ ]]
          echo "ROLLBACK_IMAGE_TAG=$rollback_tag" >> "$GITHUB_ENV"
          install -d -m 700 artifacts/uat-inputs
          input_root="/root/o-okul-private/uat/$CUTOVER_RELEASE_IMAGE_TAG"
          for name in metadata.json commands.json scenarios.json; do
            scp -q -i "$STAGING_SSH_KEY_PATH" -o UserKnownHostsFile="$STAGING_KNOWN_HOSTS_PATH" -o StrictHostKeyChecking=accept-new \
              "$STAGING_SSH_USER@$STAGING_SSH_HOST:$input_root/$name" "artifacts/uat-inputs/$name"
            chmod 600 "artifacts/uat-inputs/$name"
          done

      - name: Validate and bind exact-SHA UAT inputs
        shell: bash
        env:
          STAGING_ROLE_UAT_SOURCE_SHA: ${{ env.CUTOVER_SOURCE_SHA }}
          STAGING_ROLE_UAT_CUTOVER_AT: ${{ env.CUTOVER_AT }}
          STAGING_ROLE_UAT_GITHUB_CI_RUN_URL: ${{ env.GITHUB_CI_RUN_URL }}
          STAGING_ROLE_UAT_VERIFIER_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STAGING_ROLE_UAT_METADATA_TARGET: file://${{ github.workspace }}/artifacts/uat-inputs/metadata.json
          STAGING_ROLE_UAT_COMMANDS_TARGET: file://${{ github.workspace }}/artifacts/uat-inputs/commands.json
          STAGING_ROLE_UAT_SCENARIOS_TARGET: file://${{ github.workspace }}/artifacts/uat-inputs/scenarios.json
          STAGING_ROLE_UAT_BOUND_COMMANDS_OUTPUT: ${{ github.workspace }}/artifacts/uat-inputs/bound-commands.json
        run: node scripts/check-staging-role-uat-inputs.mjs

      - name: Generate and validate exact-SHA UAT evidence
        shell: bash
        run: |
          set -euo pipefail
          metadata="artifacts/uat-inputs/metadata.json"
          tester="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).tester' "$metadata")"
          restore_reference="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).restoreBackupReference' "$metadata")"
          STAGING_ENVIRONMENT=staging \
          UAT_OUTPUT=artifacts/staging/reports/uat.json \
          UAT_TESTER="$tester" \
          UAT_RELEASE_CANDIDATE="ghcr.io/$CUTOVER_REPOSITORY/api:$CUTOVER_RELEASE_IMAGE_TAG" \
          UAT_ROLLBACK_IMAGE_TAG="ghcr.io/$CUTOVER_REPOSITORY/api:$ROLLBACK_IMAGE_TAG" \
          UAT_RESTORE_BACKUP_REFERENCE="$restore_reference" \
          UAT_COMMAND_EVIDENCE_TARGET="file://$PWD/artifacts/uat-inputs/bound-commands.json" \
          UAT_SCENARIOS_TARGET="file://$PWD/artifacts/uat-inputs/scenarios.json" \
            pnpm uat:generate
          UAT_EVIDENCE_TARGET="file://$PWD/artifacts/staging/reports/uat.json" pnpm uat:check

      - name: Recheck exact images before publishing UAT
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i "$STAGING_SSH_KEY_PATH" -o UserKnownHostsFile="$STAGING_KNOWN_HOSTS_PATH" -o StrictHostKeyChecking=accept-new "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "STAGING_EDGE_MODE='$STAGING_EDGE_MODE' RELEASE_IMAGE_TAG='$CUTOVER_RELEASE_IMAGE_TAG' REPOSITORY='$CUTOVER_REPOSITORY' bash -se" <<'REMOTE'
          set -euo pipefail
          cd /root/o-okul
          case "$STAGING_EDGE_MODE" in
            domain) edge_file="docker-compose.traefik.yml" ;;
            ip) edge_file="docker-compose.traefik-ip.yml" ;;
            *) exit 1 ;;
          esac
          for service in web api worker queue-board; do
            id="$(docker compose --env-file .env --env-file .env.release -f docker-compose.yml -f docker-compose.release.yml -f "$edge_file" ps -q "$service")"
            [ -n "$id" ]
            [ "$(docker inspect -f '{{.Config.Image}}' "$id")" = "ghcr.io/$REPOSITORY/$service:$RELEASE_IMAGE_TAG" ]
            [ "$(docker inspect -f '{{.State.Status}}' "$id")" = running ]
            health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$id")"
            [ -z "$health" ] || [ "$health" = healthy ]
          done
          REMOTE

      - uses: actions/upload-artifact@v4
        with:
          name: staging-role-uat-${{ inputs.deploy_run_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/staging/reports/uat.json
          if-no-files-found: error

      - name: Publish exact-SHA UAT evidence
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          set -euo pipefail
          remote_temp="/root/o-okul/artifacts/staging/reports/.uat-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          scp -q -i "$STAGING_SSH_KEY_PATH" -o UserKnownHostsFile="$STAGING_KNOWN_HOSTS_PATH" -o StrictHostKeyChecking=accept-new \
            artifacts/staging/reports/uat.json "$STAGING_SSH_USER@$STAGING_SSH_HOST:$remote_temp"
          ssh -i "$STAGING_SSH_KEY_PATH" -o UserKnownHostsFile="$STAGING_KNOWN_HOSTS_PATH" -o StrictHostKeyChecking=accept-new "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "RUN_ID='$GITHUB_RUN_ID' RUN_ATTEMPT='$GITHUB_RUN_ATTEMPT' RELEASE_IMAGE_TAG='$CUTOVER_RELEASE_IMAGE_TAG' REPOSITORY='$CUTOVER_REPOSITORY' bash -se" <<'REMOTE'
          set -euo pipefail
          reports=/root/o-okul/artifacts/staging/reports
          [ -d "$reports" ] && [ ! -L "$reports" ]
          target="$reports/uat.json"
          incoming="$reports/.uat-$RUN_ID-$RUN_ATTEMPT.json"
          [ -f "$incoming" ] && [ ! -L "$incoming" ]
          node --input-type=module - "$incoming" "ghcr.io/$REPOSITORY/api:$RELEASE_IMAGE_TAG" <<'NODE'
          import { readFileSync } from "node:fs";
          const [file, expectedRelease] = process.argv.slice(2);
          const report = JSON.parse(readFileSync(file, "utf8"));
          if (report?.result !== "PASS" || report?.environment !== "staging" || report?.releaseCandidate !== expectedRelease) process.exit(1);
          NODE
          if [ -e "$target" ]; then
            [ -f "$target" ] && [ ! -L "$target" ]
            archive=/root/o-okul-private/uat/archive
            install -d -m 700 "$archive"
            cp -p -- "$target" "$archive/uat-$RUN_ID-$RUN_ATTEMPT-previous.json"
            chmod 600 "$archive/uat-$RUN_ID-$RUN_ATTEMPT-previous.json"
          fi
          chmod 644 "$incoming"
          mv -- "$incoming" "$target"
          REMOTE

      - name: Clean private runner inputs
        if: ${{ always() }}
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          set -euo pipefail
          if [ -s "${STAGING_SSH_KEY_PATH:-}" ] && [ -n "${STAGING_SSH_HOST:-}" ] && [ -n "${STAGING_SSH_USER:-}" ]; then
            ssh -i "$STAGING_SSH_KEY_PATH" -o UserKnownHostsFile="$STAGING_KNOWN_HOSTS_PATH" -o StrictHostKeyChecking=accept-new \
              "$STAGING_SSH_USER@$STAGING_SSH_HOST" "rm -f -- '/root/o-okul/artifacts/staging/reports/.uat-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json'" || true
          fi
          rm -f -- .staging-evidence.env artifacts/uat-inputs/metadata.json artifacts/uat-inputs/commands.json \
            artifacts/uat-inputs/scenarios.json artifacts/uat-inputs/bound-commands.json \
            "$RUNNER_TEMP/staging-deploy-run.json" "${STAGING_SSH_KEY_PATH:-}" "${STAGING_KNOWN_HOSTS_PATH:-}"
