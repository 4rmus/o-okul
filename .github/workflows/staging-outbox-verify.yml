            ["pnpm traefik:https:smoke", "STAGING", artifact("artifacts/staging/smoke/traefik-https.json")],
          ].map(([command, evidenceClass, evidence]) => ({ command, status: "PASS", evidence, evidenceClass, sourceSha }));
          const scenarios = [
            ["UAT-SYS-01", "SYSTEM_ADMIN", "CI_AND_STAGING", ["pnpm --filter @o-okul/web test:e2e", "pnpm observability:uat:check"], [artifact("artifacts/staging/reports/github-ci.json"), ciRun, artifact("artifacts/staging/reports/observability-uat.json"), artifact("artifacts/staging/ui-ux-redesign/uat.json"), verifierRun]],
            ["UAT-SYS-02", "SYSTEM_ADMIN", "STAGING", ["pnpm live:onboarding:smoke"], [artifact("artifacts/staging/reports/live-onboarding.json"), verifierRun]],
            ["UAT-SYS-03", "SYSTEM_ADMIN", "CI", ["pnpm --filter @o-okul/api exec vitest run src/tenant/tenant.controller.e2e.test.ts"], [artifact("artifacts/staging/reports/github-ci.json"), ciRun]],
            ["UAT-SYS-04", "SYSTEM_ADMIN", "STAGING_WITH_HISTORICAL_DRILL", ["pnpm deployment:rollback:check", "pnpm deployment:cutover:check"], [artifact("artifacts/staging/reports/deployment-rollback.json"), artifact("artifacts/staging/reports/deployment-cutover.json"), verifierRun]],
            ["UAT-KURUM-01", "TENANT_ADMIN", "STAGING", ["pnpm live:onboarding:smoke"], [artifact("artifacts/staging/reports/live-onboarding.json"), verifierRun]],
            ["UAT-KURUM-02", "TENANT_ADMIN", "CI", ["pnpm --filter @o-okul/api exec vitest run src/school/school.e2e.test.ts src/student/student-profile.e2e.test.ts"], [artifact("artifacts/staging/reports/github-ci.json"), ciRun]],
            ["UAT-KURUM-03", "TENANT_ADMIN", "CI_AND_STAGING", ["pnpm --filter @o-okul/api exec vitest run src/user-management/user-management.e2e.test.ts src/identity-invitation/identity-invitation.e2e.test.ts", "pnpm live:onboarding:smoke"], [artifact("artifacts/staging/reports/github-ci.json"), ciRun, artifact("artifacts/staging/reports/live-onboarding.json"), verifierRun]],
            ["UAT-KURUM-04", "TENANT_ADMIN", "CI", ["pnpm --filter @o-okul/api exec vitest run src/program src/attendance"], [artifact("artifacts/staging/reports/github-ci.json"), ciRun]],
            ["UAT-KURUM-05", "TENANT_ADMIN", "STAGING", ["pnpm isem-optical-pipeline:evidence-check", "pnpm live:exam-cycle:check", "pnpm live:ui-worker:smoke"], [artifact("artifacts/staging/reports/isem-optical-pipeline.json"), artifact("artifacts/staging/reports/live-exam-cycle.json"), artifact("artifacts/staging/reports/live-ui-worker-result.json"), verifierRun]],
            ["UAT-KURUM-06", "TENANT_ADMIN", "STAGING", ["pnpm report-generation:smoke", "pnpm live:exam-cycle:check", "pnpm live:ui-worker:smoke"], [artifact("artifacts/staging/smoke/report-generation.json"), artifact("artifacts/staging/reports/live-exam-cycle.json"), artifact("artifacts/staging/reports/live-ui-worker-result.json"), verifierRun]],
            ["UAT-KURUM-07", "TENANT_ADMIN", "CI", ["pnpm run ci"], [artifact("artifacts/staging/reports/github-ci.json"), ciRun]],
            ["UAT-KURUM-08", "TENANT_ADMIN", "CI_AND_STAGING", ["pnpm run ci", "pnpm sms:smoke", "pnpm notification:smoke"], [artifact("artifacts/staging/reports/github-ci.json"), ciRun, artifact("artifacts/staging/smoke/sms-provider.json"), artifact("artifacts/staging/smoke/notification-provider.json"), verifierRun]],
            ["UAT-TEACHER-01", "TEACHER", "CI", ["pnpm --filter @o-okul/api exec vitest run src/me/me-access-matrix.e2e.test.ts src/report/report-generation.service.test.ts"], [artifact("artifacts/staging/reports/github-ci.json"), ciRun]],
            ["UAT-TEACHER-02", "TEACHER", "CI", ["pnpm --filter @o-okul/api exec vitest run src/app.e2e.test.ts src/homework/homework.e2e.test.ts src/support-ticket/support-ticket.e2e.test.ts"], [artifact("artifacts/staging/reports/github-ci.json"), ciRun]],
            ["UAT-TEACHER-03", "TEACHER", "CI", ["pnpm --filter @o-okul/api exec vitest run src/tenant src/school/assert-teacher-assigned.test.ts"], [artifact("artifacts/staging/reports/github-ci.json"), ciRun]],
            ["UAT-STUDENT-01", "STUDENT", "CI", ["pnpm --filter @o-okul/api exec vitest run src/app.e2e.test.ts src/me/me-access-matrix.e2e.test.ts"], [artifact("artifacts/staging/reports/github-ci.json"), ciRun]],
            ["UAT-STUDENT-02", "STUDENT", "CI", ["pnpm --filter @o-okul/api exec vitest run src/app.e2e.test.ts src/support-ticket/support-ticket.e2e.test.ts"], [artifact("artifacts/staging/reports/github-ci.json"), ciRun]],
            ["UAT-STUDENT-03", "STUDENT", "CI", ["pnpm --filter @o-okul/api exec vitest run src/me/me-access-matrix.e2e.test.ts"], [artifact("artifacts/staging/reports/github-ci.json"), ciRun]],
            ["UAT-GUARDIAN-01", "GUARDIAN", "CI", ["pnpm --filter @o-okul/api exec vitest run src/app.e2e.test.ts src/payment/payment.e2e.test.ts"], [artifact("artifacts/staging/reports/github-ci.json"), ciRun]],
            ["UAT-GUARDIAN-02", "GUARDIAN", "CI", ["pnpm --filter @o-okul/api exec vitest run src/app.e2e.test.ts src/announcement/announcement.e2e.test.ts src/support-ticket/support-ticket.e2e.test.ts"], [artifact("artifacts/staging/reports/github-ci.json"), ciRun]],
            ["UAT-GUARDIAN-03", "GUARDIAN", "CI", ["pnpm --filter @o-okul/api exec vitest run src/app.e2e.test.ts src/payment/payment.e2e.test.ts"], [artifact("artifacts/staging/reports/github-ci.json"), ciRun]],
          ].map(([id, persona, evidenceClass, verificationCommands, evidence]) => ({
            id, persona, status: "PASS", evidenceClass, sourceSha, verificationCommands, evidence,
          }));
          mkdirSync("artifacts/uat-inputs", { recursive: true });
          writeFileSync("artifacts/uat-inputs/commands.json", `${JSON.stringify({ commands }, null, 2)}\n`);
          writeFileSync("artifacts/uat-inputs/scenarios.json", `${JSON.stringify({ journeyScenariosVerified: scenarios }, null, 2)}\n`);
          NODE
          restore_backup_reference="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).sourceBackup' artifacts/staging/reports/restore-drill.json)"
          UAT_OUTPUT=artifacts/staging/reports/uat.json \
          UAT_TESTER=release-owner-gate-e \
          UAT_RELEASE_CANDIDATE="ghcr.io/$CUTOVER_REPOSITORY/api:$CUTOVER_RELEASE_IMAGE_TAG" \
          UAT_ROLLBACK_IMAGE_TAG="ghcr.io/$CUTOVER_REPOSITORY/api:$rollback_image_tag" \
          UAT_RESTORE_BACKUP_REFERENCE="$restore_backup_reference" \
          UAT_SOURCE_SHA="$CUTOVER_SOURCE_SHA" \
          UAT_VERIFIER_RUN_URL="$verifier_run_url" \
          UAT_GITHUB_CI_RUN_URL="$github_ci_run_url" \
          UAT_COMMAND_EVIDENCE_TARGET="file://$PWD/artifacts/uat-inputs/commands.json" \
          UAT_SCENARIOS_TARGET="file://$PWD/artifacts/uat-inputs/scenarios.json" \
            pnpm uat:generate -- --environment staging
          [ "$(grep -Ec '^UAT_EVIDENCE_TARGET=' .staging-evidence.env)" -eq 1 ]
          sed -i "s#^UAT_EVIDENCE_TARGET=.*#UAT_EVIDENCE_TARGET=file://$PWD/artifacts/staging/reports/uat.json#" .staging-evidence.env
          grep -Fxq "UAT_EVIDENCE_TARGET=file://$PWD/artifacts/staging/reports/uat.json" .staging-evidence.env
          provider_reuse_args=()
          if [ -n "$REUSE_PROVIDER_SMOKE_RUN_ID" ]; then
            provider_reuse_args=(--reuse-sentry-smoke --reuse-alert-webhook-smoke)
          fi
          aggregate_reuse_args=()
          if [ -n "$REUSE_AGGREGATE_SMOKE_RUN_ID" ]; then
            aggregate_reuse_args=(--reuse-report-generation-smoke)
          fi
          PRODUCTION_EVIDENCE_ALLOW_STAGING=1 UI_UX_REDESIGN_VERIFY_REMOTE_REFERENCES=1 \
            pnpm prod:evidence:check -- --env-file .staging-evidence.env --summary-file "artifacts/staging/release-summary-$CUTOVER_RELEASE_IMAGE_TAG.json" \
              --reuse-notification-smoke --reuse-wal-smoke "${provider_reuse_args[@]}" "${aggregate_reuse_args[@]}"
          node --input-type=module - "artifacts/staging/release-summary-$CUTOVER_RELEASE_IMAGE_TAG.json" <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const path = process.argv[2];
          const summary = JSON.parse(readFileSync(path, "utf8"));
          if (summary.result !== "PASS" || summary.canPromote !== true) throw new Error("Production evidence aggregation PASS candidate üretmedi.");
          summary.canPromote = false;
          writeFileSync(path, `${JSON.stringify(summary, null, 2)}\n`, { mode: 0o600 });
          NODE
          STAGING_ENVIRONMENT=staging NODE_ENV=production pnpm staging:first-gates:smoke -- \
            --output-dir artifacts/staging/first-gates --reuse-smoke-dir artifacts/staging/smoke
          STAGING_FIRST_GATES_TARGET="$PWD/artifacts/staging/first-gates/first-gates-manifest.json" pnpm staging:first-gates:check

      - name: Bind verified UI/UX completion to full evidence
        if: ${{ inputs.full_evidence }}
        shell: bash
        env:
          GITHUB_CI_EVIDENCE_TARGET: file://${{ github.workspace }}/artifacts/staging/reports/github-ci.json
          GITHUB_TOKEN: ${{ github.token }}
          UI_UX_REDESIGN_EVIDENCE_TARGET: file://${{ github.workspace }}/artifacts/staging/reports/ui-ux-redesign.json
          UI_UX_PROFESSIONALIZATION_SOURCE_SHA: ${{ env.CUTOVER_SOURCE_SHA }}
          UI_UX_PROFESSIONALIZATION_FULL_EVIDENCE: "1"
          UI_UX_REDESIGN_VERIFY_REMOTE_REFERENCES: "1"
        run: pnpm ui-ux-professionalization:completion:check

      - name: Recheck exact images before publishing verification
        if: ${{ inputs.full_evidence }}
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          set -euo pipefail
          runtime_parity_remote=/root/o-okul/artifacts/staging/private/runtime-parity.json
          ssh -i "$STAGING_SSH_KEY_PATH" -o UserKnownHostsFile="$STAGING_KNOWN_HOSTS_PATH" -o StrictHostKeyChecking=accept-new "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "STAGING_EDGE_MODE='$STAGING_EDGE_MODE' RELEASE_IMAGE_TAG='$CUTOVER_RELEASE_IMAGE_TAG' REPOSITORY='$CUTOVER_REPOSITORY' GITHUB_RUN_ID='$GITHUB_RUN_ID' RUNTIME_PARITY_OUTPUT='$runtime_parity_remote' bash -se" <<'REMOTE'
          set -euo pipefail
          cd /root/o-okul
          case "$STAGING_EDGE_MODE" in
            domain) EDGE_COMPOSE_FILE="docker-compose.traefik.yml" ;;
            ip) EDGE_COMPOSE_FILE="docker-compose.traefik-ip.yml" ;;
            *) exit 1 ;;
          esac
          expected_prefix="ghcr.io/$REPOSITORY"
          require_running_image() {
            local service="$1" expected="$2" id image state health
            id="$(docker compose --env-file .env --env-file .env.release -f docker-compose.yml -f docker-compose.release.yml -f "$EDGE_COMPOSE_FILE" ps -q "$service")"
            [ -n "$id" ]
            image="$(docker inspect -f '{{.Config.Image}}' "$id")"
            state="$(docker inspect -f '{{.State.Status}}' "$id")"
            health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$id")"
            [ "$image" = "$expected" ] && [ "$state" = running ] && { [ -z "$health" ] || [ "$health" = healthy ]; }
            printf '%s|%s|%s|%s\n' "$service" "$image" "$state" "${health:-none}"
          }
          web_record="$(require_running_image web "$expected_prefix/web:$RELEASE_IMAGE_TAG")"
          api_record="$(require_running_image api "$expected_prefix/api:$RELEASE_IMAGE_TAG")"
          worker_record="$(require_running_image worker "$expected_prefix/worker:$RELEASE_IMAGE_TAG")"
          queue_board_record="$(require_running_image queue-board "$expected_prefix/queue-board:$RELEASE_IMAGE_TAG")"
          health_records=()
          for path in /health /health/ready; do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 10 "https://o-okul.com$path")"
            [ "$status" = 200 ]
            health_records+=("https://o-okul.com$path|$status")
          done
          install -d -m 700 "$(dirname "$RUNTIME_PARITY_OUTPUT")"
          node --input-type=module - "$RUNTIME_PARITY_OUTPUT" "$REPOSITORY" "$RELEASE_IMAGE_TAG" "$GITHUB_RUN_ID" \
            "$web_record" "$api_record" "$worker_record" "$queue_board_record" "${health_records[0]}" "${health_records[1]}" <<'NODE'
          import { writeFileSync } from "node:fs";
          const [output, repository, sourceSha, runId, ...records] = process.argv.slice(2);
          const services = records.slice(0, 4).map((record) => {
            const [service, image, state, health] = record.split("|");
            return { service, image, state, health };
          });
          const publicHealth = records.slice(4).map((record) => {
            const [url, statusCode] = record.split("|");
            return { url, statusCode: Number(statusCode) };
          });
          const report = {
            result: "PASS",
            environment: "staging",
            checkedAt: new Date().toISOString(),
            repository,
            sourceSha,
            releaseImageTag: sourceSha,
            verifierRunUrl: `https://github.com/${repository}/actions/runs/${runId}`,
            services,
            publicHealth,
          };
          writeFileSync(output, `${JSON.stringify(report, null, 2)}\n`, { mode: 0o600 });
          NODE
          REMOTE
          scp -i "$STAGING_SSH_KEY_PATH" -o UserKnownHostsFile="$STAGING_KNOWN_HOSTS_PATH" -o StrictHostKeyChecking=accept-new \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST:$runtime_parity_remote" artifacts/staging/reports/runtime-parity.json
          RUNTIME_PARITY_EVIDENCE_TARGET="file://$PWD/artifacts/staging/reports/runtime-parity.json" \
          RUNTIME_PARITY_EXPECTED_SOURCE_SHA="$CUTOVER_SOURCE_SHA" \
          RUNTIME_PARITY_EXPECTED_REPOSITORY="$CUTOVER_REPOSITORY" \
          RUNTIME_PARITY_EXPECTED_VERIFIER_RUN_URL="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            pnpm runtime-parity:check

      - name: Finalize verified release summary
        if: ${{ inputs.full_evidence }}
        shell: bash
        run: |
          set -euo pipefail
          summary="artifacts/staging/release-summary-$CUTOVER_RELEASE_IMAGE_TAG.json"
          node --input-type=module - "$summary" "$CUTOVER_SOURCE_SHA" "$CUTOVER_REPOSITORY" "$CUTOVER_RELEASE_IMAGE_TAG" "$CUTOVER_AT" <<'NODE'
          import { readFileSync, renameSync, writeFileSync } from "node:fs";
          const [path, sourceSha, repository, releaseImageTag, cutoverAt] = process.argv.slice(2);
          const summary = JSON.parse(readFileSync(path, "utf8"));
          const runtimeParity = JSON.parse(readFileSync("artifacts/staging/reports/runtime-parity.json", "utf8"));
          const githubCi = summary.reports?.githubCi;
          const uiUx = summary.reports?.uiUxRedesign;
          const observability = summary.reports?.observabilityUat;
          const outbox = summary.smokeEvidence?.secretDeliveryOutbox;
          if (
            summary.result !== "PASS" || summary.canPromote !== false ||
            githubCi?.repository !== repository || githubCi?.commitSha !== sourceSha ||
            uiUx?.sourceCommitSha !== sourceSha || observability?.alertDelivery?.releaseCandidate !== sourceSha ||
            outbox?.releaseImageTag !== releaseImageTag || outbox?.notBefore !== cutoverAt ||
            runtimeParity?.result !== "PASS" || runtimeParity?.sourceSha !== sourceSha ||
            runtimeParity?.repository !== repository || runtimeParity?.releaseImageTag !== releaseImageTag ||
            runtimeParity?.services?.length !== 4 || runtimeParity?.publicHealth?.length !== 2
          ) {
            throw new Error("Release summary exact-SHA candidate bağı geçersiz.");
          }
          summary.generatedAt = new Date().toISOString();
          summary.canPromote = true;
          const temporaryPath = `${path}.tmp-${process.pid}`;
          writeFileSync(temporaryPath, `${JSON.stringify(summary, null, 2)}\n`, { mode: 0o600 });
          renameSync(temporaryPath, path);
          NODE
          PRODUCTION_EVIDENCE_ALLOW_STAGING=1 \
          PRODUCTION_EVIDENCE_SUMMARY_TARGET="file://$PWD/$summary" \
            pnpm prod:evidence:summary:check

      - name: Generate exact release evidence manifest
        if: ${{ inputs.full_evidence }}
        shell: bash
        env:
          DEPLOY_RUN_ID: ${{ inputs.deploy_run_id || vars.STAGING_OUTBOX_DEPLOY_RUN_ID }}
        run: |
          set -euo pipefail
          RELEASE_EVIDENCE_ARTIFACTS_DIR="$PWD/artifacts/staging" \
          RELEASE_EVIDENCE_MANIFEST_OUTPUT="$PWD/artifacts/staging/release-evidence-manifest.json" \
          RELEASE_EVIDENCE_REPOSITORY="$CUTOVER_REPOSITORY" \
          RELEASE_EVIDENCE_SOURCE_SHA="$CUTOVER_SOURCE_SHA" \
          RELEASE_EVIDENCE_IMAGE_TAG="$CUTOVER_RELEASE_IMAGE_TAG" \
          RELEASE_EVIDENCE_DEPLOY_RUN_ID="$DEPLOY_RUN_ID" \
          RELEASE_EVIDENCE_VERIFIER_RUN_ID="$GITHUB_RUN_ID" \
          RELEASE_EVIDENCE_OUTBOX_REUSE_RUN_ID="$REUSE_OUTBOX_SMOKE_RUN_ID" \
          RELEASE_EVIDENCE_PROVIDER_REUSE_RUN_ID="$REUSE_PROVIDER_SMOKE_RUN_ID" \
          RELEASE_EVIDENCE_AGGREGATE_REUSE_RUN_ID="$REUSE_AGGREGATE_SMOKE_RUN_ID" \
          RELEASE_EVIDENCE_CUTOVER_AT="$CUTOVER_AT" \
            node scripts/generate-release-evidence-manifest.mjs
          RELEASE_EVIDENCE_ARTIFACTS_DIR="$PWD/artifacts/staging" \
          RELEASE_EVIDENCE_MANIFEST_TARGET="$PWD/artifacts/staging/release-evidence-manifest.json" \
            node scripts/check-release-evidence-manifest.mjs

      - name: Check verified staging release artifact bundle
        if: ${{ inputs.full_evidence }}
        shell: bash
        run: STAGING_RELEASE_ARTIFACTS_TARGET="$PWD/artifacts/staging" pnpm staging:release-artifacts:check

      - name: Invalidate unverified release summary
        if: ${{ failure() && inputs.full_evidence }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          summaries=(artifacts/staging/release-summary-*.json)
          for summary in "${summaries[@]}"; do
            node --input-type=module - "$summary" <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const path = process.argv[2];
          const summary = JSON.parse(readFileSync(path, "utf8"));
          summary.result = "FAIL";
          summary.canPromote = false;
          writeFileSync(path, `${JSON.stringify(summary, null, 2)}\n`, { mode: 0o600 });
          NODE
          done

      - name: Remove private Gate E verifier material
        if: ${{ always() && inputs.full_evidence }}
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          set -euo pipefail
          [ -s "${STAGING_SSH_KEY_PATH:-}" ] || exit 0
          [[ "${CUTOVER_RELEASE_IMAGE_TAG:-}" =~ ^[a-f0-9]{40}$ ]] || exit 0
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          ssh -i "$STAGING_SSH_KEY_PATH" -o UserKnownHostsFile="$STAGING_KNOWN_HOSTS_PATH" -o StrictHostKeyChecking=accept-new "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "RELEASE_IMAGE_TAG='$CUTOVER_RELEASE_IMAGE_TAG' GITHUB_RUN_ID='$GITHUB_RUN_ID' bash -se" <<'REMOTE'
          set -euo pipefail
          cd /root/o-okul
          data_dir="/root/o-okul-private/gate-e-data-safety/$RELEASE_IMAGE_TAG/$GITHUB_RUN_ID"
          obs_dir="/root/o-okul-private/gate-e-observability/$RELEASE_IMAGE_TAG/$GITHUB_RUN_ID"
          rm -f -- \
            "$data_dir/generate-restore-drill-evidence.mjs" \
            "$data_dir/hash-audit.json" \
            "$data_dir/sha-repair-dry-run.json" \
            "$data_dir/sha-repair-approved.json" \
            "$data_dir/hash-audit-after-repair.json" \
            "$data_dir/dry-run.json" \
            "$data_dir/migrated.json" \
            "$data_dir/orphan-audit-after-migration.json" \
            "$obs_dir/run-observability-alert-drill.mjs" \
            artifacts/staging/private/alertmanager-firing-resolved-delivery.json \
            artifacts/staging/private/runtime-parity.json
          rmdir -- "$data_dir" 2>/dev/null || true
          rmdir -- "$obs_dir" 2>/dev/null || true
          compose=(docker compose --env-file .env --env-file .env.release -f docker-compose.yml -f docker-compose.release.yml -f docker-compose.traefik.yml -f docker-compose.observability.yml)
          prometheus_id="$("${compose[@]}" ps -q prometheus)"
          [ -n "$prometheus_id" ]
          docker exec -u 0 "$prometheus_id" sh -lc "awk '!index(\$0, \"gate-e-observability-$GITHUB_RUN_ID\")' /etc/hosts > /tmp/gate-e-observability-$GITHUB_RUN_ID.hosts && cat /tmp/gate-e-observability-$GITHUB_RUN_ID.hosts > /etc/hosts && rm -f /tmp/gate-e-observability-$GITHUB_RUN_ID.hosts && ! grep -F 'gate-e-observability-$GITHUB_RUN_ID' /etc/hosts"
          REMOTE

      - name: Remove private outbox verification material
        if: ${{ always() }}
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          set -euo pipefail
          [ -z "${REUSE_OUTBOX_SMOKE_RUN_ID:-}" ] || exit 0
          [[ "${CUTOVER_RELEASE_IMAGE_TAG:-}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || exit 0
          [ -s "${STAGING_SSH_KEY_PATH:-}" ] || exit 0
          [ -n "${OUTBOX_SOURCE_CLAIM_DIR:-}" ] || exit 0
          expected_claim_dir="/root/o-okul-private/secret-delivery-outbox/.claims/$CUTOVER_RELEASE_IMAGE_TAG/$GITHUB_RUN_ID"
          [ "$OUTBOX_SOURCE_CLAIM_DIR" = "$expected_claim_dir" ]
          ssh -i "$STAGING_SSH_KEY_PATH" -o UserKnownHostsFile="$STAGING_KNOWN_HOSTS_PATH" -o StrictHostKeyChecking=accept-new "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "SOURCE_CLAIM_DIR='$OUTBOX_SOURCE_CLAIM_DIR' HELPERS_DIR='${OUTBOX_VERIFY_HELPERS_DIR:-}' bash -se" <<'REMOTE'
          set -euo pipefail
          rm -f -- "$SOURCE_CLAIM_DIR/source-id"
          rmdir -- "$SOURCE_CLAIM_DIR" 2>/dev/null || true
          rmdir -- "$(dirname "$SOURCE_CLAIM_DIR")" 2>/dev/null || true
          rmdir -- "$(dirname "$(dirname "$SOURCE_CLAIM_DIR")")" 2>/dev/null || true
          if [ -n "$HELPERS_DIR" ]; then
            rm -f -- "$HELPERS_DIR/smoke-secret-delivery-outbox-staging.mjs" "$HELPERS_DIR/smoke-evidence.mjs" \
              "$HELPERS_DIR/isem-optical-pipeline-contract.mjs" "$HELPERS_DIR/isem-optical-pipeline-inputs.json"
            rmdir -- "$HELPERS_DIR" 2>/dev/null || true
            rmdir -- "$(dirname "$HELPERS_DIR")" 2>/dev/null || true
          fi
          REMOTE

      - uses: actions/upload-artifact@v4
        if: ${{ success() && inputs.full_evidence }}
        with:
          name: staging-outbox-verify-${{ inputs.deploy_run_id || vars.STAGING_OUTBOX_DEPLOY_RUN_ID }}-${{ github.run_id }}
          path: |
            artifacts/staging
            !artifacts/staging/private/**
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: ${{ failure() && inputs.full_evidence }}
        with:
          name: staging-outbox-verify-${{ inputs.deploy_run_id || vars.STAGING_OUTBOX_DEPLOY_RUN_ID }}-${{ github.run_id }}-diagnostic
          path: |
            artifacts/staging
            !artifacts/staging/private/**
            !artifacts/staging/release-summary-*.json
            !artifacts/staging/release-evidence-manifest.json
          if-no-files-found: error

      - name: Clean local verification secrets
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            .staging-evidence.env
            artifacts/secret-delivery-outbox.json
            artifacts/uat-inputs/alertmanager-firing-resolved-delivery.json
            artifacts/uat-inputs/commands.json
            artifacts/uat-inputs/rate-limit-smoke.json
            artifacts/uat-inputs/scenarios.json
            "$RUNNER_TEMP/staging-deploy-run.json"
          )
          [ -n "${STAGING_SSH_KEY_PATH:-}" ] && paths+=("$STAGING_SSH_KEY_PATH")
          [ -n "${STAGING_KNOWN_HOSTS_PATH:-}" ] && paths+=("$STAGING_KNOWN_HOSTS_PATH")
          rm -f -- "${paths[@]}"
          rmdir artifacts/uat-inputs 2>/dev/null || true
