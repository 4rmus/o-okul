name: Staging Outbox Verify

on:
  workflow_dispatch:
    inputs:
      deploy_run_id:
        description: "Staging Deploy run ID whose cutover artifact will be verified."
        required: true
        type: string
      full_evidence:
        description: "Also run the separate full production evidence aggregation."
        required: false
        default: false
        type: boolean
      reuse_outbox_smoke_run_id:
        description: "Optional prior verifier run ID whose exact cutover-bound sanitized outbox smoke artifact will be reused."
        required: false
        type: string
      reuse_provider_smoke_run_id:
        description: "Optional prior verifier run ID whose exact cutover-bound Sentry and alert smoke artifacts will be reused."
        required: false
        type: string
      reuse_aggregate_smoke_run_id:
        description: "Optional prior verifier run ID whose exact cutover-bound aggregate smoke artifacts will be reused."
        required: false
        type: string
      run_identity_migration:
        description: "Run the approved, guarded identity-link migration only when the live audit reports missing links."
        required: false
        default: false
        type: boolean
      run_gate_e_mutating_smokes:
        description: "Run the separately approved iSEM/live-UI and temporary rate-limit shard smokes that mutate staging test state."
        required: false
        default: false
        type: boolean
      run_gate_e_live_uat_rls:
        description: "Run separately approved live onboarding/provider UAT and fresh RLS/load evidence with synthetic-state cleanup."
        required: false
        default: false
        type: boolean
      run_gate_e_data_safety_reconciliation:
        description: "Run separately approved restore drill and inline-upload hash repair/migration/orphan reconciliation with cleanup."
        required: false
        default: false
        type: boolean
      run_gate_e_observability_alert_drill:
        description: "Run the separately approved Prometheus scrape-isolation firing/resolved authenticated webhook drill."
        required: false
        default: false
        type: boolean
      ui_ux_approved_at:
        description: "Release-owner UI/UX approval time (ISO-8601); required for full evidence."
        required: false
        type: string
  pull_request:
    types: [labeled]

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'staging-outbox-verify'
    runs-on: ubuntu-latest
    environment: staging
    env:
      REUSE_OUTBOX_SMOKE_RUN_ID: ${{ inputs.reuse_outbox_smoke_run_id }}
      REUSE_PROVIDER_SMOKE_RUN_ID: ${{ inputs.reuse_provider_smoke_run_id }}
      REUSE_AGGREGATE_SMOKE_RUN_ID: ${{ inputs.reuse_aggregate_smoke_run_id }}
      RUN_IDENTITY_MIGRATION: ${{ inputs.run_identity_migration }}
      RUN_GATE_E_MUTATING_SMOKES: ${{ inputs.run_gate_e_mutating_smokes }}
      RUN_GATE_E_LIVE_UAT_RLS: ${{ inputs.run_gate_e_live_uat_rls }}
      RUN_GATE_E_DATA_SAFETY_RECONCILIATION: ${{ inputs.run_gate_e_data_safety_reconciliation }}
      RUN_GATE_E_OBSERVABILITY_ALERT_DRILL: ${{ inputs.run_gate_e_observability_alert_drill }}
      UI_UX_APPROVED_AT_INPUT: ${{ inputs.ui_ux_approved_at }}
    timeout-minutes: 45
    concurrency:
      group: staging-outbox-verify-${{ inputs.deploy_run_id || vars.STAGING_OUTBOX_DEPLOY_RUN_ID }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Validate deploy run input
        shell: bash
        env:
          DEPLOY_RUN_ID: ${{ inputs.deploy_run_id || vars.STAGING_OUTBOX_DEPLOY_RUN_ID }}
          FULL_EVIDENCE: ${{ inputs.full_evidence }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_RUN_ID" =~ ^[0-9]+$ ]]
          [ -z "$REUSE_OUTBOX_SMOKE_RUN_ID" ] || [[ "$REUSE_OUTBOX_SMOKE_RUN_ID" =~ ^[0-9]+$ ]]
          [ -z "$REUSE_PROVIDER_SMOKE_RUN_ID" ] || [[ "$REUSE_PROVIDER_SMOKE_RUN_ID" =~ ^[0-9]+$ ]]
          [ -z "$REUSE_AGGREGATE_SMOKE_RUN_ID" ] || [[ "$REUSE_AGGREGATE_SMOKE_RUN_ID" =~ ^[0-9]+$ ]]
          if [ "$RUN_IDENTITY_MIGRATION" = true ] && [ "$FULL_EVIDENCE" != true ]; then
            echo "run_identity_migration requires full_evidence=true." >&2
            exit 1
          fi
          if [ "$RUN_GATE_E_MUTATING_SMOKES" = true ] && [ "$FULL_EVIDENCE" != true ]; then
            echo "run_gate_e_mutating_smokes requires full_evidence=true." >&2
            exit 1
          fi
          if [ "$RUN_GATE_E_LIVE_UAT_RLS" = true ] && [ "$FULL_EVIDENCE" != true ]; then
            echo "run_gate_e_live_uat_rls requires full_evidence=true." >&2
            exit 1
          fi
          if [ "$RUN_GATE_E_DATA_SAFETY_RECONCILIATION" = true ] && [ "$FULL_EVIDENCE" != true ]; then
            echo "run_gate_e_data_safety_reconciliation requires full_evidence=true." >&2
            exit 1
          fi
          if [ "$RUN_GATE_E_OBSERVABILITY_ALERT_DRILL" = true ] && [ "$FULL_EVIDENCE" != true ]; then
            echo "run_gate_e_observability_alert_drill requires full_evidence=true." >&2
            exit 1
          fi
          if [ "$FULL_EVIDENCE" = true ]; then
            if [ "$RUN_GATE_E_MUTATING_SMOKES" != true ]; then
              echo "full_evidence requires run_gate_e_mutating_smokes=true; stale iSEM/UI/rate-limit artifacts cannot be promoted." >&2
              exit 1
            fi
            if [ "$RUN_GATE_E_LIVE_UAT_RLS" != true ]; then
              echo "full_evidence requires run_gate_e_live_uat_rls=true; stale onboarding/RLS artifacts cannot be promoted." >&2
              exit 1
            fi
            if [ "$RUN_GATE_E_DATA_SAFETY_RECONCILIATION" != true ]; then
              echo "full_evidence requires run_gate_e_data_safety_reconciliation=true; stale restore/inline-upload artifacts cannot be promoted." >&2
              exit 1
            fi
            if [ "$RUN_GATE_E_OBSERVABILITY_ALERT_DRILL" != true ]; then
              echo "full_evidence requires run_gate_e_observability_alert_drill=true; stale alert delivery artifacts cannot be promoted." >&2
              exit 1
            fi
            node --input-type=module - "$UI_UX_APPROVED_AT_INPUT" <<'NODE'
          const [approvedAt] = process.argv.slice(2);
          if (!approvedAt || Number.isNaN(Date.parse(approvedAt)) || Date.parse(approvedAt) > Date.now() + 5 * 60 * 1000) {
            process.exit(1);
          }
          NODE
          fi

      - name: Validate selected deployment run metadata
        shell: bash
        env:
          DEPLOY_RUN_ID: ${{ inputs.deploy_run_id || vars.STAGING_OUTBOX_DEPLOY_RUN_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_file="$RUNNER_TEMP/staging-deploy-run.json"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$DEPLOY_RUN_ID" > "$run_file"
          node --input-type=module - "$run_file" "$GITHUB_REPOSITORY" <<'NODE'
          import { readFileSync } from "node:fs";
          const [file, repository] = process.argv.slice(2);
          const run = JSON.parse(readFileSync(file, "utf8"));
          if (
            run?.repository?.full_name !== repository ||
            run?.path !== ".github/workflows/staging-deploy.yml" ||
            run?.status !== "completed" ||
            run?.conclusion !== "success"
          ) {
            process.exit(1);
          }
          NODE

      - uses: actions/download-artifact@v4
        with:
          name: staging-deployment-cutover-${{ inputs.deploy_run_id || vars.STAGING_OUTBOX_DEPLOY_RUN_ID }}
          run-id: ${{ inputs.deploy_run_id || vars.STAGING_OUTBOX_DEPLOY_RUN_ID }}
          github-token: ${{ github.token }}
          path: artifacts/cutover

      - name: Validate selected deployment cutover
        shell: bash
        env:
          DEPLOY_RUN_ID: ${{ inputs.deploy_run_id || vars.STAGING_OUTBOX_DEPLOY_RUN_ID }}
        run: |
          DEPLOYMENT_CUTOVER_EVIDENCE_TARGET="file://$PWD/artifacts/cutover/deployment-cutover.json" DEPLOYMENT_CUTOVER_EXPECTED_RUN_ID="$DEPLOY_RUN_ID" DEPLOYMENT_CUTOVER_EXPECTED_REPOSITORY="$GITHUB_REPOSITORY" \
            node scripts/check-deployment-cutover-evidence.mjs

      - name: Bind helpers to cutover source SHA
        shell: bash
        run: |
          cutover_file="artifacts/cutover/deployment-cutover.json"
          echo "CUTOVER_SOURCE_SHA=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).sourceSha' "$cutover_file")" >> "$GITHUB_ENV"
          echo "CUTOVER_RELEASE_IMAGE_TAG=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).releaseImageTag' "$cutover_file")" >> "$GITHUB_ENV"
          echo "CUTOVER_AT=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).cutoverAt' "$cutover_file")" >> "$GITHUB_ENV"
          echo "CUTOVER_REPOSITORY=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).repository' "$cutover_file")" >> "$GITHUB_ENV"

      - name: Bind selected deployment run to cutover source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module - "$RUNNER_TEMP/staging-deploy-run.json" "$CUTOVER_SOURCE_SHA" "$EVENT_NAME" "$PR_HEAD_SHA" <<'NODE'
          import { readFileSync } from "node:fs";
          const [file, cutoverSourceSha, eventName, pullRequestHeadSha] = process.argv.slice(2);
          const run = JSON.parse(readFileSync(file, "utf8"));
          if (run?.head_sha?.toLowerCase() !== cutoverSourceSha.toLowerCase()) process.exit(1);
          if (eventName === "pull_request" && pullRequestHeadSha?.toLowerCase() !== cutoverSourceSha.toLowerCase()) process.exit(1);
          NODE

      - name: Stage verifier-only evidence helpers
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          verifier_root="$RUNNER_TEMP/gate-e-verifier"
          install -d -m 700 "$verifier_root"
          for relative in \
            package.json \
            .github/workflows/staging-outbox-verify.yml \
            apps/web/e2e-next/ui-visual-qa-next.spec.ts \
            packages/db/scripts/check-rls-live.mjs \
            scripts/check-prod-evidence.mjs \
            scripts/check-production-evidence-summary.mjs \
            scripts/check-release-evidence-manifest.mjs \
            scripts/check-staging-release-artifacts.mjs \
            scripts/check-staging-evidence-env.mjs \
            scripts/check-rls-live-evidence.mjs \
            scripts/check-live-onboarding-result.mjs \
            scripts/check-runtime-parity-evidence.mjs \
            scripts/check-uat-evidence.mjs \
            scripts/check-ui-ux-redesign-evidence.mjs \
            scripts/audit-identity-links-live.mjs \
            scripts/generate-admin-mfa-evidence.mjs \
            scripts/generate-audit-null-tenant-evidence.mjs \
            scripts/generate-identity-migration-evidence.mjs \
            scripts/generate-financial-retention-evidence.mjs \
            scripts/generate-kvkk-inventory-evidence.mjs \
            scripts/generate-observability-uat-evidence.mjs \
            scripts/generate-upload-av-evidence.mjs \
            scripts/generate-release-evidence-manifest.mjs \
            scripts/generate-restore-drill-evidence.mjs \
            scripts/generate-rls-live-evidence.mjs \
            scripts/generate-uat-evidence.mjs \
            scripts/generate-ui-ux-redesign-evidence.mjs \
            scripts/prepare-ui-ux-redesign-staging-artifacts.mjs \
            scripts/run-staging-first-gate-smokes.mjs \
            scripts/rls-live-evidence-contract.mjs \
            scripts/ui-ux-redesign-evidence-bindings.mjs \
            scripts/migrate-identity-links-live.mjs \
            scripts/smoke-isem-answer-key-live.mjs \
            scripts/smoke-raw-import-upload-live.mjs \
            scripts/smoke-report-generation-live.mjs \
            scripts/run-observability-alert-drill.mjs; do
            [ -f "$relative" ] && [ ! -L "$relative" ]
            install -D -m 600 "$relative" "$verifier_root/$relative"
          done

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CUTOVER_SOURCE_SHA }}
          clean: false

      - name: Overlay verifier-only evidence helpers
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$CUTOVER_SOURCE_SHA" ]
          verifier_root="$RUNNER_TEMP/gate-e-verifier"
          for relative in \
            package.json \
            .github/workflows/staging-outbox-verify.yml \
            apps/web/e2e-next/ui-visual-qa-next.spec.ts \
            packages/db/scripts/check-rls-live.mjs \
            scripts/check-prod-evidence.mjs \
            scripts/check-production-evidence-summary.mjs \
            scripts/check-release-evidence-manifest.mjs \
            scripts/check-staging-release-artifacts.mjs \
            scripts/check-staging-evidence-env.mjs \
            scripts/check-rls-live-evidence.mjs \
            scripts/check-live-onboarding-result.mjs \
            scripts/check-runtime-parity-evidence.mjs \
            scripts/check-uat-evidence.mjs \
            scripts/check-ui-ux-redesign-evidence.mjs \
            scripts/audit-identity-links-live.mjs \
            scripts/generate-admin-mfa-evidence.mjs \
            scripts/generate-audit-null-tenant-evidence.mjs \
            scripts/generate-identity-migration-evidence.mjs \
            scripts/generate-financial-retention-evidence.mjs \
            scripts/generate-kvkk-inventory-evidence.mjs \
            scripts/generate-observability-uat-evidence.mjs \
            scripts/generate-upload-av-evidence.mjs \
            scripts/generate-release-evidence-manifest.mjs \
            scripts/generate-restore-drill-evidence.mjs \
            scripts/generate-rls-live-evidence.mjs \
            scripts/generate-uat-evidence.mjs \
            scripts/generate-ui-ux-redesign-evidence.mjs \
            scripts/prepare-ui-ux-redesign-staging-artifacts.mjs \
            scripts/run-staging-first-gate-smokes.mjs \
            scripts/rls-live-evidence-contract.mjs \
            scripts/ui-ux-redesign-evidence-bindings.mjs \
            scripts/migrate-identity-links-live.mjs \
            scripts/smoke-isem-answer-key-live.mjs \
            scripts/smoke-raw-import-upload-live.mjs \
            scripts/smoke-report-generation-live.mjs \
            scripts/run-observability-alert-drill.mjs; do
            source_file="$verifier_root/$relative"
            [ -f "$source_file" ] && [ ! -L "$source_file" ]
            install -m 644 "$source_file" "$relative"
          done

      - name: Validate staging verify environment
        shell: bash
        env:
          STAGING_DEPLOY_DIR: ${{ vars.STAGING_DEPLOY_DIR }}
          STAGING_EDGE_MODE: ${{ vars.STAGING_EDGE_MODE }}
        run: |
          set -euo pipefail
          [ "$STAGING_DEPLOY_DIR" = "/root/o-okul" ]
          case "${STAGING_EDGE_MODE:-domain}" in
            domain|ip) echo "STAGING_EDGE_MODE=${STAGING_EDGE_MODE:-domain}" >> "$GITHUB_ENV" ;;
            *) exit 1 ;;
          esac
          echo "STAGING_SSH_KEY_PATH=$RUNNER_TEMP/staging_deploy_key" >> "$GITHUB_ENV"
          echo "STAGING_KNOWN_HOSTS_PATH=$RUNNER_TEMP/staging_known_hosts" >> "$GITHUB_ENV"
          echo "OUTBOX_SOURCE_CLAIM_DIR=/root/o-okul-private/secret-delivery-outbox/.claims/$CUTOVER_RELEASE_IMAGE_TAG/${{ github.run_id }}" >> "$GITHUB_ENV"

      - name: Configure SSH
        shell: bash
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$STAGING_SSH_KEY_PATH"
          chmod 600 "$STAGING_SSH_KEY_PATH"
          : > "$STAGING_KNOWN_HOSTS_PATH"
          chmod 600 "$STAGING_KNOWN_HOSTS_PATH"

      - name: Preflight current images and private outbox source
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i "$STAGING_SSH_KEY_PATH" -o UserKnownHostsFile="$STAGING_KNOWN_HOSTS_PATH" -o StrictHostKeyChecking=accept-new "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "STAGING_EDGE_MODE='$STAGING_EDGE_MODE' RELEASE_IMAGE_TAG='$CUTOVER_RELEASE_IMAGE_TAG' REPOSITORY='$CUTOVER_REPOSITORY' CUTOVER_AT='$CUTOVER_AT' SOURCE_CLAIM_DIR='$OUTBOX_SOURCE_CLAIM_DIR' REUSE_OUTBOX_SMOKE_RUN_ID='$REUSE_OUTBOX_SMOKE_RUN_ID' bash -se" <<'REMOTE'
          set -euo pipefail
          cd /root/o-okul
          case "$STAGING_EDGE_MODE" in
            domain) EDGE_COMPOSE_FILE="docker-compose.traefik.yml" ;;
            ip) EDGE_COMPOSE_FILE="docker-compose.traefik-ip.yml" ;;
            *) exit 1 ;;
          esac
          [[ "$RELEASE_IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]
          [[ "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          grep -Fxq 'ADMIN_MFA_MODE=required' .env
          expected_prefix="ghcr.io/$REPOSITORY"
          require_running_image() {
            local service="$1" expected="$2" id image state health
            id="$(docker compose --env-file .env --env-file .env.release -f docker-compose.yml -f docker-compose.release.yml -f "$EDGE_COMPOSE_FILE" ps -q "$service")"
            [ -n "$id" ]
            image="$(docker inspect -f '{{.Config.Image}}' "$id")"
            state="$(docker inspect -f '{{.State.Status}}' "$id")"
            health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$id")"
            [ "$image" = "$expected" ] && [ "$state" = running ] && { [ -z "$health" ] || [ "$health" = healthy ]; }
          }
          require_running_image web "$expected_prefix/web:$RELEASE_IMAGE_TAG"
          require_running_image api "$expected_prefix/api:$RELEASE_IMAGE_TAG"
          require_running_image worker "$expected_prefix/worker:$RELEASE_IMAGE_TAG"
          require_running_image queue-board "$expected_prefix/queue-board:$RELEASE_IMAGE_TAG"
          if [ -n "$REUSE_OUTBOX_SMOKE_RUN_ID" ]; then
            [[ "$REUSE_OUTBOX_SMOKE_RUN_ID" =~ ^[0-9]+$ ]]
            exit 0
          fi
          private_root=/root/o-okul-private/secret-delivery-outbox
          source_dir="$private_root/$RELEASE_IMAGE_TAG"
          source_file="$source_dir/source-id"
          if [ ! -f "$source_file" ]; then
            echo "Phase B private source missing for release $RELEASE_IMAGE_TAG; provision a fresh post-cutover retry delivery source before verify." >&2
            exit 1
          fi
          [ -d "$private_root" ] && [ ! -L "$private_root" ]
          [ -d "$source_dir" ] && [ ! -L "$source_dir" ]
          claim_parent="$(dirname "$SOURCE_CLAIM_DIR")"
          install -d -m 700 "$private_root/.claims" "$claim_parent"
          [ ! -e "$SOURCE_CLAIM_DIR" ]
          mv -- "$source_dir" "$SOURCE_CLAIM_DIR"
          source_dir="$SOURCE_CLAIM_DIR"
          source_file="$source_dir/source-id"
          [ "$(stat -c %a "$private_root")" = 700 ] && [ "$(stat -c %u "$private_root")" = "$(id -u)" ]
          [ "$(stat -c %a "$source_dir")" = 700 ] && [ "$(stat -c %u "$source_dir")" = "$(id -u)" ]
          [ ! -L "$source_file" ] && [ "$(stat -c %a "$source_file")" = 600 ] && [ "$(stat -c %u "$source_file")" = "$(id -u)" ]
          cutover_epoch="$(date -d "$CUTOVER_AT" +%s)"
          source_mtime="$(stat -c %Y "$source_file")"
          [ "$source_mtime" -ge "$((cutover_epoch - 60))" ]
          REMOTE

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium for public staging UI evidence
        run: pnpm --filter @o-okul/web exec playwright install --with-deps chromium

      - uses: actions/download-artifact@v4
        with:
          name: staging-github-ci-evidence-${{ env.CUTOVER_SOURCE_SHA }}
          run-id: ${{ inputs.deploy_run_id || vars.STAGING_OUTBOX_DEPLOY_RUN_ID }}
          github-token: ${{ github.token }}
          path: artifacts/staging/reports

      - uses: actions/download-artifact@v4
        if: ${{ inputs.full_evidence }}
        with:
          name: staging-activation-evidence-${{ env.CUTOVER_SOURCE_SHA }}
          run-id: ${{ inputs.deploy_run_id || vars.STAGING_OUTBOX_DEPLOY_RUN_ID }}
          github-token: ${{ github.token }}
          path: artifacts/activation

      - uses: actions/download-artifact@v4
        if: ${{ inputs.full_evidence && inputs.reuse_provider_smoke_run_id != '' }}
        with:
          name: staging-outbox-verify-${{ inputs.deploy_run_id || vars.STAGING_OUTBOX_DEPLOY_RUN_ID }}-${{ inputs.reuse_provider_smoke_run_id }}
          run-id: ${{ inputs.reuse_provider_smoke_run_id }}
          github-token: ${{ github.token }}
          path: artifacts/provider-smoke-reuse

      - uses: actions/download-artifact@v4
        if: ${{ inputs.full_evidence && inputs.reuse_aggregate_smoke_run_id != '' }}
        with:
          name: staging-outbox-verify-${{ inputs.deploy_run_id || vars.STAGING_OUTBOX_DEPLOY_RUN_ID }}-${{ inputs.reuse_aggregate_smoke_run_id }}
          run-id: ${{ inputs.reuse_aggregate_smoke_run_id }}
          github-token: ${{ github.token }}
          path: artifacts/aggregate-smoke-reuse

      - name: Validate cutover-bound GitHub CI evidence
        shell: bash
        run: GITHUB_CI_EVIDENCE_TARGET="file://$PWD/artifacts/staging/reports/github-ci.json" pnpm github-ci:check

      - name: Open staging data tunnels for aggregate checks
        if: ${{ inputs.full_evidence }}
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i "$STAGING_SSH_KEY_PATH" -o UserKnownHostsFile="$STAGING_KNOWN_HOSTS_PATH" -fN -o ExitOnForwardFailure=yes -o StrictHostKeyChecking=accept-new \
            -L 127.0.0.1:15432:127.0.0.1:5432 -L 127.0.0.1:16379:127.0.0.1:6379 \
            -L 127.0.0.1:9090:127.0.0.1:9090 -L 127.0.0.1:3002:127.0.0.1:3002 -L 127.0.0.1:3101:127.0.0.1:3101 \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST"
          clamav_ip="$(ssh -i "$STAGING_SSH_KEY_PATH" -o UserKnownHostsFile="$STAGING_KNOWN_HOSTS_PATH" -o StrictHostKeyChecking=accept-new "$STAGING_SSH_USER@$STAGING_SSH_HOST" "bash -se" <<'REMOTE'
          set -euo pipefail
          cd /root/o-okul
          compose=(docker compose --env-file .env --env-file .env.release -f docker-compose.yml -f docker-compose.release.yml -f docker-compose.traefik.yml --profile av)
          id="$("${compose[@]}" ps -q clamav)"
          [ -n "$id" ]
          [ "$(docker inspect -f '{{.State.Status}}' "$id")" = running ]
          [ "$(docker inspect -f '{{.State.Health.Status}}' "$id")" = healthy ]
          docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$id"
          REMOTE
          )"
          [[ "$clamav_ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]
          ssh -i "$STAGING_SSH_KEY_PATH" -o UserKnownHostsFile="$STAGING_KNOWN_HOSTS_PATH" -fN -o ExitOnForwardFailure=yes -o StrictHostKeyChecking=accept-new \
            -L "127.0.0.1:13310:$clamav_ip:3310" "$STAGING_SSH_USER@$STAGING_SSH_HOST"

      - name: Upload cutover-bound smoke helpers
        if: ${{ inputs.reuse_outbox_smoke_run_id == '' }}
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          set -euo pipefail
          verify_helpers="/root/o-okul-private/verify-scripts/$CUTOVER_RELEASE_IMAGE_TAG/${{ github.run_id }}"
          echo "OUTBOX_VERIFY_HELPERS_DIR=$verify_helpers" >> "$GITHUB_ENV"
          ssh -i "$STAGING_SSH_KEY_PATH" -o UserKnownHostsFile="$STAGING_KNOWN_HOSTS_PATH" -o StrictHostKeyChecking=accept-new "$STAGING_SSH_USER@$STAGING_SSH_HOST" "install -d -m 700 '$verify_helpers'"
          scp -i "$STAGING_SSH_KEY_PATH" -o UserKnownHostsFile="$STAGING_KNOWN_HOSTS_PATH" -o StrictHostKeyChecking=accept-new \
            scripts/smoke-secret-delivery-outbox-staging.mjs scripts/smoke-evidence.mjs scripts/isem-optical-pipeline-contract.mjs \
            docs/evidence-manifests/isem-optical-pipeline-inputs.json "$STAGING_SSH_USER@$STAGING_SSH_HOST:$verify_helpers/"
          ssh -i "$STAGING_SSH_KEY_PATH" -o UserKnownHostsFile="$STAGING_KNOWN_HOSTS_PATH" -o StrictHostKeyChecking=accept-new "$STAGING_SSH_USER@$STAGING_SSH_HOST" "chmod 600 '$verify_helpers/'*.mjs '$verify_helpers/isem-optical-pipeline-inputs.json'"

      - name: Run private outbox smoke
        if: ${{ inputs.reuse_outbox_smoke_run_id == '' }}
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i "$STAGING_SSH_KEY_PATH" -o UserKnownHostsFile="$STAGING_KNOWN_HOSTS_PATH" -o StrictHostKeyChecking=accept-new "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "STAGING_EDGE_MODE='$STAGING_EDGE_MODE' RELEASE_IMAGE_TAG='$CUTOVER_RELEASE_IMAGE_TAG' REPOSITORY='$CUTOVER_REPOSITORY' CUTOVER_AT='$CUTOVER_AT' OUTBOX_VERIFY_HELPERS_DIR='$OUTBOX_VERIFY_HELPERS_DIR' OUTBOX_SOURCE_CLAIM_DIR='$OUTBOX_SOURCE_CLAIM_DIR' bash -se" <<'REMOTE'
          set -euo pipefail
          STAGING_DEPLOY_DIR=/root/o-okul
          cd "$STAGING_DEPLOY_DIR"
          case "${STAGING_EDGE_MODE:-domain}" in
            domain) EDGE_COMPOSE_FILE="docker-compose.traefik.yml" ;;
            ip) EDGE_COMPOSE_FILE="docker-compose.traefik-ip.yml" ;;
            *) exit 1 ;;
          esac
          [[ "$RELEASE_IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]
          [[ "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          expected_worker_image="ghcr.io/$REPOSITORY/worker:$RELEASE_IMAGE_TAG"
          require_running_worker_image() {
            local id image state health
            id="$(docker compose --env-file .env --env-file .env.release -f docker-compose.yml -f docker-compose.release.yml -f "$EDGE_COMPOSE_FILE" ps -q worker)"
            [ -n "$id" ]
            image="$(docker inspect -f '{{.Config.Image}}' "$id")"
            state="$(docker inspect -f '{{.State.Status}}' "$id")"
            health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$id")"
            [ "$image" = "$expected_worker_image" ] && [ "$state" = running ] && { [ -z "$health" ] || [ "$health" = healthy ]; }
          }
          require_running_worker_image
          source_dir="$OUTBOX_SOURCE_CLAIM_DIR"
          source_file="$source_dir/source-id"
          mkdir -p artifacts/staging/smoke
          WORKER_IMAGE="$expected_worker_image" docker compose --env-file .env --env-file .env.release -f docker-compose.yml -f docker-compose.release.yml -f "$EDGE_COMPOSE_FILE" run --rm -T \
            -v "$OUTBOX_VERIFY_HELPERS_DIR:/app/scripts:ro" -v "$OUTBOX_VERIFY_HELPERS_DIR:/app/docs/evidence-manifests:ro" \
            -v "$PWD/artifacts:/app/artifacts" -v "$source_dir:/run/outbox-source:ro" \
            -e STAGING_ENVIRONMENT=staging -e SECRET_DELIVERY_OUTBOX_SMOKE_SOURCE_FILE=/run/outbox-source/source-id \
            -e SECRET_DELIVERY_OUTBOX_SMOKE_EVIDENCE_FILE=artifacts/staging/smoke/secret-delivery-outbox.json \
            -e SECRET_DELIVERY_OUTBOX_NOT_BEFORE="$CUTOVER_AT" -e SECRET_DELIVERY_OUTBOX_RELEASE_IMAGE_TAG="$RELEASE_IMAGE_TAG" \
            worker node scripts/smoke-secret-delivery-outbox-staging.mjs < /dev/null
          require_running_worker_image # post-smoke exact-image gate
          REMOTE
          scp -i "$STAGING_SSH_KEY_PATH" -o UserKnownHostsFile="$STAGING_KNOWN_HOSTS_PATH" -o StrictHostKeyChecking=accept-new "$STAGING_SSH_USER@$STAGING_SSH_HOST:/root/o-okul/artifacts/staging/smoke/secret-delivery-outbox.json" artifacts/secret-delivery-outbox.json

      - name: Reuse exact cutover-bound sanitized outbox smoke
        if: ${{ inputs.reuse_outbox_smoke_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: staging-outbox-smoke-${{ inputs.deploy_run_id || vars.STAGING_OUTBOX_DEPLOY_RUN_ID }}-${{ inputs.reuse_outbox_smoke_run_id }}
          run-id: ${{ inputs.reuse_outbox_smoke_run_id }}
          github-token: ${{ github.token }}
          path: artifacts

      - name: Validate sanitized outbox evidence
        shell: bash
        run: |
          SECRET_DELIVERY_OUTBOX_EVIDENCE_TARGET="file://$PWD/artifacts/secret-delivery-outbox.json" SECRET_DELIVERY_OUTBOX_NOT_BEFORE="$CUTOVER_AT" SECRET_DELIVERY_OUTBOX_RELEASE_IMAGE_TAG="$CUTOVER_RELEASE_IMAGE_TAG" \
            node scripts/check-secret-delivery-outbox-evidence.mjs

      - name: Upload sanitized Phase B outbox evidence
        uses: actions/upload-artifact@v4
        with:
          name: staging-outbox-smoke-${{ inputs.deploy_run_id || vars.STAGING_OUTBOX_DEPLOY_RUN_ID }}-${{ github.run_id }}
          path: artifacts/secret-delivery-outbox.json
          if-no-files-found: error

      - name: Run configured production evidence aggregation
        if: ${{ inputs.full_evidence }}
        shell: bash
        env:
          STAGING_EVIDENCE_ENV_B64: ${{ secrets.STAGING_EVIDENCE_ENV_B64 }}
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          GITHUB_TOKEN: ${{ github.token }}
          ISEM_OPTICAL_PIPELINE_TXT_BASE64: ${{ secrets.GATE_E_ISEM_OPTICAL_TXT_BASE64 }}
          ISEM_OPTICAL_PIPELINE_ANSWER_KEY_BASE64: ${{ secrets.GATE_E_ISEM_ANSWER_KEY_BASE64 }}
          ISEM_OPTICAL_PIPELINE_SMOKE_PASSWORD: ${{ secrets.GATE_E_ISEM_SMOKE_PASSWORD }}
        run: |
          set -euo pipefail
          runtime_env="$RUNNER_TEMP/staging-runtime-required.env"
          private_ui_file="$PWD/artifacts/staging/private/live-ui-worker-input.json"
          answer_key_file="$PWD/ornek-veriler/iSEM - LGS - 1 Detaylı Cevap Anahtarı.xlsx"
          trap 'rm -f -- .staging-evidence.env "$runtime_env"' EXIT
          printf '%s' "$STAGING_EVIDENCE_ENV_B64" | base64 -d > .staging-evidence.env
          chmod 600 .staging-evidence.env
          [ "$(grep -Ec '^UI_UX_REDESIGN_APPROVED_AT=' .staging-evidence.env)" -eq 1 ]
          sed -i "s#^UI_UX_REDESIGN_APPROVED_AT=.*#UI_UX_REDESIGN_APPROVED_AT=$UI_UX_APPROVED_AT_INPUT#" .staging-evidence.env
          grep -Fxq "UI_UX_REDESIGN_APPROVED_AT=$UI_UX_APPROVED_AT_INPUT" .staging-evidence.env
          sed -i 's/^ADMIN_MFA_MODE=.*/ADMIN_MFA_MODE=required/' .staging-evidence.env
          grep -Fxq 'ADMIN_MFA_MODE=required' .staging-evidence.env
          if grep -q '^NOTIFICATION_SMOKE_PUSH_TO=' .staging-evidence.env; then
            sed -i 's/^NOTIFICATION_SMOKE_PUSH_TO=.*/NOTIFICATION_SMOKE_PUSH_TO=/' .staging-evidence.env
          else
            printf '\nNOTIFICATION_SMOKE_PUSH_TO=\n' >> .staging-evidence.env
          fi
          grep -Fxq 'NOTIFICATION_SMOKE_PUSH_TO=' .staging-evidence.env
          umask 077
          ssh -i "$STAGING_SSH_KEY_PATH" -o UserKnownHostsFile="$STAGING_KNOWN_HOSTS_PATH" -o StrictHostKeyChecking=accept-new "$STAGING_SSH_USER@$STAGING_SSH_HOST" "bash -se" > "$runtime_env" <<'REMOTE'
          set -euo pipefail
          cd /root/o-okul
          keys=(APP_URL API_URL WEB_URL DOMAIN CF_DNS_API_TOKEN_FILE LEGACY_TENANT_LOGIN_CUTOFF_AT NOTIFICATION_FROM_EMAIL NOTIFICATION_REPLY_TO_EMAIL NOTIFICATION_SMOKE_EMAIL_TO TRAEFIK_HTTPS_SMOKE_URL DATABASE_URL DIRECT_DATABASE_URL DOCKER_DATABASE_URL DOCKER_DIRECT_DATABASE_URL SECRET_DELIVERY_WORKER_DB_PASSWORD SECRET_DELIVERY_OUTBOX_DATABASE_URL DOCKER_SECRET_DELIVERY_OUTBOX_DATABASE_URL REDIS_URL)
          for key in "${keys[@]}"; do
            [ "$(grep -Ec "^${key}=" .env)" -eq 1 ]
            line="$(grep -E "^${key}=" .env)"
            [ -n "${line#*=}" ]
            printf '%s\n' "$line"
          done
          REMOTE
          chmod 600 "$runtime_env"
          node --input-type=module - .staging-evidence.env "$runtime_env" <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const [envPath, runtimePath] = process.argv.slice(2);
          const requiredKeys = [
            "APP_URL",
            "API_URL",
            "WEB_URL",
            "DOMAIN",
            "CF_DNS_API_TOKEN_FILE",
            "LEGACY_TENANT_LOGIN_CUTOFF_AT",
            "NOTIFICATION_FROM_EMAIL",
            "NOTIFICATION_REPLY_TO_EMAIL",
            "NOTIFICATION_SMOKE_EMAIL_TO",
            "TRAEFIK_HTTPS_SMOKE_URL",
            "DATABASE_URL",
            "DIRECT_DATABASE_URL",
            "DOCKER_DATABASE_URL",
            "DOCKER_DIRECT_DATABASE_URL",
            "SECRET_DELIVERY_WORKER_DB_PASSWORD",
            "SECRET_DELIVERY_OUTBOX_DATABASE_URL",
            "DOCKER_SECRET_DELIVERY_OUTBOX_DATABASE_URL",
            "REDIS_URL",
          ];
          const runtimeLines = readFileSync(runtimePath, "utf8").trim().split("\n");
          const runtimeByKey = new Map(runtimeLines.map((line) => [line.slice(0, line.indexOf("=")), line]));
          if (runtimeByKey.size !== requiredKeys.length || requiredKeys.some((key) => !runtimeByKey.get(key)?.slice(key.length + 1))) {
            throw new Error("Staging runtime evidence anahtarları eksik veya yinelenmiş.");
          }
          const sourceLines = readFileSync(envPath, "utf8").split("\n");
          const merged = sourceLines.filter((line) => !requiredKeys.some((key) => line.startsWith(`${key}=`)));
          merged.push(...requiredKeys.map((key) => runtimeByKey.get(key)));
          writeFileSync(envPath, `${merged.join("\n").replace(/\n+$/u, "")}\n`, { mode: 0o600 });
          NODE
          pnpm staging:evidence-env:check -- --mode full --env-file .staging-evidence.env
          node scripts/append-staging-evidence-tunnel-env.mjs --env-file .staging-evidence.env --postgres-port 15432 --redis-port 16379
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const envPath = ".staging-evidence.env";
          const githubCi = JSON.parse(readFileSync("artifacts/staging/reports/github-ci.json", "utf8"));
          const repository = process.env.CUTOVER_REPOSITORY;
          const runId = String(githubCi.workflow?.runId ?? "");
          const expectedRunUrl = `https://github.com/${repository}/actions/runs/${runId}`;
          if (githubCi.repository !== repository || !/^\d+$/.test(runId) || githubCi.workflow?.runUrl !== expectedRunUrl) {
            throw new Error("Cutover GitHub CI evidence run URL/repository bağı geçersiz.");
          }

          const source = readFileSync(envPath, "utf8");
          const key = "UI_UX_REDESIGN_STAGING_EVIDENCE_REFERENCES";
          const lines = source.split("\n");
          const matches = lines.flatMap((line, index) => line.startsWith(`${key}=`) ? [index] : []);
          if (matches.length !== 1) throw new Error(`${key} tam olarak bir kez tanımlanmalı.`);
          const index = matches[0];
          const references = lines[index].slice(key.length + 1).split(",");
          if (references.length !== 4 || !references[0] || !references[2] || !references[3]) {
            throw new Error(`${key} summary, GitHub run, UAT ve privacy sırasını korumalı.`);
          }
          references[1] = `run:${githubCi.workflow.runUrl}`;
          lines[index] = `${key}=${references.join(",")}`;
          writeFileSync(envPath, lines.join("\n"), { mode: 0o600 });
          NODE
          rollback_source="$RUNNER_TEMP/deployment-rollback-source.json"
          rollback_source_remote=/root/o-okul/artifacts/staging/reports/deployment-rollback.json
          ssh -i "$STAGING_SSH_KEY_PATH" -o UserKnownHostsFile="$STAGING_KNOWN_HOSTS_PATH" -o StrictHostKeyChecking=accept-new "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "test -f '$rollback_source_remote' && test ! -L '$rollback_source_remote'"
          scp -i "$STAGING_SSH_KEY_PATH" -o UserKnownHostsFile="$STAGING_KNOWN_HOSTS_PATH" -o StrictHostKeyChecking=accept-new \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST:$rollback_source_remote" "$rollback_source"
          chmod 600 "$rollback_source"
          DEPLOYMENT_ROLLBACK_TARGET="file://$rollback_source" pnpm deployment:rollback:check
          rollback_image_tag="$(ssh -i "$STAGING_SSH_KEY_PATH" -o UserKnownHostsFile="$STAGING_KNOWN_HOSTS_PATH" -o StrictHostKeyChecking=accept-new "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "cd /root/o-okul && test \"\$(grep -Ec '^ROLLBACK_IMAGE_TAG=' .env.release)\" -eq 1 && sed -n 's/^ROLLBACK_IMAGE_TAG=//p' .env.release")"
          [[ "$rollback_image_tag" =~ ^[a-f0-9]{40}$ ]]
          [ "$rollback_image_tag" != "$CUTOVER_RELEASE_IMAGE_TAG" ]
          node --input-type=module - "$rollback_source" "artifacts/staging/reports/deployment-rollback.json" "$CUTOVER_REPOSITORY" "$CUTOVER_RELEASE_IMAGE_TAG" "$rollback_image_tag" <<'NODE'
          import { spawnSync } from "node:child_process";
          import { readFileSync } from "node:fs";

          const [sourcePath, outputPath, repository, releaseImageTag, rollbackImageTag] = process.argv.slice(2);
          const source = JSON.parse(readFileSync(sourcePath, "utf8"));
          const releaseCandidate = `ghcr.io/${repository}/api:${releaseImageTag}`;
          const rollbackCandidate = `ghcr.io/${repository}/api:${rollbackImageTag}`;
          if (source.releaseCandidate !== rollbackCandidate || source.drill?.mode !== "cold-rollback-rehearsal") {
            throw new Error("Historical rollback report current fallback image ile zincirlenemedi.");
          }
          const evidence = source.drill.evidence;
          const childEnv = {
            ...process.env,
            STAGING_ENVIRONMENT: "production",
            DEPLOYMENT_ROLLBACK_OUTPUT: outputPath,
            DEPLOYMENT_ROLLBACK_RELEASE_CANDIDATE: releaseCandidate,
            DEPLOYMENT_ROLLBACK_ROLLBACK_IMAGE_TAG: rollbackCandidate,
            DEPLOYMENT_ROLLBACK_DRILL_MODE: source.drill.mode,
            DEPLOYMENT_ROLLBACK_DRILL_SOURCE_IMAGE_TAG: source.drill.sourceImageTag,
            DEPLOYMENT_ROLLBACK_DRILL_ROLLBACK_IMAGE_TAG: source.drill.rollbackImageTag,
            DEPLOYMENT_ROLLBACK_DRILL_RESTORED_IMAGE_TAG: source.drill.restoredImageTag,
            DEPLOYMENT_ROLLBACK_DRILL_STARTED_AT: source.drill.startedAt,
            DEPLOYMENT_ROLLBACK_DRILL_COMPLETED_AT: source.drill.completedAt,
            DEPLOYMENT_ROLLBACK_FAILURE_INJECTED: String(source.drill.failureInjected),
            DEPLOYMENT_ROLLBACK_FAILURE_MODE: "",
            DEPLOYMENT_ROLLBACK_MIGRATION_ROLLBACK_SAFE: String(source.migrationRollbackSafe),
            DEPLOYMENT_ROLLBACK_APPROVED_BY: source.approval.approvedBy,
            DEPLOYMENT_ROLLBACK_APPROVAL_REFERENCE: source.approval.approvalReference,
            DEPLOYMENT_ROLLBACK_DRILL_CONFIRMED: "true",
            DEPLOYMENT_ROLLBACK_COMMAND_LOG_REFERENCE: evidence.commandLogReference,
            DEPLOYMENT_ROLLBACK_SOURCE_RUN_URL: evidence.source.runUrl,
            DEPLOYMENT_ROLLBACK_SOURCE_UAT_ARTIFACT_URL: evidence.source.uatArtifactUrl,
            DEPLOYMENT_ROLLBACK_ROLLBACK_RUN_URL: evidence.rollback.runUrl,
            DEPLOYMENT_ROLLBACK_ROLLBACK_UAT_ARTIFACT_URL: evidence.rollback.uatArtifactUrl,
            DEPLOYMENT_ROLLBACK_RESTORED_RUN_URL: evidence.restored.runUrl,
            DEPLOYMENT_ROLLBACK_RESTORED_UAT_ARTIFACT_URL: evidence.restored.uatArtifactUrl,
          };
          for (const item of source.servicesVerified ?? []) {
            const prefix = `DEPLOYMENT_ROLLBACK_${item.service.toUpperCase().replaceAll("-", "_")}`;
            childEnv[`${prefix}_STATUS`] = item.status;
            childEnv[`${prefix}_IMAGE_TAG`] = item.imageTag;
            childEnv[`${prefix}_EVIDENCE_REFERENCE`] = item.evidenceReference;
          }
          const result = spawnSync(process.execPath, ["scripts/generate-deployment-rollback-evidence.mjs"], {
            env: childEnv,
            stdio: "inherit",
          });
          if (result.status !== 0) process.exit(result.status ?? 1);
          NODE
          rm -f -- "$rollback_source"
          sed -i "s#^DEPLOYMENT_ROLLBACK_TARGET=.*#DEPLOYMENT_ROLLBACK_TARGET=file://$PWD/artifacts/staging/reports/deployment-rollback.json#" .staging-evidence.env
          grep -Fxq "DEPLOYMENT_ROLLBACK_TARGET=file://$PWD/artifacts/staging/reports/deployment-rollback.json" .staging-evidence.env
          github_ci_run_url="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).workflow.runUrl' artifacts/staging/reports/github-ci.json)"
          verifier_run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          mkdir -p artifacts/staging/smoke artifacts/staging/reports
          STAGING_ENVIRONMENT=staging \
          ADMIN_MFA_OUTPUT=artifacts/staging/reports/admin-mfa.json \
          ADMIN_MFA_PASSWORD_ONLY_LOGIN_BLOCKED=true \
          ADMIN_MFA_TOTP_LOGIN_SUCCEEDED=true \
          ADMIN_MFA_INVALID_TOTP_REJECTED=true \
          ADMIN_MFA_TOTP_REUSE_REJECTED=true \
          ADMIN_MFA_RECOVERY_CODE_LOGIN_SUCCEEDED=true \
          ADMIN_MFA_RECOVERY_CODE_REUSE_REJECTED=true \
          ADMIN_MFA_SESSIONS_REVOKED_ON_ENABLE=true \
          ADMIN_MFA_SESSIONS_REVOKED_ON_DISABLE=true \
          ADMIN_MFA_PASSWORD_ONLY_EVIDENCE_REFERENCE="run:$github_ci_run_url" \
          ADMIN_MFA_TOTP_SUCCESS_EVIDENCE_REFERENCE="run:$github_ci_run_url" \
          ADMIN_MFA_INVALID_TOTP_EVIDENCE_REFERENCE="run:$github_ci_run_url" \
          ADMIN_MFA_TOTP_REUSE_EVIDENCE_REFERENCE="run:$github_ci_run_url" \
          ADMIN_MFA_RECOVERY_SUCCESS_EVIDENCE_REFERENCE="run:$github_ci_run_url" \
          ADMIN_MFA_RECOVERY_REUSE_EVIDENCE_REFERENCE="run:$github_ci_run_url" \
          ADMIN_MFA_SESSIONS_REVOKED_ENABLE_EVIDENCE_REFERENCE="run:$github_ci_run_url" \
          ADMIN_MFA_SESSIONS_REVOKED_DISABLE_EVIDENCE_REFERENCE="run:$github_ci_run_url" \
            node --env-file=.staging-evidence.env scripts/generate-admin-mfa-evidence.mjs
          STAGING_ENVIRONMENT=staging \
          AUDIT_NULL_TENANT_OUTPUT=artifacts/staging/reports/audit-null-tenant.json \
          AUDIT_NULL_TENANT_EVIDENCE_REFERENCE="$verifier_run_url" \
            node --env-file=.staging-evidence.env scripts/generate-audit-null-tenant-evidence.mjs
          STAGING_ENVIRONMENT=staging \
          UPLOAD_AV_OUTPUT=artifacts/staging/reports/upload-av.json \
          UPLOAD_AV_SCANNER_DECISION_MODE=local \
          UPLOAD_AV_APPROVED_BY=release-owner-gate-e \
          UPLOAD_AV_APPROVAL_REFERENCE="run:$verifier_run_url" \
          UPLOAD_AV_SCANNER_NAME=ClamAV \
          UPLOAD_AV_SCANNER=clamav \
          UPLOAD_AV_FAIL_CLOSED=true \
          UPLOAD_AV_CLEAN_FILE_ACCEPTED=true \
          UPLOAD_AV_EICAR_REJECTED=true \
          UPLOAD_AV_SCANNER_UNAVAILABLE_REJECTED=true \
          CLAMAV_HOST=127.0.0.1 \
          CLAMAV_PORT=13310 \
          UPLOAD_AV_UNAVAILABLE_TEST_HOST=127.0.0.1 \
          UPLOAD_AV_UNAVAILABLE_TEST_PORT=13311 \
            node scripts/generate-upload-av-evidence.mjs
          [ "$RUN_GATE_E_DATA_SAFETY_RECONCILIATION" = true ]
          data_safety_root="/root/o-okul-private/gate-e-data-safety/$CUTOVER_RELEASE_IMAGE_TAG/$GITHUB_RUN_ID"
          ssh -i "$STAGING_SSH_KEY_PATH" -o UserKnownHostsFile="$STAGING_KNOWN_HOSTS_PATH" -o StrictHostKeyChecking=accept-new "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "install -d -m 700 '$data_safety_root'"
          scp -i "$STAGING_SSH_KEY_PATH" -o UserKnownHostsFile="$STAGING_KNOWN_HOSTS_PATH" -o StrictHostKeyChecking=accept-new \
            scripts/generate-restore-drill-evidence.mjs "$STAGING_SSH_USER@$STAGING_SSH_HOST:$data_safety_root/"
          ssh -i "$STAGING_SSH_KEY_PATH" -o UserKnownHostsFile="$STAGING_KNOWN_HOSTS_PATH" -o StrictHostKeyChecking=accept-new "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "CUTOVER_SOURCE_SHA='$CUTOVER_SOURCE_SHA' DATA_SAFETY_ROOT='$data_safety_root' GITHUB_REPOSITORY='$GITHUB_REPOSITORY' GITHUB_RUN_ID='$GITHUB_RUN_ID' bash -se" <<'REMOTE'
          set -euo pipefail
          cd /root/o-okul
          for release_binding in \
            "WEB_IMAGE=ghcr.io/$GITHUB_REPOSITORY/web:$CUTOVER_SOURCE_SHA" \
            "API_IMAGE=ghcr.io/$GITHUB_REPOSITORY/api:$CUTOVER_SOURCE_SHA" \
            "WORKER_IMAGE=ghcr.io/$GITHUB_REPOSITORY/worker:$CUTOVER_SOURCE_SHA" \
            "QUEUE_BOARD_IMAGE=ghcr.io/$GITHUB_REPOSITORY/queue-board:$CUTOVER_SOURCE_SHA" \
            "SENTRY_RELEASE=$CUTOVER_SOURCE_SHA"; do
            grep -Fxq "$release_binding" .env.release
          done
          work_dir="$DATA_SAFETY_ROOT"
          [ -d "$work_dir" ] && [ ! -L "$work_dir" ]
          cleanup() {
            find "$work_dir" -mindepth 1 -maxdepth 1 -type f -delete
            rmdir "$work_dir"
          }
          trap cleanup EXIT
