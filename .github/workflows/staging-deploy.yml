name: Staging Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional image tag; defaults to the commit SHA."
        required: false
        type: string
      rollback_image_tag:
        description: "Last known-good image tag for rollback evidence."
        required: true
        type: string
      full_evidence:
        description: "Run the full production evidence chain after first staging gates."
        required: false
        default: false
        type: boolean
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: staging-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    steps:
      - name: Validate staging dispatch inputs and environment
        shell: bash
        env:
          REQUESTED_IMAGE_TAG: ${{ inputs.image_tag }}
          ROLLBACK_IMAGE_TAG: ${{ inputs.rollback_image_tag }}
          STAGING_NEXT_PUBLIC_API_URL: ${{ vars.STAGING_NEXT_PUBLIC_API_URL }}
          STAGING_DEPLOY_DIR: ${{ vars.STAGING_DEPLOY_DIR }}
          STAGING_EDGE_MODE: ${{ vars.STAGING_EDGE_MODE }}
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          STAGING_EVIDENCE_ENV_B64: ${{ secrets.STAGING_EVIDENCE_ENV_B64 }}
        run: |
          set -euo pipefail

          for key in \
            STAGING_NEXT_PUBLIC_API_URL \
            STAGING_DEPLOY_DIR \
            STAGING_SSH_HOST \
            STAGING_SSH_USER \
            STAGING_SSH_PRIVATE_KEY \
            GHCR_READ_TOKEN \
            STAGING_EVIDENCE_ENV_B64
          do
            if [ -z "${!key:-}" ]; then
              echo "$key is required for staging deploy." >&2
              exit 1
            fi
          done

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -z "${ROLLBACK_IMAGE_TAG:-}" ]; then
            echo "ROLLBACK_IMAGE_TAG is required for manual staging deploy." >&2
            exit 1
          fi

          validate_tag() {
            local label="$1"
            local value="$2"
            if ! [[ "$value" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "$label must be a valid Docker tag." >&2
              exit 1
            fi
          }

          if [ -n "${REQUESTED_IMAGE_TAG:-}" ]; then
            validate_tag "image_tag" "$REQUESTED_IMAGE_TAG"
          fi
          if [ -n "${ROLLBACK_IMAGE_TAG:-}" ]; then
            validate_tag "rollback_image_tag" "$ROLLBACK_IMAGE_TAG"
          fi

          case "$STAGING_NEXT_PUBLIC_API_URL" in
            https://*) ;;
            *)
              echo "STAGING_NEXT_PUBLIC_API_URL must be an https:// URL." >&2
              exit 1
              ;;
          esac

          edge_mode="${STAGING_EDGE_MODE:-domain}"
          case "$edge_mode" in
            domain|ip) ;;
            *)
              echo "STAGING_EDGE_MODE must be either domain or ip." >&2
              exit 1
              ;;
          esac

          case "$STAGING_DEPLOY_DIR" in
            /*) ;;
            *)
              echo "STAGING_DEPLOY_DIR must be an absolute path." >&2
              exit 1
              ;;
          esac
          if [ "$STAGING_DEPLOY_DIR" = "/" ]; then
            echo "STAGING_DEPLOY_DIR must not be /." >&2
            exit 1
          fi
          if [ "$STAGING_DEPLOY_DIR" != "/root/o-okul" ]; then
            echo "STAGING_DEPLOY_DIR must be /root/o-okul." >&2
            exit 1
          fi
          if [[ "$STAGING_DEPLOY_DIR" == *"'"* || "$STAGING_DEPLOY_DIR" == *$'\n'* || "$STAGING_DEPLOY_DIR" == *$'\r'* ]]; then
            echo "STAGING_DEPLOY_DIR contains unsupported shell characters." >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Check staging evidence env before deploy
        shell: bash
        env:
          STAGING_EVIDENCE_ENV_B64: ${{ secrets.STAGING_EVIDENCE_ENV_B64 }}
        run: |
          set -euo pipefail
          trap 'rm -f .staging-evidence.env' EXIT

          printf '%s' "$STAGING_EVIDENCE_ENV_B64" | base64 -d > .staging-evidence.env
          test -s .staging-evidence.env
          pnpm staging:evidence-env:check -- --env-file .staging-evidence.env

  github-ci-evidence:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Generate GitHub CI evidence before deploy
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          mkdir -p artifacts/staging/reports
          GITHUB_CI_EVIDENCE_OUTPUT="artifacts/staging/reports/github-ci.json" pnpm github-ci:generate
          GITHUB_CI_EVIDENCE_TARGET="file://$PWD/artifacts/staging/reports/github-ci.json" pnpm github-ci:check

      - uses: actions/upload-artifact@v4
        with:
          name: staging-github-ci-evidence-${{ github.event.workflow_run.head_sha || github.sha }}
          path: artifacts/staging/reports/github-ci.json

  build-images:
    needs: github-ci-evidence
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 75
    outputs:
      image-prefix: ${{ steps.meta.outputs.image-prefix }}
      image-tag: ${{ steps.meta.outputs.image-tag }}
      deploy-sha: ${{ steps.meta.outputs.deploy-sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - id: meta
        shell: bash
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          REQUESTED_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          tag="$REQUESTED_IMAGE_TAG"
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            tag="$DEPLOY_SHA"
          fi
          if [ -z "$tag" ]; then
            tag="$DEPLOY_SHA"
          fi
          repository="$(echo "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "image-tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image-prefix=$repository" >> "$GITHUB_OUTPUT"
          echo "deploy-sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Build and push web image
        shell: bash
        env:
          IMAGE_PREFIX: ${{ steps.meta.outputs.image-prefix }}
          IMAGE_TAG: ${{ steps.meta.outputs.image-tag }}
          NEXT_PUBLIC_API_URL: ${{ vars.STAGING_NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SMS_ENABLED: "false"
        run: |
          docker buildx build \
            --push \
            --cache-from type=gha,scope=web \
            --cache-to type=gha,mode=max,scope=web \
            --target web \
            --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
            --build-arg NEXT_PUBLIC_SMS_ENABLED="$NEXT_PUBLIC_SMS_ENABLED" \
            --tag "$IMAGE_PREFIX/web:$IMAGE_TAG" \
            --tag "$IMAGE_PREFIX/web:staging-latest" \
            .

      - name: Build and push api image
        shell: bash
        env:
          IMAGE_PREFIX: ${{ steps.meta.outputs.image-prefix }}
          IMAGE_TAG: ${{ steps.meta.outputs.image-tag }}
          NEXT_PUBLIC_API_URL: ${{ vars.STAGING_NEXT_PUBLIC_API_URL }}
        run: |
          docker buildx build \
            --push \
            --cache-from type=gha,scope=api \
            --cache-to type=gha,mode=max,scope=api \
            --target api \
            --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
            --tag "$IMAGE_PREFIX/api:$IMAGE_TAG" \
            --tag "$IMAGE_PREFIX/api:staging-latest" \
            .

      - name: Build and push worker image
        shell: bash
        env:
          IMAGE_PREFIX: ${{ steps.meta.outputs.image-prefix }}
          IMAGE_TAG: ${{ steps.meta.outputs.image-tag }}
          NEXT_PUBLIC_API_URL: ${{ vars.STAGING_NEXT_PUBLIC_API_URL }}
        run: |
          docker buildx build \
            --push \
            --cache-from type=gha,scope=worker \
            --cache-to type=gha,mode=max,scope=worker \
            --target worker \
            --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
            --tag "$IMAGE_PREFIX/worker:$IMAGE_TAG" \
            --tag "$IMAGE_PREFIX/worker:staging-latest" \
            .

      - name: Build and push queue-board image
        shell: bash
        env:
          IMAGE_PREFIX: ${{ steps.meta.outputs.image-prefix }}
          IMAGE_TAG: ${{ steps.meta.outputs.image-tag }}
        run: |
          docker buildx build \
            --push \
            --cache-from type=gha,scope=queue-board \
            --cache-to type=gha,mode=max,scope=queue-board \
            --target queue-board \
            --tag "$IMAGE_PREFIX/queue-board:$IMAGE_TAG" \
            --tag "$IMAGE_PREFIX/queue-board:staging-latest" \
            .

  deploy:
    needs: build-images
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 25
    outputs:
      rollback-image-tag: ${{ steps.deploy-stack.outputs.rollback-image-tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-images.outputs.deploy-sha }}

      - name: Configure SSH
        shell: bash
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/staging_deploy_key
          chmod 600 ~/.ssh/staging_deploy_key

      - name: Upload compose bundle
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_DEPLOY_DIR: ${{ vars.STAGING_DEPLOY_DIR }}
        run: |
          tar -czf /tmp/o-okul-staging-compose.tgz \
            docker-compose.yml \
            docker-compose.release.yml \
            docker-compose.rate-limit-shard.yml \
            docker-compose.traefik.yml \
            docker-compose.traefik-ip.yml \
            docker-compose.observability.yml \
            docker/evidence \
            docker/postgres/init \
            scripts

          ssh -i ~/.ssh/staging_deploy_key \
            -o StrictHostKeyChecking=accept-new \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "mkdir -p '$STAGING_DEPLOY_DIR'"

          scp -i ~/.ssh/staging_deploy_key \
            -o StrictHostKeyChecking=accept-new \
            /tmp/o-okul-staging-compose.tgz \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST:$STAGING_DEPLOY_DIR/compose.tgz"

          ssh -i ~/.ssh/staging_deploy_key \
            -o StrictHostKeyChecking=accept-new \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "tar -xzf '$STAGING_DEPLOY_DIR/compose.tgz' -C '$STAGING_DEPLOY_DIR' && rm -f '$STAGING_DEPLOY_DIR/compose.tgz'"

      - name: Deploy compose stack
        id: deploy-stack
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_DEPLOY_DIR: ${{ vars.STAGING_DEPLOY_DIR }}
          GHCR_READ_TOKEN: ${{ github.token }}
          IMAGE_PREFIX: ${{ needs.build-images.outputs.image-prefix }}
          IMAGE_TAG: ${{ needs.build-images.outputs.image-tag }}
          ROLLBACK_IMAGE_TAG: ${{ inputs.rollback_image_tag }}
          STAGING_EDGE_MODE: ${{ vars.STAGING_EDGE_MODE }}
        run: |
          set -euo pipefail

          for key in \
            STAGING_SSH_HOST \
            STAGING_SSH_USER \
            STAGING_DEPLOY_DIR \
            GHCR_READ_TOKEN \
            IMAGE_PREFIX \
            IMAGE_TAG
          do
            if [ -z "${!key:-}" ]; then
              echo "$key is required for staging deploy." >&2
              exit 1
            fi
          done

          if [ -z "${ROLLBACK_IMAGE_TAG:-}" ]; then
            ROLLBACK_IMAGE_TAG="$(ssh -i ~/.ssh/staging_deploy_key \
              -o StrictHostKeyChecking=accept-new \
              "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
              "cd '$STAGING_DEPLOY_DIR' && sed -n 's/^SENTRY_RELEASE=//p' .env.release 2>/dev/null | head -n 1")"
          fi
          if ! [[ "$ROLLBACK_IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "ROLLBACK_IMAGE_TAG must come from dispatch input or remote .env.release SENTRY_RELEASE." >&2
            exit 1
          fi
          echo "rollback-image-tag=$ROLLBACK_IMAGE_TAG" >> "$GITHUB_OUTPUT"

          printf '%s' "$GHCR_READ_TOKEN" | ssh -i ~/.ssh/staging_deploy_key \
            -o StrictHostKeyChecking=accept-new \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "umask 077 && cat > '$STAGING_DEPLOY_DIR/.ghcr_read_token'"

          ssh -i ~/.ssh/staging_deploy_key \
            -o StrictHostKeyChecking=accept-new \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "STAGING_DEPLOY_DIR='$STAGING_DEPLOY_DIR' \
             GITHUB_REPOSITORY='$GITHUB_REPOSITORY' \
             GITHUB_SHA='$GITHUB_SHA' \
             GITHUB_ACTOR='$GITHUB_ACTOR' \
             IMAGE_PREFIX='$IMAGE_PREFIX' \
             IMAGE_TAG='$IMAGE_TAG' \
             ROLLBACK_IMAGE_TAG='$ROLLBACK_IMAGE_TAG' \
             STAGING_EDGE_MODE='${STAGING_EDGE_MODE:-domain}' \
             bash -se" <<'REMOTE'
          set -euo pipefail

          if [ -z "${STAGING_DEPLOY_DIR:-}" ]; then
            echo "STAGING_DEPLOY_DIR is required" >&2
            exit 1
          fi

          case "${STAGING_EDGE_MODE:-domain}" in
            domain) EDGE_COMPOSE_FILE="docker-compose.traefik.yml" ;;
            ip) EDGE_COMPOSE_FILE="docker-compose.traefik-ip.yml" ;;
            *)
              echo "STAGING_EDGE_MODE must be either domain or ip." >&2
              exit 1
              ;;
          esac

          trap 'rm -f "$STAGING_DEPLOY_DIR/.ghcr_read_token"' EXIT
          cd "$STAGING_DEPLOY_DIR"
          trap 'rm -f .ghcr_read_token .env.release.next' EXIT

          release_env_file=".env.release.next"
          cat > "$release_env_file" <<EOF
          WEB_IMAGE=${IMAGE_PREFIX}/web:${IMAGE_TAG}
          API_IMAGE=${IMAGE_PREFIX}/api:${IMAGE_TAG}
          WORKER_IMAGE=${IMAGE_PREFIX}/worker:${IMAGE_TAG}
          QUEUE_BOARD_IMAGE=${IMAGE_PREFIX}/queue-board:${IMAGE_TAG}
          SENTRY_RELEASE=${IMAGE_TAG}
          ROLLBACK_IMAGE_TAG=${ROLLBACK_IMAGE_TAG}
          EOF

          if [ ! -s .ghcr_read_token ]; then
            echo "GHCR read token file is missing." >&2
            exit 1
          fi

          docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin < .ghcr_read_token

          current_release="$(sed -n 's/^SENTRY_RELEASE=//p' .env.release 2>/dev/null | head -n 1 || true)"

          prune_old_release_images() {
            docker image ls --format '{{.Repository}}:{{.Tag}}' | while read -r image; do
              case "$image" in
                "${IMAGE_PREFIX}/web:${IMAGE_TAG}"|"${IMAGE_PREFIX}/api:${IMAGE_TAG}"|"${IMAGE_PREFIX}/worker:${IMAGE_TAG}"|"${IMAGE_PREFIX}/queue-board:${IMAGE_TAG}") ;;
                "${IMAGE_PREFIX}/web:${current_release}"|"${IMAGE_PREFIX}/api:${current_release}"|"${IMAGE_PREFIX}/worker:${current_release}"|"${IMAGE_PREFIX}/queue-board:${current_release}") ;;
                "${IMAGE_PREFIX}/web:"*|"${IMAGE_PREFIX}/api:"*|"${IMAGE_PREFIX}/worker:"*|"${IMAGE_PREFIX}/queue-board:"*) docker image rm "$image" >/dev/null 2>&1 || true ;;
              esac
            done
            docker image prune -f >/dev/null
          }

          require_disk_space_mb() {
            local minimum_mb="$1"
            local available_kb
            available_kb="$(df -Pk . | awk 'NR == 2 { print $4 }')"
            if [ "$available_kb" -lt $((minimum_mb * 1024)) ]; then
              echo "At least ${minimum_mb}MB free disk is required before pulling release images." >&2
              df -h . >&2
              docker system df >&2
              exit 1
            fi
          }

          prune_old_release_images
          require_disk_space_mb 2048

          timeout 20m docker compose \
            --env-file .env \
            --env-file "$release_env_file" \
            -f docker-compose.yml \
            -f docker-compose.release.yml \
            -f "$EDGE_COMPOSE_FILE" \
            pull web api worker queue-board

          docker compose \
            --env-file .env \
            --env-file "$release_env_file" \
            -f docker-compose.yml \
            -f docker-compose.release.yml \
            -f "$EDGE_COMPOSE_FILE" \
            up -d postgres

          docker compose \
            --env-file .env \
            --env-file "$release_env_file" \
            -f docker-compose.yml \
            -f docker-compose.release.yml \
            -f "$EDGE_COMPOSE_FILE" \
            exec -T postgres sh /docker-entrypoint-initdb.d/003_bootstrap_secret_delivery_worker_role.sh < /dev/null

          docker compose \
            --env-file .env \
            --env-file "$release_env_file" \
            -f docker-compose.yml \
            -f docker-compose.release.yml \
            -f "$EDGE_COMPOSE_FILE" \
            run --rm -T api sh -lc 'cd packages/db && ./node_modules/.bin/prisma migrate deploy --config prisma.config.ts' < /dev/null

          mkdir -p artifacts/staging/reports

          # Account management preflight before legacy access cutover. Legacy login remains
          # authoritative until the additive migration is followed by a PASS parity artifact.
          # Account management backfill and parity gate before app start; any ambiguity blocks boot.
          docker compose \
            --env-file .env \
            --env-file "$release_env_file" \
            -f docker-compose.yml \
            -f docker-compose.release.yml \
            -f "$EDGE_COMPOSE_FILE" \
            run --rm -T \
            -v "$PWD/scripts:/app/scripts:ro" \
            -v "$PWD/artifacts:/app/artifacts" \
            -e STAGING_ENVIRONMENT=staging \
            -e ACCOUNT_MANAGEMENT_GUARDIAN_CLASSIFICATION \
            -e ACCOUNT_MANAGEMENT_GUARDIAN_EVIDENCE_REFERENCE \
            -e ACCOUNT_MANAGEMENT_PREFLIGHT_OUTPUT=artifacts/staging/reports/account-management-preflight.json \
            api node scripts/generate-account-management-preflight.mjs < /dev/null

          docker compose \
            --env-file .env \
            --env-file "$release_env_file" \
            -f docker-compose.yml \
            -f docker-compose.release.yml \
            -f "$EDGE_COMPOSE_FILE" \
            run --rm -T \
            -v "$PWD/scripts:/app/scripts:ro" \
            -v "$PWD/artifacts:/app/artifacts" \
            -e STAGING_ENVIRONMENT=staging \
            -e ACCOUNT_MANAGEMENT_BACKFILL_MODE=APPLY \
            -e ACCOUNT_MANAGEMENT_BACKFILL_CONFIRM=apply-pr4-backfill \
            -e ACCOUNT_MANAGEMENT_BACKFILL_OUTPUT=artifacts/staging/reports/account-management-backfill.json \
            api node scripts/backfill-account-management.mjs < /dev/null

          docker compose \
            --env-file .env \
            --env-file "$release_env_file" \
            -f docker-compose.yml \
            -f docker-compose.release.yml \
            -f "$EDGE_COMPOSE_FILE" \
            up -d --remove-orphans

          mv "$release_env_file" .env.release

          docker compose \
            --env-file .env \
            --env-file .env.release \
            -f docker-compose.yml \
            -f docker-compose.release.yml \
            -f "$EDGE_COMPOSE_FILE" \
            ps

          require_running_image() {
            local service="$1"
            local expected_image="$2"
            local container_id
            local actual_image
            local state
            local health
            local deadline=$((SECONDS + 180))

            while true; do
              container_id="$(docker compose \
                --env-file .env \
                --env-file .env.release \
                -f docker-compose.yml \
                -f docker-compose.release.yml \
                -f "$EDGE_COMPOSE_FILE" \
                ps -q "$service")"
              if [ -n "$container_id" ]; then
                actual_image="$(docker inspect -f '{{.Config.Image}}' "$container_id")"
                if [ "$actual_image" != "$expected_image" ]; then
                  echo "$service image drift: expected $expected_image, got $actual_image." >&2
                  exit 1
                fi

                state="$(docker inspect -f '{{.State.Status}}' "$container_id")"
                health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$container_id")"
                if [ "$state" = "running" ] && { [ -z "$health" ] || [ "$health" = "healthy" ]; }; then
                  return 0
                fi
              fi

              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "$service did not become running/healthy after deploy. state=${state:-missing} health=${health:-none}" >&2
                exit 1
              fi
              sleep 5
            done
          }

          require_running_image web "${IMAGE_PREFIX}/web:${IMAGE_TAG}"
          require_running_image api "${IMAGE_PREFIX}/api:${IMAGE_TAG}"
          require_running_image worker "${IMAGE_PREFIX}/worker:${IMAGE_TAG}"
          require_running_image queue-board "${IMAGE_PREFIX}/queue-board:${IMAGE_TAG}"
          REMOTE

  evidence:
    needs:
      - build-images
      - deploy
      - github-ci-evidence
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-images.outputs.deploy-sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: staging-github-ci-evidence-${{ needs.build-images.outputs.deploy-sha }}
          path: artifacts/staging/reports

      - name: Decode staging evidence env
        shell: bash
        env:
          STAGING_EVIDENCE_ENV_B64: ${{ secrets.STAGING_EVIDENCE_ENV_B64 }}
        run: |
          if [ -z "${STAGING_EVIDENCE_ENV_B64:-}" ]; then
            echo "STAGING_EVIDENCE_ENV_B64 is required." >&2
            exit 1
          fi
          printf '%s' "$STAGING_EVIDENCE_ENV_B64" | base64 -d > .staging-evidence.env
          test -s .staging-evidence.env

      - name: Check staging evidence env
        run: pnpm staging:evidence-env:check -- --env-file .staging-evidence.env

      - name: Configure SSH for evidence tunnels
        shell: bash
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/staging_deploy_key
          chmod 600 ~/.ssh/staging_deploy_key

      - name: Open staging data tunnels
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/staging_deploy_key \
            -fN \
            -o ExitOnForwardFailure=yes \
            -o StrictHostKeyChecking=accept-new \
            -L 127.0.0.1:15432:127.0.0.1:5432 \
            -L 127.0.0.1:16379:127.0.0.1:6379 \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST"

          node scripts/append-staging-evidence-tunnel-env.mjs \
            --env-file .staging-evidence.env \
            --postgres-port 15432 \
            --redis-port 16379

      - name: Check pre-deploy GitHub CI evidence
        shell: bash
        run: |
          GITHUB_CI_EVIDENCE_TARGET="file://$PWD/artifacts/staging/reports/github-ci.json" pnpm github-ci:check

      - name: Generate UI/UX redesign evidence
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_evidence == true }}
        shell: bash
        env:
          IMAGE_PREFIX: ${{ needs.build-images.outputs.image-prefix }}
          IMAGE_TAG: ${{ needs.build-images.outputs.image-tag }}
          SOURCE_COMMIT_SHA: ${{ needs.build-images.outputs.deploy-sha }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_CI_EVIDENCE_TARGET: file://${{ github.workspace }}/artifacts/staging/reports/github-ci.json
          UI_UX_REDESIGN_VERIFY_REMOTE_REFERENCES: "1"
        run: |
          if [ "$IMAGE_TAG" != "$SOURCE_COMMIT_SHA" ]; then
            echo "UI/UX release evidence requires the deployed image tag to equal the source commit SHA." >&2
            exit 1
          fi
          UI_UX_REDESIGN_EVIDENCE_OUTPUT="artifacts/staging/reports/ui-ux-redesign.json" \
          UI_UX_REDESIGN_RELEASE_CANDIDATE="${IMAGE_PREFIX}/api:${IMAGE_TAG}" \
          UI_UX_REDESIGN_SOURCE_COMMIT_SHA="$SOURCE_COMMIT_SHA" \
          UI_UX_REDESIGN_CHECKED_AT="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            pnpm ui-ux-redesign:evidence-generate -- --env-file .staging-evidence.env --environment staging

      - name: Bind local UI/UX completion to verified source
        shell: bash
        env:
          GITHUB_CI_EVIDENCE_TARGET: file://${{ github.workspace }}/artifacts/staging/reports/github-ci.json
          UI_UX_PROFESSIONALIZATION_SOURCE_SHA: ${{ needs.build-images.outputs.deploy-sha }}
        run: pnpm ui-ux-professionalization:completion:check -- --local-proof-only

      - name: Append release evidence metadata
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.build-images.outputs.image-tag }}
          ROLLBACK_IMAGE_TAG: ${{ needs.deploy.outputs.rollback-image-tag }}
        run: |
          {
            echo "SENTRY_RELEASE=$IMAGE_TAG"
            echo "ROLLBACK_IMAGE_TAG=$ROLLBACK_IMAGE_TAG"
            echo "GITHUB_CI_EVIDENCE_TARGET=file://$PWD/artifacts/staging/reports/github-ci.json"
            echo "PRODUCTION_EVIDENCE_SUMMARY_TARGET=file://$PWD/artifacts/staging/release-summary-${IMAGE_TAG}.json"
          } >> .staging-evidence.env

      - name: Append full UI/UX release evidence metadata
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_evidence == true }}
        shell: bash
        run: echo "UI_UX_REDESIGN_EVIDENCE_TARGET=file://$PWD/artifacts/staging/reports/ui-ux-redesign.json" >> .staging-evidence.env

      - name: Run first staging evidence gates
        shell: bash
        run: |
          pnpm staging:first-gates:smoke -- \
            --env-file .staging-evidence.env \
            --output-dir artifacts/staging/first-gates
          STAGING_FIRST_GATES_TARGET="file://$PWD/artifacts/staging/first-gates/first-gates-manifest.json" \
            pnpm staging:first-gates:check

      - name: Run secret delivery outbox staging smoke
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_evidence == true }}
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.build-images.outputs.image-tag }}
        run: |
          pnpm staging:evidence-env:check -- --env-file .staging-evidence.env --require-secret-delivery-outbox-smoke
          outbox_not_before="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          SECRET_DELIVERY_OUTBOX_SMOKE_EVIDENCE_FILE="artifacts/staging/smoke/secret-delivery-outbox.json" \
          SECRET_DELIVERY_OUTBOX_NOT_BEFORE="$outbox_not_before" \
          SECRET_DELIVERY_OUTBOX_RELEASE_IMAGE_TAG="$IMAGE_TAG" \
            node --env-file=.staging-evidence.env scripts/smoke-secret-delivery-outbox-staging.mjs
          SECRET_DELIVERY_OUTBOX_EVIDENCE_TARGET="file://$PWD/artifacts/staging/smoke/secret-delivery-outbox.json" \
          SECRET_DELIVERY_OUTBOX_NOT_BEFORE="$outbox_not_before" \
          SECRET_DELIVERY_OUTBOX_RELEASE_IMAGE_TAG="$IMAGE_TAG" \
            node --env-file=.staging-evidence.env scripts/check-secret-delivery-outbox-evidence.mjs
          {
            printf '%s\n' "SECRET_DELIVERY_OUTBOX_NOT_BEFORE=$outbox_not_before"
            printf '%s\n' "SECRET_DELIVERY_OUTBOX_RELEASE_IMAGE_TAG=$IMAGE_TAG"
          } >> .staging-evidence.env

      - name: Run staging-scoped evidence chain
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_evidence == true }}
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.build-images.outputs.image-tag }}
          GITHUB_TOKEN: ${{ github.token }}
          UI_UX_REDESIGN_VERIFY_REMOTE_REFERENCES: "1"
          PRODUCTION_EVIDENCE_ALLOW_STAGING_UI_UX: "1"
        run: |
          mkdir -p artifacts/staging
          pnpm prod:evidence:check -- \
            --env-file .staging-evidence.env \
            --summary-file "artifacts/staging/release-summary-${IMAGE_TAG}.json"

      - name: Check staging release artifact bundle
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_evidence == true }}
        shell: bash
        run: |
          STAGING_RELEASE_ARTIFACTS_TARGET="$PWD/artifacts/staging" \
            pnpm staging:release-artifacts:check

      - name: Bind live UI/UX completion to full evidence
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_evidence == true }}
        shell: bash
        env:
          GITHUB_CI_EVIDENCE_TARGET: file://${{ github.workspace }}/artifacts/staging/reports/github-ci.json
          GITHUB_TOKEN: ${{ github.token }}
          UI_UX_REDESIGN_EVIDENCE_TARGET: file://${{ github.workspace }}/artifacts/staging/reports/ui-ux-redesign.json
          UI_UX_PROFESSIONALIZATION_SOURCE_SHA: ${{ needs.build-images.outputs.deploy-sha }}
          UI_UX_PROFESSIONALIZATION_FULL_EVIDENCE: "1"
          UI_UX_REDESIGN_VERIFY_REMOTE_REFERENCES: "1"
        run: pnpm ui-ux-professionalization:completion:check

      - name: Cleanup staging evidence env
        if: always()
        shell: bash
        run: rm -f .staging-evidence.env

      - uses: actions/upload-artifact@v4
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.full_evidence != true) }}
        with:
          name: staging-activation-evidence-${{ needs.build-images.outputs.image-tag }}
          path: artifacts/staging
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.full_evidence == true }}
        with:
          name: staging-production-evidence-${{ needs.build-images.outputs.image-tag }}
          path: artifacts/staging
          if-no-files-found: ignore
