name: Staging Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional image tag; defaults to the commit SHA."
        required: false
        type: string
      rollback_image_tag:
        description: "Last known-good image tag for rollback evidence."
        required: true
        type: string
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: staging-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    outputs:
      deploy-required: ${{ steps.deploy-selection.outputs.deploy-required }}
      deploy-reason: ${{ steps.deploy-selection.outputs.deploy-reason }}
      deploy-sha: ${{ steps.deploy-selection.outputs.deploy-sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Select current runtime-affecting deploy
        id: deploy-selection
        shell: bash
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          ASSOCIATED_PR_BASE_SHA: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          deploy_required=true
          deploy_reason="manual dispatch"
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            latest_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}' || true)"
            if [ -z "$latest_main_sha" ]; then
              deploy_reason="current main SHA unavailable; fail-open"
            elif [ "$DEPLOY_SHA" != "$latest_main_sha" ]; then
              successful_runs="$RUNNER_TEMP/latest-main-successful-ci-runs.json"
              if curl --fail --silent --show-error \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=20" \
                > "$successful_runs" &&
                node -e 'const fs = require("node:fs"); const [file, sha] = process.argv.slice(1); const runs = JSON.parse(fs.readFileSync(file, "utf8")).workflow_runs ?? []; if (!runs.some((run) => run.head_sha === sha && run.conclusion === "success")) process.exit(1);' \
                  "$successful_runs" "$latest_main_sha"
              then
                deploy_required=false
                deploy_reason="newer CI-verified main SHA exists"
              else
                deploy_reason="newer main SHA is not CI-verified; fail-open"
              fi
            elif [ -n "$ASSOCIATED_PR_BASE_SHA" ] &&
              git merge-base --is-ancestor "$ASSOCIATED_PR_BASE_SHA" "$DEPLOY_SHA"
            then
              changed_files="$RUNNER_TEMP/staging-deploy-changed-files.txt"
              if git diff --name-only "$ASSOCIATED_PR_BASE_SHA" "$DEPLOY_SHA" > "$changed_files"; then
                if grep -Eq '^(apps/|packages/|docker/|infra/|scripts/|Dockerfile$|docker-compose[^/]*\.yml$|\.dockerignore$|\.github/workflows/staging-deploy\.yml$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|turbo\.json$|\.node-version$|tokens\.css$)' "$changed_files"; then
                  deploy_reason="runtime-affecting files changed"
                else
                  deploy_required=false
                  deploy_reason="no runtime-affecting files changed"
                fi
              else
                deploy_reason="change range unavailable; fail-open"
              fi
            else
              deploy_reason="associated PR range unavailable; fail-open"
            fi
          fi

          echo "deploy-required=$deploy_required" >> "$GITHUB_OUTPUT"
          echo "deploy-reason=$deploy_reason" >> "$GITHUB_OUTPUT"
          echo "deploy-sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"
          echo "### Staging deploy selection" >> "$GITHUB_STEP_SUMMARY"
          echo "- deploy SHA: \`$DEPLOY_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- required: \`$deploy_required\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- reason: $deploy_reason" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate staging dispatch inputs and environment
        if: steps.deploy-selection.outputs.deploy-required == 'true'
        shell: bash
        env:
          REQUESTED_IMAGE_TAG: ${{ inputs.image_tag }}
          ROLLBACK_IMAGE_TAG: ${{ inputs.rollback_image_tag }}
          STAGING_NEXT_PUBLIC_API_URL: ${{ vars.STAGING_NEXT_PUBLIC_API_URL }}
          STAGING_DEPLOY_DIR: ${{ vars.STAGING_DEPLOY_DIR }}
          STAGING_EDGE_MODE: ${{ vars.STAGING_EDGE_MODE }}
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          STAGING_EVIDENCE_ENV_B64: ${{ secrets.STAGING_EVIDENCE_ENV_B64 }}
        run: |
          set -euo pipefail

          for key in \
            STAGING_NEXT_PUBLIC_API_URL \
            STAGING_DEPLOY_DIR \
            STAGING_SSH_HOST \
            STAGING_SSH_USER \
            STAGING_SSH_PRIVATE_KEY \
            GHCR_READ_TOKEN \
            STAGING_EVIDENCE_ENV_B64
          do
            if [ -z "${!key:-}" ]; then
              echo "$key is required for staging deploy." >&2
              exit 1
            fi
          done

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -z "${ROLLBACK_IMAGE_TAG:-}" ]; then
            echo "ROLLBACK_IMAGE_TAG is required for manual staging deploy." >&2
            exit 1
          fi

          validate_tag() {
            local label="$1"
            local value="$2"
            if ! [[ "$value" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "$label must be a valid Docker tag." >&2
              exit 1
            fi
          }

          if [ -n "${REQUESTED_IMAGE_TAG:-}" ]; then
            validate_tag "image_tag" "$REQUESTED_IMAGE_TAG"
          fi
          if [ -n "${ROLLBACK_IMAGE_TAG:-}" ]; then
            validate_tag "rollback_image_tag" "$ROLLBACK_IMAGE_TAG"
          fi

          case "$STAGING_NEXT_PUBLIC_API_URL" in
            https://*) ;;
            *)
              echo "STAGING_NEXT_PUBLIC_API_URL must be an https:// URL." >&2
              exit 1
              ;;
          esac

          edge_mode="${STAGING_EDGE_MODE:-domain}"
          case "$edge_mode" in
            domain|ip) ;;
            *)
              echo "STAGING_EDGE_MODE must be either domain or ip." >&2
              exit 1
              ;;
          esac

          case "$STAGING_DEPLOY_DIR" in
            /*) ;;
            *)
              echo "STAGING_DEPLOY_DIR must be an absolute path." >&2
              exit 1
              ;;
          esac
          if [ "$STAGING_DEPLOY_DIR" = "/" ]; then
            echo "STAGING_DEPLOY_DIR must not be /." >&2
            exit 1
          fi
          if [ "$STAGING_DEPLOY_DIR" != "/root/o-okul" ]; then
            echo "STAGING_DEPLOY_DIR must be /root/o-okul." >&2
            exit 1
          fi
          if [[ "$STAGING_DEPLOY_DIR" == *"'"* || "$STAGING_DEPLOY_DIR" == *$'\n'* || "$STAGING_DEPLOY_DIR" == *$'\r'* ]]; then
            echo "STAGING_DEPLOY_DIR contains unsupported shell characters." >&2
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        if: steps.deploy-selection.outputs.deploy-required == 'true'
        with:
          version: 11.5.0
          run_install: false

      - uses: actions/setup-node@v4
        if: steps.deploy-selection.outputs.deploy-required == 'true'
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - if: steps.deploy-selection.outputs.deploy-required == 'true'
        run: pnpm install --frozen-lockfile

      - name: Check staging evidence env before deploy
        if: steps.deploy-selection.outputs.deploy-required == 'true'
        shell: bash
        env:
          STAGING_EVIDENCE_ENV_B64: ${{ secrets.STAGING_EVIDENCE_ENV_B64 }}
        run: |
          set -euo pipefail
          trap 'rm -f .staging-evidence.env' EXIT

          printf '%s' "$STAGING_EVIDENCE_ENV_B64" | base64 -d > .staging-evidence.env
          test -s .staging-evidence.env
          pnpm staging:evidence-env:check -- --mode activation --env-file .staging-evidence.env

  github-ci-evidence:
    needs: preflight
    if: needs.preflight.outputs.deploy-required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Generate GitHub CI evidence before deploy
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          mkdir -p artifacts/staging/reports
          GITHUB_CI_EVIDENCE_OUTPUT="artifacts/staging/reports/github-ci.json" pnpm github-ci:generate
          GITHUB_CI_EVIDENCE_TARGET="file://$PWD/artifacts/staging/reports/github-ci.json" pnpm github-ci:check

      - uses: actions/upload-artifact@v4
        with:
          name: staging-github-ci-evidence-${{ github.event.workflow_run.head_sha || github.sha }}
          path: artifacts/staging/reports/github-ci.json

  build-images:
    needs: github-ci-evidence
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 75
    outputs:
      image-prefix: ${{ steps.meta.outputs.image-prefix }}
      image-tag: ${{ steps.meta.outputs.image-tag }}
      deploy-sha: ${{ steps.meta.outputs.deploy-sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - id: meta
        shell: bash
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          REQUESTED_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          tag="$REQUESTED_IMAGE_TAG"
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            tag="$DEPLOY_SHA"
          fi
          if [ -z "$tag" ]; then
            tag="$DEPLOY_SHA"
          fi
          repository="$(echo "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "image-tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image-prefix=$repository" >> "$GITHUB_OUTPUT"
          echo "deploy-sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Build and push web image
        shell: bash
        env:
          IMAGE_PREFIX: ${{ steps.meta.outputs.image-prefix }}
          IMAGE_TAG: ${{ steps.meta.outputs.image-tag }}
          NEXT_PUBLIC_API_URL: ${{ vars.STAGING_NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SMS_ENABLED: "false"
        run: |
          docker buildx build \
            --push \
            --cache-from type=gha,scope=web \
            --cache-to type=gha,mode=max,scope=web \
            --target web \
            --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
            --build-arg NEXT_PUBLIC_SMS_ENABLED="$NEXT_PUBLIC_SMS_ENABLED" \
            --tag "$IMAGE_PREFIX/web:$IMAGE_TAG" \
            --tag "$IMAGE_PREFIX/web:staging-latest" \
            .

      - name: Build and push api image
        shell: bash
        env:
          IMAGE_PREFIX: ${{ steps.meta.outputs.image-prefix }}
          IMAGE_TAG: ${{ steps.meta.outputs.image-tag }}
          NEXT_PUBLIC_API_URL: ${{ vars.STAGING_NEXT_PUBLIC_API_URL }}
        run: |
          docker buildx build \
            --push \
            --cache-from type=gha,scope=api \
            --cache-to type=gha,mode=max,scope=api \
            --target api \
            --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
            --tag "$IMAGE_PREFIX/api:$IMAGE_TAG" \
            --tag "$IMAGE_PREFIX/api:staging-latest" \
            .

      - name: Build and push worker image
        shell: bash
        env:
          IMAGE_PREFIX: ${{ steps.meta.outputs.image-prefix }}
          IMAGE_TAG: ${{ steps.meta.outputs.image-tag }}
          NEXT_PUBLIC_API_URL: ${{ vars.STAGING_NEXT_PUBLIC_API_URL }}
        run: |
          docker buildx build \
            --push \
            --cache-from type=gha,scope=worker \
            --cache-to type=gha,mode=max,scope=worker \
            --target worker \
            --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
            --tag "$IMAGE_PREFIX/worker:$IMAGE_TAG" \
            --tag "$IMAGE_PREFIX/worker:staging-latest" \
            .

      - name: Build and push queue-board image
        shell: bash
        env:
          IMAGE_PREFIX: ${{ steps.meta.outputs.image-prefix }}
          IMAGE_TAG: ${{ steps.meta.outputs.image-tag }}
        run: |
          docker buildx build \
            --push \
            --cache-from type=gha,scope=queue-board \
            --cache-to type=gha,mode=max,scope=queue-board \
            --target queue-board \
            --tag "$IMAGE_PREFIX/queue-board:$IMAGE_TAG" \
            --tag "$IMAGE_PREFIX/queue-board:staging-latest" \
            .

  deploy:
    needs: build-images
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 25
    outputs:
      rollback-image-tag: ${{ steps.deploy-stack.outputs.rollback-image-tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-images.outputs.deploy-sha }}

      - name: Configure SSH
        shell: bash
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/staging_deploy_key
          chmod 600 ~/.ssh/staging_deploy_key

      - name: Upload compose bundle
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_DEPLOY_DIR: ${{ vars.STAGING_DEPLOY_DIR }}
          STAGING_EVIDENCE_ENV_B64: ${{ secrets.STAGING_EVIDENCE_ENV_B64 }}
        run: |
          set -euo pipefail

          alertmanager_secret_stage="$RUNNER_TEMP/alertmanager-secrets"
          alertmanager_secret_archive="$RUNNER_TEMP/alertmanager-secrets.tgz"
          keep_alertmanager_secret_archive=0
          cleanup_upload() {
            local status=$?
            rm -rf "$alertmanager_secret_stage" /tmp/o-okul-staging-compose.tgz
            if [ "$keep_alertmanager_secret_archive" -ne 1 ]; then
              rm -f "$alertmanager_secret_archive"
            fi
            exit "$status"
          }
          trap cleanup_upload EXIT
          install -d -m 700 "$alertmanager_secret_stage"
          node - "$alertmanager_secret_stage" <<'NODE'
          const { writeFileSync } = require("node:fs");
          const outputDir = process.argv[2];
          const contents = Buffer.from(process.env.STAGING_EVIDENCE_ENV_B64 ?? "", "base64").toString("utf8");
          const values = new Map();
          for (const line of contents.split(/\r?\n/)) {
            const trimmed = line.trim();
            if (!trimmed || trimmed.startsWith("#")) continue;
            const separator = trimmed.indexOf("=");
            if (separator < 1) throw new Error("Invalid staging evidence env entry.");
            const key = trimmed.slice(0, separator).trim();
            const value = trimmed.slice(separator + 1).replace(/^["']|["']$/g, "");
            if (values.has(key)) throw new Error(`Duplicate staging evidence env key: ${key}`);
            values.set(key, value);
          }
          let url;
          try {
            url = new URL(values.get("ALERT_WEBHOOK_URL") ?? "");
          } catch {
            throw new Error("ALERT_WEBHOOK_URL must be a valid credential-free HTTPS URL.");
          }
          const token = values.get("ALERT_WEBHOOK_TOKEN") ?? "";
          if (url.protocol !== "https:" || url.username || url.password || url.search || url.hash) {
            throw new Error("ALERT_WEBHOOK_URL must be a credential-free HTTPS URL.");
          }
          if (token.length < 32 || /[\r\n]/.test(token)) {
            throw new Error("ALERT_WEBHOOK_TOKEN must be a single-line secret of at least 32 characters.");
          }
          writeFileSync(`${outputDir}/webhook-url`, url.href, { mode: 0o600 });
          writeFileSync(`${outputDir}/webhook-token`, token, { mode: 0o600 });
          NODE
          tar -C "$alertmanager_secret_stage" -czf "$alertmanager_secret_archive" webhook-url webhook-token

          tar -czf /tmp/o-okul-staging-compose.tgz \
            docker-compose.yml \
            docker-compose.release.yml \
            docker-compose.rate-limit-shard.yml \
            docker-compose.traefik.yml \
            docker-compose.traefik-ip.yml \
            docker-compose.observability.yml \
            docker/alertmanager \
            docker/alloy \
            docker/evidence \
            docker/grafana \
            docker/loki \
            docker/postgres/init \
            docker/prometheus \
            docs/evidence-manifests \
            scripts

          ssh -i ~/.ssh/staging_deploy_key \
            -o StrictHostKeyChecking=accept-new \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "mkdir -p '$STAGING_DEPLOY_DIR'"

          scp -i ~/.ssh/staging_deploy_key \
            -o StrictHostKeyChecking=accept-new \
            /tmp/o-okul-staging-compose.tgz \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST:$STAGING_DEPLOY_DIR/compose.tgz"

          ssh -i ~/.ssh/staging_deploy_key \
            -o StrictHostKeyChecking=accept-new \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "tar -xzf '$STAGING_DEPLOY_DIR/compose.tgz' -C '$STAGING_DEPLOY_DIR' && rm -f '$STAGING_DEPLOY_DIR/compose.tgz'"

          keep_alertmanager_secret_archive=1

      - name: Deploy compose stack
        id: deploy-stack
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_DEPLOY_DIR: ${{ vars.STAGING_DEPLOY_DIR }}
          GHCR_READ_TOKEN: ${{ github.token }}
          IMAGE_PREFIX: ${{ needs.build-images.outputs.image-prefix }}
          IMAGE_TAG: ${{ needs.build-images.outputs.image-tag }}
          ROLLBACK_IMAGE_TAG: ${{ inputs.rollback_image_tag }}
          STAGING_EDGE_MODE: ${{ vars.STAGING_EDGE_MODE }}
        run: |
          set -euo pipefail

          alertmanager_secret_archive="$RUNNER_TEMP/alertmanager-secrets.tgz"
          remote_secret_archive_uploaded=0
          cleanup_deploy() {
            local status=$?
            rm -f "$alertmanager_secret_archive"
            if [ "$remote_secret_archive_uploaded" -eq 1 ] \
              && [ -n "${STAGING_SSH_HOST:-}" ] \
              && [ -n "${STAGING_SSH_USER:-}" ] \
              && [ -n "${STAGING_DEPLOY_DIR:-}" ]; then
              ssh -i ~/.ssh/staging_deploy_key \
                -o StrictHostKeyChecking=accept-new \
                "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
                "rm -f '$STAGING_DEPLOY_DIR/.alertmanager-secrets.tgz' '$STAGING_DEPLOY_DIR/.ghcr_read_token'" \
                >/dev/null 2>&1 || true
            fi
            exit "$status"
          }
          trap cleanup_deploy EXIT

          for key in \
            STAGING_SSH_HOST \
            STAGING_SSH_USER \
            STAGING_DEPLOY_DIR \
            GHCR_READ_TOKEN \
            IMAGE_PREFIX \
            IMAGE_TAG
          do
            if [ -z "${!key:-}" ]; then
              echo "$key is required for staging deploy." >&2
              exit 1
            fi
          done

          if [ ! -f "$alertmanager_secret_archive" ] \
            || [ -L "$alertmanager_secret_archive" ] \
            || [ ! -s "$alertmanager_secret_archive" ]; then
            echo "Alertmanager secret archive is missing or unsafe." >&2
            exit 1
          fi

          ssh -i ~/.ssh/staging_deploy_key \
            -o StrictHostKeyChecking=accept-new \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "umask 077 && cat > '$STAGING_DEPLOY_DIR/.alertmanager-secrets.tgz'" \
            < "$alertmanager_secret_archive"
          remote_secret_archive_uploaded=1

          if [ -z "${ROLLBACK_IMAGE_TAG:-}" ]; then
            ROLLBACK_IMAGE_TAG="$(ssh -i ~/.ssh/staging_deploy_key \
              -o StrictHostKeyChecking=accept-new \
              "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
              "cd '$STAGING_DEPLOY_DIR' && sed -n 's/^SENTRY_RELEASE=//p' .env.release 2>/dev/null | head -n 1")"
          fi
          if ! [[ "$ROLLBACK_IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "ROLLBACK_IMAGE_TAG must come from dispatch input or remote .env.release SENTRY_RELEASE." >&2
            exit 1
          fi
          echo "rollback-image-tag=$ROLLBACK_IMAGE_TAG" >> "$GITHUB_OUTPUT"

          printf '%s' "$GHCR_READ_TOKEN" | ssh -i ~/.ssh/staging_deploy_key \
            -o StrictHostKeyChecking=accept-new \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "umask 077 && cat > '$STAGING_DEPLOY_DIR/.ghcr_read_token'"

          ssh -i ~/.ssh/staging_deploy_key \
            -o StrictHostKeyChecking=accept-new \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "STAGING_DEPLOY_DIR='$STAGING_DEPLOY_DIR' \
             GITHUB_REPOSITORY='$GITHUB_REPOSITORY' \
             GITHUB_SHA='$GITHUB_SHA' \
             GITHUB_ACTOR='$GITHUB_ACTOR' \
             IMAGE_PREFIX='$IMAGE_PREFIX' \
             IMAGE_TAG='$IMAGE_TAG' \
             ROLLBACK_IMAGE_TAG='$ROLLBACK_IMAGE_TAG' \
             GITHUB_RUN_ID='$GITHUB_RUN_ID' \
             STAGING_EDGE_MODE='${STAGING_EDGE_MODE:-domain}' \
             bash -se" <<'REMOTE'
          set -euo pipefail

          if [ -z "${STAGING_DEPLOY_DIR:-}" ]; then
            echo "STAGING_DEPLOY_DIR is required" >&2
            exit 1
          fi

          case "${STAGING_EDGE_MODE:-domain}" in
            domain) EDGE_COMPOSE_FILE="docker-compose.traefik.yml" ;;
            ip) EDGE_COMPOSE_FILE="docker-compose.traefik-ip.yml" ;;
            *)
              echo "STAGING_EDGE_MODE must be either domain or ip." >&2
              exit 1
              ;;
          esac

          trap 'rm -f "$STAGING_DEPLOY_DIR/.ghcr_read_token"' EXIT
          cd "$STAGING_DEPLOY_DIR"
          trap 'rm -f .ghcr_read_token .env.release.next .alertmanager-secrets.tgz' EXIT

          alertmanager_private_root="$(dirname "$STAGING_DEPLOY_DIR")/o-okul-private/alertmanager"
          alertmanager_secrets_dir="$alertmanager_private_root/${IMAGE_TAG}-${GITHUB_RUN_ID}"
          install -d -m 700 -o 0 -g 0 "$alertmanager_private_root"
          install -d -m 700 -o 0 -g 0 "$alertmanager_secrets_dir"
          if [ -L "$alertmanager_private_root" ] || [ -L "$alertmanager_secrets_dir" ] \
            || [ "$(realpath -e "$alertmanager_private_root")" != "$alertmanager_private_root" ] \
            || [ "$(realpath -e "$alertmanager_secrets_dir")" != "$alertmanager_secrets_dir" ]; then
            echo "Alertmanager secret directories must not be symlinks." >&2
            exit 1
          fi
          tar -xzf .alertmanager-secrets.tgz -C "$alertmanager_secrets_dir"
          for secret_file in webhook-url webhook-token; do
            secret_path="$alertmanager_secrets_dir/$secret_file"
            if [ ! -f "$secret_path" ] || [ -L "$secret_path" ] || [ ! -s "$secret_path" ]; then
              echo "Alertmanager secret file is missing or unsafe: $secret_file" >&2
              exit 1
            fi
            chown 0:0 "$secret_path"
            chmod 600 "$secret_path"
            if [ "$(stat -c '%a:%u:%g' "$secret_path")" != "600:0:0" ]; then
              echo "Alertmanager secret file ownership or mode is unsafe: $secret_file" >&2
              exit 1
            fi
          done

          release_env_file=".env.release.next"
          cat > "$release_env_file" <<EOF
          WEB_IMAGE=${IMAGE_PREFIX}/web:${IMAGE_TAG}
          API_IMAGE=${IMAGE_PREFIX}/api:${IMAGE_TAG}
          WORKER_IMAGE=${IMAGE_PREFIX}/worker:${IMAGE_TAG}
          QUEUE_BOARD_IMAGE=${IMAGE_PREFIX}/queue-board:${IMAGE_TAG}
          ALERTMANAGER_SECRETS_DIR=${alertmanager_secrets_dir}
          SENTRY_RELEASE=${IMAGE_TAG}
          ROLLBACK_IMAGE_TAG=${ROLLBACK_IMAGE_TAG}
          EOF

          if [ ! -s .ghcr_read_token ]; then
            echo "GHCR read token file is missing." >&2
            exit 1
          fi

          docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin < .ghcr_read_token

          current_release="$(sed -n 's/^SENTRY_RELEASE=//p' .env.release 2>/dev/null | head -n 1 || true)"

          prune_old_release_images() {
            docker image ls --format '{{.Repository}}:{{.Tag}}' | while read -r image; do
              case "$image" in
                "${IMAGE_PREFIX}/web:${IMAGE_TAG}"|"${IMAGE_PREFIX}/api:${IMAGE_TAG}"|"${IMAGE_PREFIX}/worker:${IMAGE_TAG}"|"${IMAGE_PREFIX}/queue-board:${IMAGE_TAG}") ;;
                "${IMAGE_PREFIX}/web:${current_release}"|"${IMAGE_PREFIX}/api:${current_release}"|"${IMAGE_PREFIX}/worker:${current_release}"|"${IMAGE_PREFIX}/queue-board:${current_release}") ;;
                "${IMAGE_PREFIX}/web:"*|"${IMAGE_PREFIX}/api:"*|"${IMAGE_PREFIX}/worker:"*|"${IMAGE_PREFIX}/queue-board:"*) docker image rm "$image" >/dev/null 2>&1 || true ;;
              esac
            done
            docker image prune -f >/dev/null
          }

          require_disk_space_mb() {
            local minimum_mb="$1"
            local available_kb
            available_kb="$(df -Pk . | awk 'NR == 2 { print $4 }')"
            if [ "$available_kb" -lt $((minimum_mb * 1024)) ]; then
              echo "At least ${minimum_mb}MB free disk is required before pulling release images." >&2
              df -h . >&2
              docker system df >&2
              exit 1
            fi
          }

          prune_old_release_images
          require_disk_space_mb 2048

          timeout 20m docker compose \
            --env-file .env \
            --env-file "$release_env_file" \
            -f docker-compose.yml \
            -f docker-compose.release.yml \
            -f "$EDGE_COMPOSE_FILE" \
            -f docker-compose.observability.yml \
            config --quiet

          timeout 20m docker compose \
            --env-file .env \
            --env-file "$release_env_file" \
            -f docker-compose.yml \
            -f docker-compose.release.yml \
            -f "$EDGE_COMPOSE_FILE" \
            -f docker-compose.observability.yml \
            pull web api worker queue-board alertmanager-secrets-init alertmanager prometheus loki alloy grafana

          docker compose \
            --env-file .env \
            --env-file "$release_env_file" \
            -f docker-compose.yml \
            -f docker-compose.release.yml \
            -f "$EDGE_COMPOSE_FILE" \
            up -d postgres

          docker compose \
            --env-file .env \
            --env-file "$release_env_file" \
            -f docker-compose.yml \
            -f docker-compose.release.yml \
            -f "$EDGE_COMPOSE_FILE" \
            exec -T postgres sh /docker-entrypoint-initdb.d/004_bootstrap_required_extensions.sh < /dev/null

          docker compose \
            --env-file .env \
            --env-file "$release_env_file" \
            -f docker-compose.yml \
            -f docker-compose.release.yml \
            -f "$EDGE_COMPOSE_FILE" \
            exec -T postgres sh /docker-entrypoint-initdb.d/003_bootstrap_secret_delivery_worker_role.sh < /dev/null

          backend_compose=(
            env API_PROXY_IP="${PRE_CUTOVER_API_PROXY_IP:-172.31.255.6}"
            docker compose
            --env-file .env
            --env-file "$release_env_file"
            -f docker-compose.yml
            -f docker-compose.release.yml
          )

          owner_decisions_args=()
          owner_decisions_file="$(dirname "$STAGING_DEPLOY_DIR")/o-okul-private/account-management/$IMAGE_TAG/owner-decisions.json"
          if [ -e "$owner_decisions_file" ] || [ -L "$owner_decisions_file" ]; then
            if [ ! -f "$owner_decisions_file" ] || [ -L "$owner_decisions_file" ] \
              || [ "$(realpath -e "$owner_decisions_file")" != "$owner_decisions_file" ] \
              || [ "$(stat -c '%a' "$owner_decisions_file")" != "600" ] \
              || [ "$(stat -c '%u' "$owner_decisions_file")" != "$(id -u)" ]; then
              echo "Release-scoped account owner decisions must be a non-symlink 0600 file owned by the deploy user." >&2
              exit 1
            fi
            owner_decisions_args=(
              -v "$owner_decisions_file:/run/private/account-management-owner-decisions.json:ro"
              -e ACCOUNT_MANAGEMENT_OWNER_DECISIONS_TARGET=file:///run/private/account-management-owner-decisions.json
            )
          fi

          "${backend_compose[@]}" run --rm --no-deps -T api sh -lc 'cd packages/db && ./node_modules/.bin/prisma migrate deploy --config prisma.config.ts' < /dev/null

          mkdir -p artifacts/staging/reports

          # Account management preflight before legacy access cutover. Legacy login remains
          # authoritative until the additive migration is followed by a PASS parity artifact.
          # Account management backfill and parity gate before app start; any ambiguity blocks boot.
          "${backend_compose[@]}" run --rm --no-deps -T \
            -v "$PWD/scripts:/app/scripts:ro" \
            -v "$PWD/artifacts:/app/artifacts" \
            -e STAGING_ENVIRONMENT=staging \
            -e ACCOUNT_MANAGEMENT_GUARDIAN_CLASSIFICATION \
            -e ACCOUNT_MANAGEMENT_GUARDIAN_EVIDENCE_REFERENCE \
            -e ACCOUNT_MANAGEMENT_PREFLIGHT_OUTPUT=artifacts/staging/reports/account-management-preflight.json \
            api node scripts/generate-account-management-preflight.mjs < /dev/null

          "${backend_compose[@]}" run --rm --no-deps -T \
            -v "$PWD/scripts:/app/scripts:ro" \
            -v "$PWD/artifacts:/app/artifacts" \
            "${owner_decisions_args[@]}" \
            -e STAGING_ENVIRONMENT=staging \
            -e ACCOUNT_MANAGEMENT_BACKFILL_MODE=APPLY \
            -e ACCOUNT_MANAGEMENT_BACKFILL_CONFIRM=apply-pr4-backfill \
            -e ACCOUNT_MANAGEMENT_BACKFILL_OUTPUT=artifacts/staging/reports/account-management-backfill.json \
            api node scripts/backfill-account-management.mjs < /dev/null

          docker compose \
            --env-file .env \
            --env-file "$release_env_file" \
            -f docker-compose.yml \
            -f docker-compose.release.yml \
            -f "$EDGE_COMPOSE_FILE" \
            -f docker-compose.observability.yml \
            up -d --remove-orphans

          mv "$release_env_file" .env.release

          docker compose \
            --env-file .env \
            --env-file .env.release \
            -f docker-compose.yml \
            -f docker-compose.release.yml \
            -f "$EDGE_COMPOSE_FILE" \
            -f docker-compose.observability.yml \
            ps

          require_running_image() {
            local service="$1"
            local expected_image="$2"
            local container_id
            local actual_image
            local state
            local health
            local deadline=$((SECONDS + 180))

            while true; do
              container_id="$(docker compose \
                --env-file .env \
                --env-file .env.release \
                -f docker-compose.yml \
                -f docker-compose.release.yml \
                -f "$EDGE_COMPOSE_FILE" \
                -f docker-compose.observability.yml \
                ps -q "$service")"
              if [ -n "$container_id" ]; then
                actual_image="$(docker inspect -f '{{.Config.Image}}' "$container_id")"
                if [ "$actual_image" != "$expected_image" ]; then
                  echo "$service image drift: expected $expected_image, got $actual_image." >&2
                  exit 1
                fi

                state="$(docker inspect -f '{{.State.Status}}' "$container_id")"
                health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$container_id")"
                if [ "$state" = "running" ] && { [ -z "$health" ] || [ "$health" = "healthy" ]; }; then
                  return 0
                fi
              fi

              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "$service did not become running/healthy after deploy. state=${state:-missing} health=${health:-none}" >&2
                exit 1
              fi
              sleep 5
            done
          }

          require_running_image web "${IMAGE_PREFIX}/web:${IMAGE_TAG}"
          require_running_image api "${IMAGE_PREFIX}/api:${IMAGE_TAG}"
          require_running_image worker "${IMAGE_PREFIX}/worker:${IMAGE_TAG}"
          require_running_image queue-board "${IMAGE_PREFIX}/queue-board:${IMAGE_TAG}"
          require_running_image alertmanager "prom/alertmanager:v0.28.1"
          require_running_image prometheus "prom/prometheus:v2.55.1"
          require_running_image loki "grafana/loki:3.4.2"
          require_running_image alloy "grafana/alloy:v1.16.0"
          require_running_image grafana "grafana/grafana:11.5.2"

          prune_old_alertmanager_secret_dirs() {
            local private_root="$1"
            local current_dir="$2"
            local candidate
            local candidate_name

            if [ "$(dirname "$current_dir")" != "$private_root" ] \
              || [ "$(realpath -e "$private_root")" != "$private_root" ] \
              || [ "$(realpath -e "$current_dir")" != "$current_dir" ]; then
              echo "Alertmanager secret cleanup boundary is unsafe." >&2
              exit 1
            fi

            while IFS= read -r -d '' candidate; do
              if [ "$candidate" = "$current_dir" ]; then
                continue
              fi
              candidate_name="$(basename "$candidate")"
              if [ -L "$candidate" ] \
                || [ "$(dirname "$candidate")" != "$private_root" ] \
                || [ "$(realpath -e "$candidate")" != "$candidate" ] \
                || ! [[ "$candidate_name" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}-[0-9]+$ ]]; then
                echo "Skipping unrecognized Alertmanager secret directory: $candidate_name" >&2
                continue
              fi
              find "$candidate" -xdev -depth -delete
            done < <(find "$private_root" -mindepth 1 -maxdepth 1 -type d -print0)
          }

          # Cleanup runs only after Alertmanager is healthy and every runtime image check passes.
          prune_old_alertmanager_secret_dirs "$alertmanager_private_root" "$alertmanager_secrets_dir"
          REMOTE

  evidence:
    needs:
      - build-images
      - deploy
      - github-ci-evidence
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-images.outputs.deploy-sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: staging-github-ci-evidence-${{ needs.build-images.outputs.deploy-sha }}
          path: artifacts/staging/reports

      - name: Decode staging evidence env
        shell: bash
        env:
          STAGING_EVIDENCE_ENV_B64: ${{ secrets.STAGING_EVIDENCE_ENV_B64 }}
        run: |
          if [ -z "${STAGING_EVIDENCE_ENV_B64:-}" ]; then
            echo "STAGING_EVIDENCE_ENV_B64 is required." >&2
            exit 1
          fi
          printf '%s' "$STAGING_EVIDENCE_ENV_B64" | base64 -d > .staging-evidence.env
          chmod 600 .staging-evidence.env
          test -s .staging-evidence.env

      - name: Rebind staging activation origin
        shell: bash
        env:
          STAGING_NEXT_PUBLIC_API_URL: ${{ vars.STAGING_NEXT_PUBLIC_API_URL }}
        run: |
          public_origin=$(node -p 'new URL(process.argv[1]).origin' "$STAGING_NEXT_PUBLIC_API_URL")
          sed -i -E \
            -e "s#^(APP_URL|API_URL|WEB_URL)=.*#\\1=$public_origin#" \
            -e "s#^TRAEFIK_HTTPS_SMOKE_URL=.*#TRAEFIK_HTTPS_SMOKE_URL=$public_origin/health#" \
            .staging-evidence.env

      - name: Check staging evidence env
        run: pnpm staging:evidence-env:check -- --mode activation --env-file .staging-evidence.env

      - name: Check pre-deploy GitHub CI evidence
        shell: bash
        run: |
          GITHUB_CI_EVIDENCE_TARGET="file://$PWD/artifacts/staging/reports/github-ci.json" pnpm github-ci:check

      - name: Configure SSH for WAL evidence
        shell: bash
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/staging_wal_key
          chmod 600 ~/.ssh/staging_wal_key
          {
            echo "Host *"
            echo "  IdentityFile ~/.ssh/staging_wal_key"
            echo "  StrictHostKeyChecking accept-new"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Run WAL archive staging smoke
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_ENVIRONMENT: staging
          WAL_ARCHIVE_SMOKE_EVIDENCE_FILE: artifacts/staging/smoke/wal-archive.json
        run: |
          set -euo pipefail
          mkdir -p artifacts/staging/smoke
          export DOCKER_HOST="ssh://$STAGING_SSH_USER@$STAGING_SSH_HOST"
          export COMPOSE_PROJECT_NAME=o-okul
          export COMPOSE_ENV_FILES="$PWD/.staging-evidence.env"
          pnpm wal:archive:smoke -- --env-file .staging-evidence.env

      - name: Bind local UI/UX completion to verified source
        shell: bash
        env:
          GITHUB_CI_EVIDENCE_TARGET: file://${{ github.workspace }}/artifacts/staging/reports/github-ci.json
          UI_UX_PROFESSIONALIZATION_SOURCE_SHA: ${{ needs.build-images.outputs.deploy-sha }}
        run: pnpm ui-ux-professionalization:completion:check -- --local-proof-only

      - name: Append release evidence metadata
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.build-images.outputs.image-tag }}
          ROLLBACK_IMAGE_TAG: ${{ needs.deploy.outputs.rollback-image-tag }}
        run: |
          {
            echo "SENTRY_RELEASE=$IMAGE_TAG"
            echo "ROLLBACK_IMAGE_TAG=$ROLLBACK_IMAGE_TAG"
            echo "GITHUB_CI_EVIDENCE_TARGET=file://$PWD/artifacts/staging/reports/github-ci.json"
            echo "PRODUCTION_EVIDENCE_SUMMARY_TARGET=file://$PWD/artifacts/staging/release-summary-${IMAGE_TAG}.json"
          } >> .staging-evidence.env

      - name: Run first staging evidence gates
        shell: bash
        run: |
          pnpm staging:first-gates:smoke -- \
            --env-file .staging-evidence.env \
            --output-dir artifacts/staging/first-gates
          STAGING_FIRST_GATES_TARGET="file://$PWD/artifacts/staging/first-gates/first-gates-manifest.json" \
            pnpm staging:first-gates:check

      - name: Generate deployment cutover artifact
        shell: bash
        env:
          DEPLOYMENT_CUTOVER_EVIDENCE_FILE: artifacts/staging/reports/deployment-cutover.json
          DEPLOYMENT_CUTOVER_SOURCE_SHA: ${{ needs.build-images.outputs.deploy-sha }}
          DEPLOYMENT_CUTOVER_RELEASE_IMAGE_TAG: ${{ needs.build-images.outputs.image-tag }}
          DEPLOYMENT_CUTOVER_IMAGE_PREFIX: ${{ needs.build-images.outputs.image-prefix }}
        run: node scripts/generate-deployment-cutover-evidence.mjs

      - name: Cleanup staging evidence env
        if: always()
        shell: bash
        run: rm -f .staging-evidence.env ~/.ssh/staging_wal_key ~/.ssh/config

      - uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: staging-deployment-cutover-${{ github.run_id }}
          path: artifacts/staging/reports/deployment-cutover.json
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: staging-activation-evidence-${{ needs.build-images.outputs.image-tag }}
          path: artifacts/staging
          if-no-files-found: ignore
