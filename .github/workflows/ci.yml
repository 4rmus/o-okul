name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Only pull requests cancel their superseded runs; every main push keeps its own CI evidence (2026-11-01).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Docs-only pull requests run the light doc checks instead of the full suite (2026-10-12, UAT batching).
  # Pushes to main always run the full suite so deploy evidence stays complete.
  # Draft pull requests skip CI entirely; marking the PR ready for review triggers the full run (2026-10-13).
  changes:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          code=true
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ -n "${BASE_SHA:-}" ]; then
            changed="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")"
            non_docs="$(printf '%s\n' "$changed" | grep -Ev '^(docs/|status\.md$|README\.md$|PLAN\.md$)' | grep -v '^$' || true)"
            pinned_docs="$(printf '%s\n' "$changed" | grep -E '^docs/(evidence-manifests|measurement-baselines)/' || true)"
            if [ -n "$changed" ] && [ -z "$non_docs" ] && [ -z "$pinned_docs" ]; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "full CI required: $code" >> "$GITHUB_STEP_SUMMARY"

  docs-check:
    needs: changes
    if: needs.changes.outputs.code != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm ops:check
      - run: pnpm prod:plan:check
      - run: pnpm prod:readiness:check
      - run: pnpm prod:evidence:templates:check
      - run: pnpm privacy:sample-pii:check
      - run: pnpm agents:check

  # `pnpm run ci` stays one flat chain for local parity; CI runs it as parallel partitions (scripts/ci-partitions.mjs)
  # and scripts/check-ci-partitions.mjs keeps their union equal to the chain (2026-10-27).
  verify-static:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-static-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-static-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - run: pnpm install --frozen-lockfile
      - name: pnpm ci:static
        run: pnpm ci:static

  verify-unit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-unit-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-unit-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - run: pnpm install --frozen-lockfile
      - name: pnpm ci:unit
        run: pnpm ci:unit

  verify-e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Playwright 1.60 (lockfile) cannot install browser deps on ubuntu-latest = 26.04; pin until Playwright supports it.
    # Stays on the host runner: the tracked *-linux screenshot goldens were rendered with this runner's fonts.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        partition: [contract, visual]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @o-okul/web exec playwright install --with-deps chromium
      - name: pnpm ci:e2e:${{ matrix.partition }}
        run: pnpm ci:e2e:${{ matrix.partition }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ci-test-results-${{ matrix.partition }}-${{ github.sha }}
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  # Required status check: passes only when every `pnpm run ci` partition passed.
  verify:
    needs: [changes, verify-static, verify-unit, verify-e2e]
    if: always() && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every pnpm run ci partition
        shell: bash
        env:
          STATIC_RESULT: ${{ needs.verify-static.result }}
          UNIT_RESULT: ${{ needs.verify-unit.result }}
          E2E_RESULT: ${{ needs.verify-e2e.result }}
        run: |
          set -euo pipefail
          echo "ci:static=$STATIC_RESULT ci:unit=$UNIT_RESULT ci:e2e=$E2E_RESULT" >> "$GITHUB_STEP_SUMMARY"
          for result in "$STATIC_RESULT" "$UNIT_RESULT" "$E2E_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "pnpm run ci partition did not pass: $result" >&2
              exit 1
            fi
          done

  ui-ux-rc-changes:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      required: ${{ steps.ui-changes.outputs.required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect UI-affecting changes
        id: ui-changes
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          required=true
          reason="manual run"
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              base_sha="$PR_BASE_SHA"
              head_sha="$PR_HEAD_SHA"
            else
              base_sha="$BEFORE_SHA"
              head_sha="$CURRENT_SHA"
            fi

            changed_files="$RUNNER_TEMP/ui-ux-rc-changed-files.txt"
            if [ -n "$base_sha" ] &&
              [ "$base_sha" != "0000000000000000000000000000000000000000" ] &&
              git diff --name-only "$base_sha" "$head_sha" > "$changed_files"
            then
              if grep -Eq '^(apps/web/|packages/ui/|packages/shared-types/|\.github/workflows/ci\.yml$|scripts/check-(web-ux-baseline|karne-visual-contract)\.mjs$|docs/ui-ux-professionalization-contract\.md$|design\.md$|tokens\.css$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|turbo\.json$|\.node-version$)' "$changed_files"; then
                reason="UI-affecting files changed"
              else
                required=false
                reason="no UI-affecting files changed"
              fi
            else
              reason="change range unavailable; fail-open"
            fi
          fi

          echo "required=$required" >> "$GITHUB_OUTPUT"
          echo "### UI/UX RC selection" >> "$GITHUB_STEP_SUMMARY"
          echo "- required: \`$required\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- reason: $reason" >> "$GITHUB_STEP_SUMMARY"

  ui-ux-rc:
    needs: ui-ux-rc-changes
    if: needs.ui-ux-rc-changes.outputs.required == 'true'
    runs-on: ubuntu-24.04
    # The Playwright image ships chromium and webkit with their system deps; apt installs of webkit deps took ~7 min.
    # The tag must equal the lockfile Playwright version (scripts/check-web-ux-baseline.mjs enforces it).
    # ux-rc has no screenshot goldens, so the container's fonts do not affect it.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001 --ipc=host
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm web:ux-rc:check

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-ux-rc-test-results-${{ github.sha }}
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  account-management-postgres:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: o_okul
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d o_okul"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/o_okul
      DIRECT_DATABASE_URL: postgresql://migration:migration@localhost:5432/o_okul
      EMPLOYEE_ACTIVATION_POSTGRES_TEST_URL: postgresql://app:app@localhost:5432/o_okul
      EMPLOYEE_ACTIVATION_POSTGRES_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/o_okul
      STUDENT_LICENSE_POSTGRES_TEST_URL: postgresql://app:app@localhost:5432/o_okul
      STUDENT_LICENSE_POSTGRES_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/o_okul
      ACCOUNT_MANAGEMENT_POSTGRES_REQUIRED: "1"
      DEVICE_BACKUP_POSTGRES_TEST_URL: postgresql://app:app@localhost:5432/o_okul
      DEVICE_BACKUP_POSTGRES_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/o_okul
      DEVICE_BACKUP_POSTGRES_REQUIRED: "1"
      EXAM_WORKSPACE_POSTGRES_TEST_URL: postgresql://app:app@localhost:5432/o_okul
      EXAM_WORKSPACE_POSTGRES_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/o_okul
      EXAM_WORKSPACE_POSTGRES_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - name: Bootstrap database roles
        env:
          PGPASSWORD: postgres
        run: psql --host localhost --username postgres --dbname o_okul --set ON_ERROR_STOP=1 --file docker/postgres/init/001_roles.sql
      - name: Bootstrap required extensions
        env:
          PGPASSWORD: postgres
        run: >-
          psql --host localhost --username postgres --dbname o_okul --set ON_ERROR_STOP=1
          --command "CREATE EXTENSION IF NOT EXISTS pg_trgm"
          --command "CREATE EXTENSION IF NOT EXISTS btree_gist"
      - name: Bootstrap tenant reset worker role
        env:
          PGHOST: localhost
          PGPASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: o_okul
        run: |
          sh docker/postgres/init/005_bootstrap_tenant_reset_worker_role.sh
          sh docker/postgres/init/006_bootstrap_device_restore_worker_role.sh
      - name: Apply database migrations
        run: pnpm --filter @o-okul/db exec prisma migrate deploy --config prisma.config.ts
      - name: Verify student grade-level migration and concurrency
        env:
          PGPASSWORD: postgres
          STUDENT_GRADE_LEVEL_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/o_okul_student_grade_level_test
        run: |
          createdb --host localhost --username postgres o_okul_student_grade_level_test
          pnpm --filter @o-okul/db db:student-grade-level:check:postgres
      - name: Build API PostgreSQL test dependencies
        run: pnpm --filter '@o-okul/api^...' build
      - name: Verify account-management PostgreSQL concurrency
        run: >-
          pnpm --filter @o-okul/api exec vitest run --no-file-parallelism --reporter=verbose
          src/identity-invitation/employee-account-activation-store.postgres.test.ts
          src/identity-invitation/identity-invitation-accept.postgres.test.ts
          src/user-management/account-management-backfill.postgres.test.ts
          src/student/student-license-concurrency.postgres.test.ts
          src/student/student-import-batch.postgres.test.ts
          src/auth/mfa-reenrollment.postgres.test.ts
          src/auth/guardian-login.postgres.test.ts
          src/tenant/tenant-reset-preview.postgres.test.ts
          src/operations/device-backup.postgres.test.ts
          src/operations/tenant-handover-export.postgres.test.ts
          src/exam/exam-workspace-progress-store.postgres.test.ts
          src/http/tenant-mutation-settle.postgres.test.ts
          src/listing/cursor-list-keyset.postgres.test.ts
