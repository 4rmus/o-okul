name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Docs-only pull requests run the light doc checks instead of the full suite (2026-10-12, UAT batching).
  # Pushes to main always run the full suite so deploy evidence stays complete.
  # Draft pull requests skip CI entirely; marking the PR ready for review triggers the full run (2026-10-13).
  changes:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
      ui: ${{ steps.classify.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          code=true
          ui=true
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ -n "${BASE_SHA:-}" ]; then
            changed="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")"
            non_docs="$(printf '%s\n' "$changed" | grep -Ev '^(docs/|status\.md$|README\.md$|PLAN\.md$)' | grep -v '^$' || true)"
            pinned_docs="$(printf '%s\n' "$changed" | grep -E '^docs/(evidence-manifests|measurement-baselines)/' || true)"
            if [ -n "$changed" ] && [ -z "$non_docs" ] && [ -z "$pinned_docs" ]; then
              code=false
            fi
            # Same UI-affecting file set as the ui-ux-rc job; non-UI pull requests run `pnpm run ci:core`
            # (the ci chain without the Playwright-backed web checks, scripts/run-ci-core.mjs).
            if ! printf '%s\n' "$changed" | grep -Eq '^(apps/web/|packages/ui/|packages/shared-types/|\.github/workflows/ci\.yml$|scripts/(check-(web-ux-baseline|karne-visual-contract)|run-ci-core)\.mjs$|docs/ui-ux-professionalization-contract\.md$|design\.md$|tokens\.css$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|turbo\.json$|\.node-version$)'; then
              ui=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "ui=$ui" >> "$GITHUB_OUTPUT"
          echo "full CI required: $code" >> "$GITHUB_STEP_SUMMARY"
          echo "Playwright web checks required: $ui" >> "$GITHUB_STEP_SUMMARY"

  docs-check:
    needs: changes
    if: needs.changes.outputs.code != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm ops:check
      - run: pnpm prod:plan:check
      - run: pnpm prod:readiness:check
      - run: pnpm prod:evidence:templates:check
      - run: pnpm privacy:sample-pii:check
      - run: pnpm agents:check

  verify:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - run: pnpm install --frozen-lockfile
      - if: needs.changes.outputs.ui == 'true'
        run: pnpm --filter @o-okul/web exec playwright install --with-deps chromium
      # Pushes to main and UI pull requests run the single `pnpm run ci` command that deploy evidence requires.
      - if: needs.changes.outputs.ui == 'true'
        run: pnpm run ci
      - if: needs.changes.outputs.ui != 'true'
        run: pnpm run ci:core

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ci-test-results-${{ github.sha }}
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  ui-ux-rc:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect UI-affecting changes
        id: ui-changes
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          required=true
          reason="manual run"
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              base_sha="$PR_BASE_SHA"
              head_sha="$PR_HEAD_SHA"
            else
              base_sha="$BEFORE_SHA"
              head_sha="$CURRENT_SHA"
            fi

            changed_files="$RUNNER_TEMP/ui-ux-rc-changed-files.txt"
            if [ -n "$base_sha" ] &&
              [ "$base_sha" != "0000000000000000000000000000000000000000" ] &&
              git diff --name-only "$base_sha" "$head_sha" > "$changed_files"
            then
              if grep -Eq '^(apps/web/|packages/ui/|packages/shared-types/|\.github/workflows/ci\.yml$|scripts/check-(web-ux-baseline|karne-visual-contract)\.mjs$|docs/ui-ux-professionalization-contract\.md$|design\.md$|tokens\.css$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|turbo\.json$|\.node-version$)' "$changed_files"; then
                reason="UI-affecting files changed"
              else
                required=false
                reason="no UI-affecting files changed"
              fi
            else
              reason="change range unavailable; fail-open"
            fi
          fi

          echo "required=$required" >> "$GITHUB_OUTPUT"
          echo "### UI/UX RC selection" >> "$GITHUB_STEP_SUMMARY"
          echo "- required: \`$required\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- reason: $reason" >> "$GITHUB_STEP_SUMMARY"

      - uses: pnpm/action-setup@v4
        if: steps.ui-changes.outputs.required == 'true'
        with:
          version: 11.5.0
          run_install: false

      - uses: actions/setup-node@v4
        if: steps.ui-changes.outputs.required == 'true'
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - if: steps.ui-changes.outputs.required == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.ui-changes.outputs.required == 'true'
        run: pnpm --filter @o-okul/web exec playwright install --with-deps chromium webkit
      - if: steps.ui-changes.outputs.required == 'true'
        run: pnpm web:ux-rc:check

      - uses: actions/upload-artifact@v4
        if: ${{ failure() && steps.ui-changes.outputs.required == 'true' }}
        with:
          name: ui-ux-rc-test-results-${{ github.sha }}
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  account-management-postgres:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: o_okul
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d o_okul"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/o_okul
      DIRECT_DATABASE_URL: postgresql://migration:migration@localhost:5432/o_okul
      EMPLOYEE_ACTIVATION_POSTGRES_TEST_URL: postgresql://app:app@localhost:5432/o_okul
      EMPLOYEE_ACTIVATION_POSTGRES_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/o_okul
      STUDENT_LICENSE_POSTGRES_TEST_URL: postgresql://app:app@localhost:5432/o_okul
      STUDENT_LICENSE_POSTGRES_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/o_okul
      ACCOUNT_MANAGEMENT_POSTGRES_REQUIRED: "1"
      DEVICE_BACKUP_POSTGRES_TEST_URL: postgresql://app:app@localhost:5432/o_okul
      DEVICE_BACKUP_POSTGRES_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/o_okul
      DEVICE_BACKUP_POSTGRES_REQUIRED: "1"
      EXAM_WORKSPACE_POSTGRES_TEST_URL: postgresql://app:app@localhost:5432/o_okul
      EXAM_WORKSPACE_POSTGRES_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/o_okul
      EXAM_WORKSPACE_POSTGRES_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - name: Bootstrap database roles
        env:
          PGPASSWORD: postgres
        run: psql --host localhost --username postgres --dbname o_okul --set ON_ERROR_STOP=1 --file docker/postgres/init/001_roles.sql
      - name: Bootstrap required extensions
        env:
          PGPASSWORD: postgres
        run: >-
          psql --host localhost --username postgres --dbname o_okul --set ON_ERROR_STOP=1
          --command "CREATE EXTENSION IF NOT EXISTS pg_trgm"
          --command "CREATE EXTENSION IF NOT EXISTS btree_gist"
      - name: Bootstrap tenant reset worker role
        env:
          PGHOST: localhost
          PGPASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: o_okul
        run: |
          sh docker/postgres/init/005_bootstrap_tenant_reset_worker_role.sh
          sh docker/postgres/init/006_bootstrap_device_restore_worker_role.sh
      - name: Apply database migrations
        run: pnpm --filter @o-okul/db exec prisma migrate deploy --config prisma.config.ts
      - name: Verify student grade-level migration and concurrency
        env:
          PGPASSWORD: postgres
          STUDENT_GRADE_LEVEL_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/o_okul_student_grade_level_test
        run: |
          createdb --host localhost --username postgres o_okul_student_grade_level_test
          pnpm --filter @o-okul/db db:student-grade-level:check:postgres
      - name: Build API PostgreSQL test dependencies
        run: pnpm --filter '@o-okul/api^...' build
      - name: Verify account-management PostgreSQL concurrency
        run: >-
          pnpm --filter @o-okul/api exec vitest run --no-file-parallelism --reporter=verbose
          src/identity-invitation/employee-account-activation-store.postgres.test.ts
          src/identity-invitation/identity-invitation-accept.postgres.test.ts
          src/user-management/account-management-backfill.postgres.test.ts
          src/student/student-license-concurrency.postgres.test.ts
          src/tenant/tenant-reset-preview.postgres.test.ts
          src/operations/device-backup.postgres.test.ts
          src/operations/tenant-handover-export.postgres.test.ts
          src/exam/exam-workspace-progress-store.postgres.test.ts
          src/http/tenant-mutation-settle.postgres.test.ts
