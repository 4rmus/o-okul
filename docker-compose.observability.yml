services:
  alertmanager-secrets-init:
    image: busybox:1.37.0
    user: "0:0"
    network_mode: none
    restart: "no"
    environment:
      ALERTMANAGER_SECRET_RELEASE: ${SENTRY_RELEASE:?SENTRY_RELEASE is required}
    command:
      - sh
      - -ec
      - |
        test -s /source/webhook-url
        test -s /source/webhook-token
        cp /source/webhook-url /target/.webhook-url.next
        cp /source/webhook-token /target/.webhook-token.next
        chown 65534:65534 /target/.webhook-url.next /target/.webhook-token.next
        chmod 400 /target/.webhook-url.next /target/.webhook-token.next
        mv /target/.webhook-url.next /target/webhook-url
        mv /target/.webhook-token.next /target/webhook-token
    volumes:
      - ${ALERTMANAGER_SECRETS_DIR:?ALERTMANAGER_SECRETS_DIR is required}:/source:ro
      - alertmanager_secrets:/target

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "127.0.0.1:${ALERTMANAGER_HOST_PORT:-9093}:9093"
    healthcheck:
      test: ["CMD", "/bin/amtool", "--alertmanager.url=http://127.0.0.1:9093", "alert", "query"]
      interval: 10s
      timeout: 5s
      retries: 6
    volumes:
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_secrets:/run/secrets/alertmanager:ro
      - alertmanager_data:/alertmanager
    networks:
      - backend_net
    depends_on:
      alertmanager-secrets-init:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    networks:
      - backend_net
    depends_on:
      - alertmanager

  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "127.0.0.1:${LOKI_HOST_PORT:-3101}:3100"
    volumes:
      - ./docker/loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - backend_net

  alloy:
    image: grafana/alloy:v1.16.0
    restart: unless-stopped
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "/etc/alloy/config.alloy"
    ports:
      - "127.0.0.1:${ALLOY_HOST_PORT:-12345}:12345"
    volumes:
      - ./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - backend_net
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is required}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3002}:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - backend_net
    depends_on:
      - prometheus
      - loki
      - alloy

networks:
  backend_net:

volumes:
  alertmanager_secrets:
  alertmanager_data:
  prometheus_data:
  loki_data:
  grafana_data:
